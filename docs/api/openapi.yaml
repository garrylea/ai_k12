    ParentUnreadAlerts:
      type: object
      description: >-
        未读预警轮询壳（`GET /parent/alerts/unread`，「及时可见」批 2026-09-20）。
        与 `ParentAlertPage` 的区别：不分页（无 `page`/`pageSize`），`items` 固定截**最新 5 条**，
        item 只带 Banner 展示字段（不含 `studentId`/`context`/`dialogueId`/`isRead`）。
      required: [items, total]
      properties:
        items:
          type: array
          maxItems: 5
          items:
            type: object
            required: [id, type, level, message, studentName, createdAt]
            properties:
              id:
                type: integer
              type:
                type: string
                description: 以代码为准（`SafetyAlertRow['type']`），同 `Alert.type`。
                enum: [off_topic, emotional, sensitive, abusive, away, idle]
              level:
                type: string
                enum: [info, warning, critical]
                description: 供 Banner 配色：`warning`/`critical` → 红，`info`（走神）→ 橙。
              message:
                type: string
              studentName:
                type: string
                nullable: true
              createdAt:
                type: string
                format: date-time
        total:
          type: integer
          description: 未读总数（Banner 文案「有 N 条新预警」用）。

