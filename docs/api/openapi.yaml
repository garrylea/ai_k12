              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PracticeResult'
    delete:
      tags: [Practice]
      summary: 重置练习记录（cardId 单卡 / lessonId 本课全部，互斥）
      operationId: resetPracticeResults
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cardId
          in: query
          required: false
          schema:
            type: integer
        - name: lessonId
          in: query
          required: false
