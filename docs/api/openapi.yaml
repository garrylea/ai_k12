                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ok: { type: boolean }
                        required: [ok]
        '400':
          description: wordId 非法

  /training/vocabulary/words/{wordId}/family:
    get:
      tags: [Training]
      summary: 词根族（点「+」号懒加载）
      description: >-
        词根族（student JWT，点「+」号时懒加载）。族的定义是「root_key 指向同一个中心词」，
        不建新表——`WHERE root_key = ?` 一句取全族，中心词自己也带 root_key=自己的 word
        （该不变式由内容管线的 check 保证）。返回 root（中心词）+ members（中心词排最前，
