  # 错题补偿套题（相似题专项练习，2026-09-21）
  /training/remediation/generate:
    post:
      tags: [Training]
      summary: 生成相似题套题（学生同意后）
      description: >-
        学生同意后生成错题补偿套题（student JWT）。请求体 {source, sessionId,
        wrongQuestionIds?}：source 枚举 exam|targeted（非法 400）；sessionId 须正整数
        （非法 400）；source='targeted' 时 wrongQuestionIds 必带、最多 50 个、元素须为
        正整数（否则 400）。exam 来源由后端从考试会话推导错题（会话不存在/非本人 404，
        尚未交卷 400）；targeted 来源前端提交题号不可信——逐个回查错题本，只认
        source='targeted' 的未清错题。同步建组 + 题库抽题，AI 补题 fire-and-forget
        （不 await）；无错题 / 错题全下线 / 全无 primary 考点 → 不建套题、全 0 返回
        （setId: 0，仅限本次新建时——若已有 active 套题则是追加合并，返回既有 setId）；
        已有 active 套题则追加合并。并发安全：remediation_sets 有唯一键 uniq_rsets_active，
        两处同时生成时后到者复用赢家的套题。Nest @Post 默认返回 201。
      operationId: generateRemediationSet
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemediationGenerateRequest'
      responses:
        '201':
          description: 套题概要（无错题时不建套题，setId=0 且各计数为 0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RemediationGenerateResult'
        '400':
          description: 参数非法（source/sessionId/wrongQuestionIds）或考试尚未交卷
        '404':
          description: 考试会话 / 专项练习会话不存在或非本人

  /training/remediation/me:
    get:
      tags: [Training]
      summary: 当前 active 套题概要
      description: >-
        当前 active 相似题套题概要（student JWT，三卡页提示条用）。无套题时返回
        {active:false, setId:null, groupCount:0, itemCount:0, correctCount:0}。
        顺带对 ai_pending_count > 0 的组做惰性重试（覆盖进程重启悬挂的 AI 补题；
        fire-and-forget、不 await）。
      operationId: getRemediationOverview
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 套题概要
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RemediationOverview'

  /training/remediation/questions:
    get:
      tags: [Training]
      summary: 拉取未答对题目（作答页）
      description: >-
        作答页拉取未答对题目（student JWT，白名单序列化 {questionId, text, type,
        options}）。options 为 JSON 字符串 parse 后的数组，可为 null（题无选项/坏
        JSON）。题目被下线（is_active=0）时直接标对（防套题死锁）；全对时后端
        deleteSet 并返回 {questions: [], itemCount: N, correctCount: N}。
      operationId: getRemediationQuestions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 未答对题单（可能为空数组）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RemediationQuestionsResult'

  /training/remediation/answers:
    post:
      tags: [Training]
      summary: 逐题提交作答
      description: >-
        逐题提交作答（student JWT）。请求体 {questionId, studentAnswer}；questionId 须
        正整数、studentAnswer 须 string（否则 400）。判题复用 JudgeCoreService
        （source='remediation'，不入错题本、不清零原错题、不参与主线清零门禁）；首次
        作答即发分（task_code='remediation_question'，幂等键 dedupe_key='rem:<item.id>'，
        ref_type='question'、ref_id=questions.id），答对置 is_correct=1，全部答对时
        物理删除套题。Nest @Post 默认返回 201。
      operationId: submitRemediationAnswer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemediationAnswerRequest'
      responses:
        '201':
          description: 判题与发分结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RemediationAnswerResult'
        '400':
          description: 参数非法 / 无进行中套题 / 该题不在当前套题中 / 该题已答对

  /training/remediation/self-assess:
    post:
      tags: [Training]
      summary: 套题内主观题自评
      description: >-
        套题内主观题自评（student JWT）。请求体 {questionId, assessment}；assessment
        枚举 correct|incorrect（非法 400）。刻意不经 judgeCore.recordSelfAssessment：
        直接 requireItem + applyOutcome，故套题内自评同样不入错题本 / 不清零 / 不发
        error_fix（method='self_assess'，errorType/referenceAnswer/explanation 为 null）。
        响应结构与 /answers 完全一致。Nest @Post 默认返回 201。
      operationId: selfAssessRemediation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemediationSelfAssessRequest'
      responses:
        '201':
          description: 自评与发分结果（结构与 /answers 一致）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RemediationAnswerResult'
        '400':
          description: 参数非法 / 无进行中套题 / 该题不在当前套题中 / 该题已答对

  # Exams
  /exams/papers:
    get:
      tags: [Exams]
      summary: 试卷列表
      description: >-
        真题试卷列表（student JWT，@Roles('student')）。subjectId 必填 integer；
        year（integer）/district/examType/gradeBand（string）可选叠加筛选；
        按 year DESC, id DESC 排序。列表仅试卷元数据（不含题目）。
      operationId: listExamPapers
      security: [{ bearerAuth: [] }]
      parameters:
        - name: subjectId
          in: query
          required: true
          schema:
            type: integer
          description: 学科 id（必填，非整数 400）
        - name: year
          in: query
          required: false
          schema:
            type: integer
          description: 年份过滤（非数字忽略）
        - name: district
          in: query
          required: false
          schema:
            type: string
          description: 地区过滤
        - name: examType
          in: query
          required: false
          schema:
            type: string
          description: 试卷类型过滤
        - name: gradeBand
          in: query
          required: false
          schema:
            type: string
          description: 学段过滤（primary/junior/senior）
      responses:
        '200':
          description: 试卷列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExamPaper'

  /exams/papers/{id}:
    get:
      tags: [Exams]
      summary: 试卷详情（题目元数据 + 推荐时长）
      description: >-
        试卷详情（student JWT）。durationMinutes 为推荐时长：choice/true_false
        每题 1 分钟、其余每题 3 分钟，总和向上取整到 15 的倍数，clamp 到
        [30, 180]。白名单序列化：questions 只含
        questionId/questionNo/text/type/options（options 为 JSON 字符串
        parse 后的数组，无/坏 JSON 为 null），answer/explanation 一律剥离
        （考试防作弊）。试卷不存在 404。
      operationId: getExamPaperDetail
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 试卷 id
      responses:
        '200':
          description: 试卷详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExamPaperDetail'
        '404':
          description: 试卷不存在

  /exams/sessions:
    post:
      tags: [Exams]
      summary: 开考/续考
      description: >-
        开考或续考（student JWT）。durationMinutes 限 10-300 整数
        （越界/非整数 400）；试卷不存在 404。续考语义：同学生同卷已有
        in_progress 会话直接返回既有会话（deadlineAt 不变、不重置时长），
        否则新建（deadline = now + duration）。命中的续考会话已超时则
        先自动收卷再返回 status='submitted'（不新建）。新建/续考响应同构。
      operationId: createExamSession
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamSessionCreateRequest'
      responses:
        '200':
          description: 会话已创建或续考（含题单与剩余秒数）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExamSessionCreated'
        '400':
          description: durationMinutes 越界（仅允许 10-300 的整数）
        '404':
          description: 试卷不存在

  /exams/sessions/{id}:
    get:
      tags: [Exams]
      summary: 会话状态（断线恢复）
      description: >-
        考试会话状态（student JWT）。会话不存在 404；非本人 403。
        answered 为 questionId -> {answerText} map，只含作答文本，
        判题字段（对错/题解）一律剥离（考试防作弊）。发现已超 deadline
        的 in_progress 会话时服务端自动收卷（与手动交卷同一 finalize
        逻辑）后返回 status='submitted'、remainingSeconds=0。
      operationId: getExamSession
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 会话 id
      responses:
        '200':
          description: 会话状态（可能已被自动收卷为 submitted）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExamSessionState'
        '403':
          description: 无权访问该考试会话（非本人）
        '404':
          description: 考试会话不存在

  /exams/sessions/{id}/answers:
    post:
      tags: [Exams]
      summary: 单题提交（同步判题，白名单响应）
      description: >-
        考试逐题作答（student JWT）。同步走 JudgeCore（source='exam',
        sourceRefId=sessionId）：客观题 exact 即返，主观题 AI 判定
        （judgment per-scene 90s）；判题结果全量落 exam_answers，
        答错由 JudgeCore 写 main_error_books。判题失败先落 answerText
        （在途，is_correct NULL，交卷时统一补判）、错误透传前端重试。
        响应白名单 {saved:true}——不回传对错（考试防作弊设计，
        对错只在交卷后的 results 出现）。错误：题目不在题单 400；
        已交卷再提交 409（code=4101）；超 deadline 先自动收卷再 409
        （code=4102，未作答按错计一并落库）。
      operationId: submitExamAnswer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 会话 id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamSubmitAnswerRequest'
      responses:
        '200':
          description: 已保存（白名单，不含对错）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExamAnswerSaved'
        '400':
          description: 题目不在该试卷题单中
        '409':
          description: 已交卷（code=4101）或超时已自动收卷（code=4102）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 4102
                  message:
                    type: string
                    example: 考试时间已到，已自动收卷
        '403':
          description: 无权访问该考试会话（非本人）
        '404':
          description: 考试会话不存在

  /exams/sessions/{id}/submit:
    post:
      tags: [Exams]
      summary: 交卷（幂等）
      description: >-
        交卷（student JWT，幂等：已 submitted 直接重算汇总返回）。
        收卷三分支（手动交卷与超时自动收卷共用 finalize）：未作答 ->
        直接判错入错题本（method='unanswered'，无答案可判不走判题）；
        在途（有作答、is_correct NULL）-> JudgeCore 补判，失败按错计
        （method='failed'）仍入错题本；已判题 -> 跳过。最后
        markSubmitted 并返回汇总（accuracy 为百分比一位小数）。
      operationId: submitExam
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 会话 id
      responses:
        '200':
          description: 交卷汇总（重复调用幂等返回）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExamSubmitResult'
        '403':
          description: 无权访问该考试会话（非本人）
        '404':
          description: 考试会话不存在

  /exams/sessions/{id}/results:
    get:
      tags: [Exams]
      summary: 结果页（逐题对错 + 解析）
      description: >-
        考试结果（student JWT）：仅 submitted 会话可查，in_progress 409
        （code=4103）。items JOIN questions 带解析：逐题
        isCorrect（0|1|null，null=主观题待自评）、answerText、
        answer（参考答案，自评对照展示）、needsSelfAssessment（主观题待自评）、
        selfAssessment（该生最近一次自评 correct|incorrect|null）、
        analysis（判题题解）与 explanation（题库解析）；内嵌与交卷汇总同构的
        correctCount/totalCount/accuracy/subjectiveCount——主观题
        （self_assess 模式 is_correct=NULL）不计对错，correctCount/accuracy
        只算客观题。跨模式口径：subjectiveCount 按 is_correct NULL 推断，
        遗留 ai 模式已判主观行（is_correct 非 NULL）计为客观错题。
      operationId: getExamResults
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 会话 id
      responses:
        '200':
          description: 逐题结果与汇总
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExamResults'
        '409':
          description: 考试尚未交卷，暂无成绩（code=4103）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 4103
                  message:
                    type: string
                    example: 考试尚未交卷，暂无成绩
        '403':
          description: 无权访问该考试会话（非本人）
        '404':
          description: 考试会话不存在

