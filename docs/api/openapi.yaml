          type: number
          nullable: true
          description: 正确率（百分比，一位小数）；`answered = 0` 时为 null，**不是 0**。

    SelfAssessSummary:
      type: object
      description: 主观题自评结果，**不进 rate**（spec §4.3）。
      properties:
        count:
          type: integer
        correctCount:
          type: integer

    ErrorBookSummary:
      type: object
      properties:
        uncleared:
          type: integer
        total:
          type: integer

    DashboardSubjectProgress:
      type: object
      description: 取自 `ProgressService.getStarMap` 的现有返回（不新增查询、不改其结构）。
      properties:
        completedUnits:
          type: integer
        totalUnits:
          type: integer
        currentUnitName:
          type: string
          nullable: true
        currentLessonName:
          type: string
          nullable: true
        percent:
          type: integer
          description: "`completedUnits / totalUnits * 100` 取整；`totalUnits = 0` 时为 0。"

    DashboardSubject:
      type: object
      description: 只包含该学生**已开始**的学科（`progress.status <> 'not_started'`），未开始的不出现。
      properties:
        subjectId:
          type: integer
        subjectName:
          type: string
        progress:
          $ref: '#/components/schemas/DashboardSubjectProgress'
        accuracy:
          $ref: '#/components/schemas/RateSummary'
        selfAssessed:
          $ref: '#/components/schemas/SelfAssessSummary'
        errorBook:
          $ref: '#/components/schemas/ErrorBookSummary'
        examCount:
          type: integer

    DashboardStudent:
      type: object
      properties:
        studentId:
          type: integer
        name:
          type: string
        grade:
          type: string
          nullable: true
        schoolLevel:
          type: string
          nullable: true
        lastActiveAt:
          type: string
          format: date-time
          nullable: true
          description: 多表时间并集 MAX，**不限时间窗**；无记录为 null。只在孩子层级出现，学科卡片里没有。
        activeDays7:
          type: integer
          description: 近 7 天有记录的天数（带 7 天下界）。与 `lastActiveAt` 窗口不同，分两次查。
        unreadAlerts:
          type: integer
          description: 本期恒 0（`safety_alerts` 无写入），保留占位等预警闭环后填。
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/DashboardSubject'

    Dashboard:
      type: object
      properties:
        students:
          type: array
          items:
            $ref: '#/components/schemas/DashboardStudent'
        unreadAlerts:
          type: integer

    TrendPoint:
      type: object
      description: 折线的一点。只含有记录的天，**不补零**。
      properties:
        date:
          type: string
          description: "`YYYY-MM-DD`"
        answered:
          type: integer
        correct:
          type: integer
        rate:
          type: number
          nullable: true
          description: "`answered = 0` 时为 null。"

    ReportStats:
      type: object
      properties:
        activeDays:
          type: integer
        answered:
          type: integer
        correct:
          type: integer
        rate:
          type: number
          nullable: true
        selfAssessCount:
          type: integer
        errorsAdded:
          type: integer
          description: 窗口内 `main_error_books.created_at` 条数（「新进错题本」，不等于「本周答错的题」）。
        errorsCleared:
          type: integer
          description: 窗口内 `main_error_books.cleared_at` 条数（`is_cleared = 1`）。
        examCount:
          type: integer
          description: 窗口内 `exam_sessions.submitted_at` 且 `status='submitted'` 的场次。

    ReportSubjectRow:
      type: object
      properties:
        subjectId:
          type: integer
        subjectName:
          type: string
        answered:
          type: integer
        correct:
          type: integer
        rate:
          type: number
          nullable: true

    WeakPointItem:
      type: object
      description: >-
        **错题数代理，不是掌握度**：按未清零错题数聚合，`student_knowledge_mastery`
        全仓零写入。Top 10，累计口径（不限窗口）。
      properties:
        knowledgePointId:
          type: integer
        name:
          type: string
        unclearedCount:
          type: integer
        totalWrongCount:
          type: integer

    ExamRecord:
      type: object
      properties:
        sessionId:
          type: integer
        paperTitle:
          type: string
        subjectName:
          type: string
        submittedAt:
          type: string
          format: date-time
        correctCount:
          type: integer
        objectiveCount:
          type: integer
        rate:
          type: number
          nullable: true

    LearningReport:
      type: object
      description: >-
        **实时聚合，不落 `learning_reports`、不调 LLM**（spec §3 定案 #2）。取代了原
        `id/generatedAt/content`（AI 文本 `ReportContent`）形状；`{reportId}` 端点已降级出 MVP。
      properties:
        studentId:
          type: integer
        period:
          type: string
          enum: [weekly, monthly]
        windowStart:
          type: string
          description: 窗口起始日 `YYYY-MM-DD`（含）。
        windowEnd:
          type: string
          description: 窗口结束日 `YYYY-MM-DD`（含）。
        stats:
          $ref: '#/components/schemas/ReportStats'
        trend:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/ReportSubjectRow'
        weakPoints:
          type: array
          description: Top 10，按 `unclearedCount` 降序、`totalWrongCount` 次之。
          items:
            $ref: '#/components/schemas/WeakPointItem'
        weakPointsUncoveredCount:
          type: integer
          description: 仍未清零里**映射不到任何知识点**的错题数（实测约占 60%），UI 必须显式提示。
        exams:
          type: array
          description: 全部考试史（不限窗口），按 `submitted_at` 降序，最多 20 场。
          items:
            $ref: '#/components/schemas/ExamRecord'

    ParentErrorQuestion:
      type: object
      description: 错题里嵌套的题目信息；`main_error_books.question_id` 为 NULL 时整个 `question` 为 null。
      properties:
        content:
          type: string
        type:
          type: string
        difficulty:
          type: integer
          nullable: true
        knowledgePoints:
          type: array
          description: 未绑知识点时是**空数组**，不是 null。
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string

    ParentErrorItem:
      type: object
      description: 家长端错题一行（只读）。`track` 由 `source` 现算、**不落库**（分档见 `TRACK_SOURCES`）。
      properties:
        id:
          type: integer
        questionId:
          type: integer
          nullable: true
        track:
          type: string
          enum: [main, training]
          description: "`training` = `targeted | error_practice | auxiliary`，其余 → `main`。"
        source:
          type: string
          enum: [practice, discuss, exam, targeted, error_practice, auxiliary]
        level:
          type: integer
          description: 错题级别 1–5。
        isCleared:
          type: boolean
        wrongAnswerText:
          type: string
          nullable: true
          description: >-
            ⚠️ 字段名历史误导：它装的**不是**学生作答，而是「题库未命中时保存的题面原文」
            （`questionId` 非空时恒为 null，题面取 `question.content`）。库里从未存过学生作答文本。
        createdAt:
          type: string
          format: date-time
        clearedAt:
          type: string
          format: date-time
          nullable: true
        question:
          allOf:
            - $ref: '#/components/schemas/ParentErrorQuestion'
          nullable: true

    ParentErrorPage:
      type: object
      description: 分页壳。`pageSize` 服务端固定 20，前端不传、只回显。
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ParentErrorItem'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    ChatLogMessage:
      type: object
      description: >-
        逐句消息。**不回传 `token_input` / `token_output` / `response_time_ms`**——那三列全仓恒 NULL。
      properties:
        id:
          type: integer
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
        reasoning:
          type: string
          nullable: true
          description: AI 思考链，前端默认折叠。
        type:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        safetyFlag:
          type: integer
          description: >-
            1 = 该条被安全标记（**偏离学习**）。⚠️ 2026-09-20 起是**双来源**：
            被模型判为闲聊（`<!--topic:off-->` 标记）**或** 被阻断（现在只剩情绪/敏感）；
            此前只有「被硬阻断的轮次」一种来源。家长端文案已从「闲聊」改成「偏离学习」。
        createdAt:
          type: string
          format: date-time
        images:
          type: array
          items:
            type: string
          description: >-
            孩子随消息发的图片 URL（形如 `/uploads/auxiliary/xxx.jpg`）。
            服务端从 `ai_messages.attachments` 的 JSON 串解析、只留 `type == 'image'`；
            无附件时是**空数组**（不是 null）。`file` 类型（PDF 提取任务）本期不下发。
            前端**不要**对它用 `resolveAsset`——`/uploads/` 已是绝对路径。

    ChatLogItem:
      type: object
      description: 会话列表一行。
      properties:
        id:
          type: integer
        track:
          type: string
          enum: [mainline, auxiliary]
        scene:
          type: string
          enum: [aux_qna, aux_training, mainline_question, mainline_card]
        title:
          type: string
          nullable: true
        subjectId:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: >-
            **最后一条消息时间**（该会话内 `deleted_at IS NULL` 的消息的最大 `created_at`）；
            会话无消息时退回创建时间。与共享 `Conversation.updatedAt`（= `ai_dialogues.updated_at`）
            口径不同，勿混。
        messageCount:
          type: integer
        blockCount:
          type: integer
          description: >-
            该会话里 `safety_flag = 1` 的消息数 = **被判闲聊 或 被阻断** 的轮次（双来源，见 `ChatLogMessage.safetyFlag`）。

    ChatLogDetail:
      allOf:
        - $ref: '#/components/schemas/ChatLogItem'
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/ChatLogMessage'

    ChatLogPage:
      type: object
      description: 分页壳。`pageSize` 服务端固定 20，前端不传、只回显。
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatLogItem'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    ParentAccount:
      type: object
      description: >-
        家长账号信息（P6.10，2026-09-20 实现，**只读**）。
        ⚠️ 原 schema 里的 `parent` / `subscription` / `quota` 是**文档漂移**：`AIQuota` 类型不存在、
        订阅与额度也没有表（属 P7.1）→ 已收敛为下列三字段。
      properties:
        id:
          type: integer
        name:
          type: string
          nullable: true
          description: 家长姓名，注册时不强制 → 可为 null（前端显示「未设置」）。
        phone:
          type: string

    Quota:
      type: object
      properties:
        planName:
          type: string
        totalTokens:
          type: integer
        usedTokens:
          type: integer
        remainingTokens:
          type: integer
        resetAt:
          type: string
          format: date-time

    JudgeRequest:
      type: object
      required: [cardId, lessonId, subjectId, questionN, questionText, studentAnswer]
      properties:
        cardId:
          type: integer
          description: 当前 practice 卡片 ID
        lessonId:
          type: integer
          description: 当前课程 ID
        subjectId:
          type: integer
          description: 学科 ID
        questionN:
          type: string
          description: 卡内复合题号（如 "0-1"），practice_results upsert 去重键
        questionText:
          type: string
          description: 题面原文（取自 cards.content_metadata.questions[].text）
        studentAnswer:
          type: string
          description: 学生提交的答案文本

    JudgeResult:
      type: object
      properties:
        questionId:
          type: integer
          nullable: true
          description: 题库命中时的 questions.id；未命中且结构化失败时为 null（错题仅存题面）
        isCorrect:
          type: boolean
        method:
          type: string
          enum: [exact, ai]
          description: exact=客观题答案比对；ai=JudgmentCapability 判定
        errorType:
          type: string
          nullable: true
          enum: [logic, calculation, format, missing]
          description: AI 判定的错误类型，仅 method=ai 时返回
        errorBookId:
          type: integer
          nullable: true
          description: 答错时写入 main_error_books 的 id；答对或 AI 判定失败时不返回
        pointsAwarded:
          type: integer
          description: >-
            本次**实际入账**的积分（甲类逐目标发分，error_fix，2026-09-17）。
            0 = 本次没加：答错 / source='exam'（考试补判路径不参与发分）/ 未清掉任何
            错题（not_cleared）/ 无题库身份（questionId=null）/ 幂等命中（duplicate，
            本次未入账）/ daily_limit / no_rule / tier_inactive / 发分失败。
            前端 `> 0` 弹「+N 分」轻反馈。
        awardReason:
          allOf:
            - $ref: '#/components/schemas/PointsAwardReason'
          description: 未发分原因；无值=静默（duplicate 刻意不在枚举内）

    HintRequest:
      type: object
      required: [cardId, lessonId, subjectId, questionText]
      properties:
        cardId:
          type: integer
          description: 当前 practice 卡片 ID
        lessonId:
          type: integer
          description: 当前课程 ID
        subjectId:
          type: integer
          description: 学科 ID
        questionText:
          type: string
          description: 题面原文，同时作为 cards.hints JSON 的 key（即「题目标题」）

    HintResult:
      type: object
      properties:
        hint:
          type: string
          description: 苏格拉底式提示文本（只启发不给答案，公式用 $...$ LaTeX）
        cached:
          type: boolean
          description: true=命中 cards.hints 缓存直返（未调 AI）；false=本次 AI 新生成并已写回缓存

    DiscussRequest:
      type: object
      required: [cardId, lessonId, subjectId, questionText]
      properties:
        cardId:
          type: integer
          description: 当前 practice 卡片 ID（限定讨论范围 + 错题本 source_ref_id）
        lessonId:
          type: integer
          description: 当前课程 ID
        subjectId:
          type: integer
          description: 学科 ID
        questionText:
          type: string
          description: 题面原文；question_id 为空时作为错题本去重键（wrong_answer_text）

    DiscussResult:
      type: object
      properties:
        dialogueId:
          type: string
          description: mainline 对话 id，前端据此走 /ai/tutor/stream 做苏格拉底讨论
        errorBookId:
          type: integer
          description: 本次命中或新建的主线错题本记录 id
        questionId:
          type: integer
          nullable: true
          description: 题库中的题目 id（content_hash 未命中则为 null）

    DiscussCardRequest:
      type: object
      required: [cardId, lessonId, subjectId]
      properties:
        cardId:
          type: integer
          description: 当前知识卡片 ID（限定讨论范围）
        lessonId:
          type: integer
          description: 当前课程 ID
        subjectId:
          type: integer
          description: 学科 ID

    DiscussCardResult:
      type: object
      properties:
        dialogueId:
          type: string
          description: mainline 对话 id（find-or-create：可能复用已有讨论），前端据此走 /ai/tutor/stream 做苏格拉底讨论

    PreviousErrorDetail:
      type: object
      description: 一条未清零课堂练习错题（错题清零用）
      properties:
        errorBookId:
          type: integer
          description: main_error_books.id，清零后仍错时用于 bump level
        cardId:
          type: integer
          description: 卡片 id（main_error_books.source_ref_id），判题复用
        questionN:
          type: string
          description: 卡内复合题号（如 "0-1"）；历史行未回填时合成 cleanup 加 id 的唯一键
        questionText:
          type: string
          description: 题面（question_id 非空取 questions.content，否则取 wrong_answer_text）
        questionId:
          type: integer
          nullable: true
          description: 题库 id，未入库为 null
      required: [errorBookId, cardId, questionN, questionText, questionId]

    UnclearedErrorsResult:
      type: object
      properties:
        errors:
          type: array
          description: 未清零错题列表（已按 cardId+questionN 去重）；计数 = errors.length
          items:
            $ref: '#/components/schemas/PreviousErrorDetail'
      required: [errors]

    BumpErrorLevelsRequest:
      type: object
      properties:
        errorBookIds:
          type: array
          items:
            type: integer
          description: 清零后仍错的 main_error_books.id 列表
      required: [errorBookIds]

    TrainingErrorBookEntry:
      type: object
      description: 错题练习列表条目（未清零记录；同一错题挂多 KP 时按 errorBookId 聚合）
      properties:
        errorBookId:
          type: integer
          description: main_error_books.id
        questionId:
          type: integer
          nullable: true
          description: 题库题目 id（历史行未入库为 null）
        questionText:
          type: string
          description: 题面（question_id 非空取 questions.content，否则取 wrong_answer_text）
        type:
          type: string
          nullable: true
          description: 题型（questions.type；题目未入库为 null）
        level:
          type: integer
          description: 错题严重程度（重做仍错递增）
        createdAt:
          type: string
          format: date-time
          description: 入错题本时间（ISO 8601）
        kpIds:
          type: array
          items:
            type: integer
          description: 该题关联的知识点 id 列表（无关联为空数组）
      required: [errorBookId, questionId, questionText, type, level, createdAt, kpIds]

    TrainingJudgeRequest:
      type: object
      required: [questionId, subjectId, studentAnswer, source]
      properties:
        questionId:
          type: integer
          description: 题库题目 id（训练题必来自题库；题目不存在 400/code=4004）
        subjectId:
          type: integer
          description: 学科 ID
        studentAnswer:
          type: string
          description: 学生提交的答案文本
        source:
          type: string
          enum: [targeted, error_practice]
          description: 训练来源——targeted=专项练习；error_practice=错题练习（非法值 400）
        sessionId:
          type: integer
          nullable: true
          description: >-
            可选：本轮训练会话 id（乙类会话页专用）。只用于累加
            training_sessions.judged_count 审计留痕，不传也能判题；会话不存在 /
            非本人 / 已完成都静默跳过，不报错

    TrainingSelfAssessRequest:
      type: object
      required: [questionId, subjectId, assessment, source]
      properties:
        questionId:
          type: integer
          description: 题库题目 id（题目不存在 404）
        subjectId:
          type: integer
          description: 学科 ID
        assessment:
          type: string
          enum: [correct, incorrect]
          description: correct=学生自评做对；incorrect=学生自评做错（非法值 400）
        source:
          type: string
          enum: [targeted, error_practice, exam]
          description: 自评来源——targeted=专项练习；error_practice=错题练习；exam=考试结果页自评（非法值 400）
        sourceRefId:
          type: integer
          nullable: true
          description: 考试来源传 sessionId；其余来源不传或传 null

    TrainingHintRequest:
      type: object
      required: [questionId]
      properties:
        questionId:
          type: integer
          description: 题库题目 id（题目不存在 404）

    TrainingHintResult:
      type: object
      properties:
        hint:
          type: string
          description: 苏格拉底式提示文本（只启发不给答案）
        cached:
          type: boolean
          description: true=命中 question_hints 题级缓存直返（未调 AI）；false=本次 AI 新生成并已写回缓存

    TrainingKnowledgePoint:
      type: object
      description: 专项练习知识点（平铺列表，树形组装放前端）
      properties:
        id:
          type: integer
          description: 知识点 id
        name:
          type: string
          description: 知识点名称
        parentKpId:
          type: integer
          nullable: true
          description: 父知识点 id（顶级为 null，前端据此组树）
        gradeBand:
          type: string
          description: 学段（primary/junior/senior）

    TargetedStartRequest:
      type: object
      required: [subjectId, kpId, type, count]
      properties:
        subjectId:
          type: integer
          description: 学科 ID
        kpId:
          type: integer
          description: 知识点 id
        type:
          type: string
          nullable: true
          enum: [choice, fill_blank, true_false, short_answer, proof]
          description: 题型过滤；null=不限题型（白名单外取值 400）
        count:
          type: integer
          minimum: 1
          maximum: 20
          description: 抽题数量，限 1-20 整数（越界/非整数 400）

    TargetedStartResult:
      type: object
      properties:
        questions:
          type: array
          description: 随机题单（白名单序列化，answer/explanation 剥离；抽不到题为空数组）
          items:
            $ref: '#/components/schemas/TargetedPracticeQuestion'
      required: [questions]

    TargetedPracticeQuestion:
      type: object
      properties:
        questionId:
          type: integer
          description: 题库题目 id
        text:
          type: string
          description: 题面原文
        type:
          type: string
          description: 题型（choice/fill_blank/true_false/short_answer/proof）
        options:
          type: array
          items: {}
          nullable: true
          description: 选项数组（DB JSON 字符串 parse 后；无/坏 JSON 为 null）

    RemediationGenerateRequest:
      type: object
      required: [source, sessionId]
      properties:
        source:
          type: string
          enum: [exam, targeted]
          description: 来源——exam=真题考试交卷结果页；targeted=数学专项完成页（非法 400）
        sessionId:
          type: integer
          description: >-
            来源会话 id（exam=考试会话，targeted=专项练习会话）；须正整数（非法 400），
            不存在 / 非本人 404
        wrongQuestionIds:
          type: array
          maxItems: 50
          description: >-
            仅 source='targeted' 必带；前端提交的错题号（最多 50 个、须正整数，否则 400）。
            后端不信任：逐个回查错题本，只认 source='targeted' 的未清错题
          items:
            type: integer
            minimum: 1

    RemediationGenerateResult:
      type: object
      description: >-
        套题概要。无错题 / 错题全下线 / 全无 primary 考点时**本次新建**的套题不保留，
        setId=0 且各计数为 0；若调用时已有 active 套题（含并发下后到者复用赢家），
        则返回既有 setId，此时 groupsCreated=0 只表示「三元组都已存在」。
      properties:
        setId:
          type: integer
          description: active 套题 id；0 = 本次未建套题（无可生成的错题）
        groupsCreated:
          type: integer
          description: 本次新建的组数（撞三元组唯一键而跳过的组不计）
        itemsCreated:
          type: integer
          description: 本次入套的题数（题库抽题 + 已有 AI 题）
        skippedNoKp:
          type: integer
          description: 因错题无 primary 考点而整组跳过的组数
        aiPendingCount:
          type: integer
          description: 交 AI 异步补题的缺口总数
      required: [setId, groupsCreated, itemsCreated, skippedNoKp, aiPendingCount]

    RemediationOverview:
      type: object
      description: active 套题概要（无套题时 active=false、setId=null、各计数为 0）。
      properties:
        active:
          type: boolean
        setId:
          type: integer
          nullable: true
          description: active 套题 id；无套题时为 null
        groupCount:
          type: integer
        itemCount:
          type: integer
        correctCount:
          type: integer
      required: [active, setId, groupCount, itemCount, correctCount]

    RemediationQuestionsResult:
      type: object
      description: >-
        未答对题单（全对时后端已清套，返回 questions: []、correctCount == itemCount）。
      properties:
        questions:
          type: array
          items:
            $ref: '#/components/schemas/RemediationQuestion'
        itemCount:
          type: integer
          description: 套题总题数
        correctCount:
          type: integer
          description: 已答对题数
      required: [questions, itemCount, correctCount]

    RemediationQuestion:
      type: object
      description: 作答页题目（白名单序列化，answer/explanation 等一律剥离）。
      properties:
        questionId:
          type: integer
        text:
          type: string
          description: 题面原文
        type:
          type: string
          description: 题型（choice/fill_blank/true_false/short_answer/proof）
        options:
          type: array
          nullable: true
          description: 选项数组（DB JSON 字符串 parse 后）；题无选项/坏 JSON 时为 null
          items: {}
      required: [questionId, text, type, options]

    RemediationAnswerRequest:
      type: object
      required: [questionId, studentAnswer]
      properties:
        questionId:
          type: integer
          description: 题库题目 id（须正整数，否则 400）
        studentAnswer:
          type: string
          description: 学生提交的答案文本（须 string，否则 400）

    RemediationSelfAssessRequest:
      type: object
      required: [questionId, assessment]
      properties:
        questionId:
          type: integer
          description: 题库题目 id（须正整数，否则 400）
        assessment:
          type: string
          enum: [correct, incorrect]
          description: 学生自评对错（非法 400）

    RemediationPointsAward:
      type: object
      description: >-
        发分结果（原样回带 AwardResult；字段名 pointsAwarded，与埋点响应的
        PointsAwardDto——{awarded, levelUp: code 串}——不是同一形状）。
      properties:
        pointsAwarded:
          type: integer
          description: 本次实际入账分（0 = 本次未入账，含幂等命中）
        balance:
          type: integer
          description: 发分后的可用余额
        totalEarned:
          type: integer
          description: 累计获得（段位依据）
        levelUp:
          type: object
          nullable: true
          description: 本次是否跨档；未跨档为 null
          properties:
            from:
              $ref: '#/components/schemas/PointsLevelInfo'
            to:
              $ref: '#/components/schemas/PointsLevelInfo'
        reason:
          type: string
          enum: [daily_limit, no_rule, tier_inactive, duplicate]
          description: 未发分原因（无值=静默）；duplicate=幂等命中，本次未入账

    RemediationAnswerResult:
      type: object
      description: 逐题作答 / 自评结果（/answers 与 /self-assess 同构）。
      properties:
        isCorrect:
          type: boolean
          nullable: true
          description: 判题对错；主观题待自评/未判时为 null
        method:
          type: string
          description: 判题方法（exact / ai / self_assess / unanswered）
        errorType:
          type: string
          nullable: true
          description: 错因枚举（logic/calculation/format/missing）；无错因为 null
        needsSelfAssessment:
          type: boolean
          description: 是否待学生自评（主观题）
        referenceAnswer:
          type: string
          nullable: true
          description: 参考答案（主观题自评对照用）；无则 null
        explanation:
          type: string
          nullable: true
          description: 解析；无则 null
        points:
          allOf:
            - $ref: '#/components/schemas/RemediationPointsAward'
          nullable: true
          description: 本次发分结果；未发分/无需发分时为 null
        setCompleted:
          type: boolean
          description: 本次作答是否使套题全部答对（true 时后端已整行删除套题）
        remainingCount:
          type: integer
          description: 套题内仍未答对的题数（setCompleted 时为 0）
      required: [isCorrect, method, errorType, needsSelfAssessment, referenceAnswer, explanation, points, setCompleted, remainingCount]

    DictationPassageListResult:
      type: object
      description: 语文默写篇目清单（仅已校验篇目，作者/朝代/正文均不下发）
      properties:
        passages:
          type: array
          items:
            $ref: '#/components/schemas/DictationPassage'
      required: [passages]

    DictationPassage:
      type: object
      description: >-
        默写篇目元数据（配置页选篇用）。只含篇名与册次；作者/朝代/正文是学生要
        作答的三个判题字段，故意不下发。
      properties:
        passageId:
          type: integer
          description: 篇目 id（chinese_passages.id，独立子系统不挂 questions）
        workTitle:
          type: string
          description: 篇名（如「静夜思」）
        semester:
          type: string
          description: 册次（上册/下册）
      required: [passageId, workTitle, semester]

    DictationStartRequest:
      type: object
      required: [semester, passageIds, count]
      properties:
        semester:
          type: string
          nullable: true
          enum: [上册, 下册]
          description: 册次范围；null=全部册次（白名单外取值 400）
        passageIds:
          type: array
          nullable: true
          items:
            type: integer
            minimum: 1
          description: 指定篇目 id 列表；非空时按指定篇目出题并忽略 semester；null=按册次随机抽题
        count:
          type: integer
          minimum: 1
          maximum: 20
          description: 抽题数量，限 1-20 整数（越界/非整数 400）

    DictationStartResult:
      type: object
      properties:
        questions:
          type: array
          description: 默写题单（白名单序列化，author/dynasty/正文剥离；题池为空时为空数组）
          items:
            $ref: '#/components/schemas/DictationQuestion'
      required: [questions]

    DictationQuestion:
      type: object
      properties:
        passageId:
          type: integer
          description: 篇目 id（chinese_passages.id）
        prompt:
          type: string
          description: 题面（由篇名服务端生成，如「请默写《静夜思》」；不落库）
        workTitle:
          type: string
          description: 篇名
        semester:
          type: string
          description: 册次（上册/下册）
      required: [passageId, prompt, workTitle, semester]

    DictationJudgeRequest:
      type: object
      required: [passageId, author, dynasty, body]
      properties:
        passageId:
          type: integer
          description: 篇目 id（须正整数，非法 400；篇目不存在 404）
        author:
          type: string
          description: 学生作答的作者
        dynasty:
          type: string
          description: 学生作答的朝代
        body:
          type: string
          description: 学生作答的正文（标点/空格/全半角不参与判对错）

    DictationJudgeResult:
      type: object
      description: 默写判题结果（程序化对错 + LCS 差异；不写任何学生状态，无 errorBookId）
      properties:
        passageId:
          type: integer
        isCorrect:
          type: boolean
          description: 三项全对才为 true（程序化判定，不调用 LLM）
        fields:
          type: object
          description: 三字段各自的匹配结果
          properties:
            author:
              $ref: '#/components/schemas/DictationFieldMatch'
            dynasty:
              $ref: '#/components/schemas/DictationFieldMatch'
            body:
              $ref: '#/components/schemas/DictationFieldMatch'
          required: [author, dynasty, body]
        bodyDiff:
          type: array
          description: >-
            正文逐字差异（全对时为空数组；相邻漏写+多写合并为 wrong）。
            判对错口径忽略标点，但各段 text/expected/actual 已回投原文标点，供学生读成整句
          items:
            $ref: '#/components/schemas/DictationDiffOp'
        reference:
          $ref: '#/components/schemas/DictationReference'
        feedback:
          type: string
          nullable: true
          description: 恒为 null——错因已与判题解耦，改由 POST /training/dictation/feedback 取
        feedbackPending:
          type: boolean
          description: true=判错且错因待补（前端应另调 dictation/feedback）；答对恒 false
        pointsAwarded:
          type: integer
          description: >-
            本次**实际入账**的积分（甲类 cn_dictation，按该篇 genre 取档：诗 2 / 文言文 5）。
            0 = 本次没加：同日重判（幂等命中）/ 体裁未标定（genre_unset）/ 达上限 /
            家长停用该档 / 发分失败。前端 `> 0` 弹「+N 分」轻反馈。
        awardReason:
          allOf:
            - $ref: '#/components/schemas/PointsAwardReason'
          description: 未发分原因；无值=静默（duplicate 刻意不在枚举内）
      required: [passageId, isCorrect, fields, bodyDiff, reference, feedback, feedbackPending, pointsAwarded]

    DictationFeedbackResult:
      type: object
      properties:
        feedback:
          type: string
          nullable: true
          description: LLM 生成的错因文案；模型不可达/超时/两个模型都失败时为 null（前端显示兜底文案）
      required: [feedback]

    DictationFieldMatch:
      type: object
      properties:
        match:
          type: boolean
          description: 该字段归一化后是否与参考答案全等
      required: [match]

    DictationDiffOp:
      type: object
      description: >-
        正文差异片段。type=equal 带 text；type=missing 带被漏写的 text；
        type=extra 带学生多写的 text；type=wrong 带 expected/actual（写错字）。
      properties:
        type:
          type: string
          enum: [equal, wrong, missing, extra]
        text:
          type: string
          description: equal/missing/extra 片段的文本
        expected:
          type: string
          description: wrong 片段的参考答案字符
        actual:
          type: string
          description: wrong 片段的学生作答字符
      required: [type]

    DictationReference:
      type: object
      description: 参考答案三字段
      properties:
        author:
          type: string
        dynasty:
          type: string
        body:
          type: string
      required: [author, dynasty, body]

    # ==================== 语文古诗文解释（翻译）专项（2026-09-16） ====================

    InterpretationPassageListResult:
      type: object
      description: 解释专项篇目清单（只含篇名与册次，标准释义/译文不下发）
      properties:
        passages:
          type: array
          items:
            $ref: '#/components/schemas/InterpretationPassage'
      required: [passages]

    InterpretationPassage:
      type: object
      properties:
        passageId: { type: integer, format: int64 }
        workTitle: { type: string }
        semester: { type: string, enum: ['上册', '下册'] }
      required: [passageId, workTitle, semester]

    InterpretationStartRequest:
      type: object
      properties:
        semester:
          type: string
          nullable: true
          enum: ['上册', '下册', null]
          description: null=全部册次
        passageIds:
          type: array
          nullable: true
          items: { type: integer, format: int64 }
          description: 非空时按指定篇目出题（忽略 semester）
        count:
          type: integer
          minimum: 1
          maximum: 3
          description: 篇数，限 1-3（每篇逐句判，3 篇已是长会话）
      required: [count]

    InterpretationStartResult:
      type: object
      properties:
        passages:
          type: array
          items:
            $ref: '#/components/schemas/InterpretationPassageDetail'
      required: [passages]

    InterpretationPassageDetail:
      type: object
      description: 整篇句子一次下发（前端才能把整篇铺出来、看见上下文）
      properties:
        passageId: { type: integer, format: int64 }
        workTitle: { type: string }
        semester: { type: string }
        sentences:
          type: array
          items:
            $ref: '#/components/schemas/InterpretationSentence'
      required: [passageId, workTitle, semester, sentences]

    InterpretationSentence:
      type: object
      description: 一句骨架。terms 只出**词名**，释义是答案不下发
      properties:
        index: { type: integer, description: 句序（从 0 起，与判题请求的 sentenceIndex 对应） }
        text: { type: string, description: 原文（含标点） }
        terms:
          type: array
          items: { type: string }
          description: 该句的关键字词（词名）
      required: [index, text, terms]

    InterpretationJudgeRequest:
      type: object
      properties:
        passageId: { type: integer, format: int64 }
        sentenceIndex: { type: integer, minimum: 0 }
        terms:
          type: array
          items:
            type: object
            properties:
              term: { type: string }
              answer: { type: string, description: 学生写的释义 }
            required: [term, answer]
        translation: { type: string, description: 学生的整句翻译 }
      required: [passageId, sentenceIndex]

    InterpretationJudgeResult:
      type: object
      properties:
        passageId: { type: integer, format: int64 }
        sentenceIndex: { type: integer }
        allCorrect:
          type: boolean
          description: 该句所有项（字词 + 整句）全 correct===true 才是 true；有 null（未判定）即 false
        terms:
          type: array
          items:
            $ref: '#/components/schemas/InterpretationTermResult'
        sentence:
          $ref: '#/components/schemas/InterpretationSentenceResult'
        fullTranslation:
          type: string
          nullable: true
          description: 整篇译文。**仅当被判的是最后一句时非 null**（提前下发等于泄题）
        pointsAwarded:
          type: integer
          description: >-
            本次**实际入账**的积分（甲类 cn_interpretation，按该篇 genre 取档：
            诗 2 / 文言文 5）。**整篇最后一句判完才可能非 0**；中间句一律 0
            （含未答完 / 体裁未标定 / 同日重判 / 达上限 / 停用 / 发分失败）。
        awardReason:
          allOf:
            - $ref: '#/components/schemas/PointsAwardReason'
          description: 未发分原因；无值=静默（duplicate 刻意不在枚举内）
      required: [passageId, sentenceIndex, allCorrect, terms, sentence, fullTranslation, pointsAwarded]

    InterpretationTermResult:
      type: object
      properties:
        term: { type: string }
        correct:
          type: boolean
          nullable: true
          description: null=未判定（模型没判出来）
        method:
          $ref: '#/components/schemas/InterpretationMethod'
        standard: { type: string, description: 标准释义（只在判题响应里下发） }
        comment: { type: string, nullable: true, description: 判错时的改进提示 }
      required: [term, correct, method, standard, comment]

    InterpretationSentenceResult:
      type: object
      properties:
        correct:
          type: boolean
          nullable: true
          description: null=未判定
        method:
          $ref: '#/components/schemas/InterpretationMethod'
        standard: { type: string, description: 标准译文（只在判题响应里下发） }
        comment: { type: string, nullable: true }
      required: [correct, method, standard, comment]

    InterpretationMethod:
      type: string
      enum: [exact, ai, unanswered, undetermined]
      description: >-
        exact=归一化后与标准答案全等；ai=LLM 判定「意思到位」；
        unanswered=学生留空；undetermined=模型漏项或整次调用失败（correct 为 null）

    # ==================== 语文古诗文含义（深层含义 + 作者情感）专项（2026-09-17） ====================

    MeaningPassageListResult:
      type: object
      description: 含义专项篇目清单（只含篇名与册次，标准含义/情感不下发）
      properties:
        passages:
          type: array
          items:
            $ref: '#/components/schemas/MeaningPassage'
      required: [passages]

    MeaningPassage:
      type: object
      properties:
        passageId: { type: integer, format: int64 }
        workTitle: { type: string }
        semester: { type: string, enum: ['上册', '下册'] }
      required: [passageId, workTitle, semester]

    MeaningStartRequest:
      type: object
      properties:
        semester:
          type: string
          nullable: true
          enum: ['上册', '下册', null]
          description: null=全部册次
        passageIds:
          type: array
          nullable: true
          items: { type: integer, format: int64 }
          description: 非空时按指定篇目出题（忽略 semester）
        count:
          type: integer
          minimum: 1
          maximum: 3
          description: 篇数，限 1-3（每篇逐句判，3 篇已是长会话）
      required: [count]

    MeaningStartResult:
      type: object
      properties:
        passages:
          type: array
          items:
            $ref: '#/components/schemas/MeaningPassageDetail'
      required: [passages]

    MeaningPassageDetail:
      type: object
      description: 整篇句子一次下发（前端才能把整首诗铺在顶部原文条里）
      properties:
        passageId: { type: integer, format: int64 }
        workTitle: { type: string }
        semester: { type: string, enum: ['上册', '下册'] }
        sentences:
          type: array
          items:
            $ref: '#/components/schemas/MeaningSentence'
      required: [passageId, workTitle, semester, sentences]

    MeaningSentence:
      type: object
      description: 一句骨架。含义/情感是答案，一律不下发
      properties:
        index: { type: integer, description: 句序（从 0 起，与判题请求的 sentenceIndex 对应） }
        text: { type: string, description: 原文（含标点） }
        terms:
          type: array
          items:
            $ref: '#/components/schemas/MeaningTerm'
          description: 该句的关键字词（带注音原样 + 去注音两式）
        answerable:
          type: boolean
          description: >-
            false=该句没有标准含义（人工没填）：**只显示在顶部原文条里、不出题**，
            judge 该句会 400。诗要完整显示，所以 false 的句子也下发 text
      required: [index, text, terms, answerable]

    MeaningTerm:
      type: object
      description: 一个关键字词的两种形式（不要合并：展示要注音、高亮不要注音）
      properties:
        term: { type: string, description: 原样，**带注音**（如「谪（zhé）守」），展示用 }
        plain: { type: string, description: 去注音（如「谪守」），前端在原文里高亮定位用 }
      required: [term, plain]

    MeaningJudgeRequest:
      type: object
      properties:
        passageId: { type: integer, format: int64 }
        sentenceIndex: { type: integer, minimum: 0 }
        terms:
          type: array
          items:
            type: object
            properties:
              term: { type: string }
              answer: { type: string, description: 学生写的释义 }
            required: [term, answer]
        meaning: { type: string, description: 学生写的本句深层含义 }
        emotion: { type: string, description: 学生写的作者情感 }
      required: [passageId, sentenceIndex]

    MeaningJudgeResult:
      type: object
      properties:
        passageId: { type: integer, format: int64 }
        sentenceIndex: { type: integer }
        allCorrect:
          type: boolean
          description: 该句所有项（字词 + 含义 + 情感）全 correct===true 才是 true；有 null（未判定）即 false
        terms:
          type: array
          description: 顺序与「该句应有的字词」一致
          items:
            $ref: '#/components/schemas/MeaningTermResult'
        meaning:
          $ref: '#/components/schemas/MeaningPartResult'
        emotion:
          $ref: '#/components/schemas/MeaningPartResult'
        pointsAwarded:
          type: integer
          description: >-
            本次**实际入账**的积分（甲类 cn_meaning，一篇一次）。只有该篇**最后一个
            可作答句**判完时才可能非 0；其余句恒 0。「整篇答完」= 最大的 i 使
            meanings[i] != null——**不是** sentences.length - 1（末句可能没有标准含义、
            根本不出题，按末句下标判定会让这些篇目永远拿不到分）。
        awardReason:
          allOf:
            - $ref: '#/components/schemas/PointsAwardReason'
          description: 未发分原因；无值=静默（duplicate 刻意不在枚举内）
      required: [passageId, sentenceIndex, allCorrect, terms, meaning, emotion, pointsAwarded]

    MeaningTermResult:
      type: object
      properties:
        term: { type: string }
        correct:
          type: boolean
          nullable: true
          description: null=未判定（模型没判出来）
        method:
          $ref: '#/components/schemas/MeaningMethod'
        standard: { type: string, description: 标准释义（只在判题响应里下发） }
        comment: { type: string, nullable: true, description: 判错时的改进提示 }
      required: [term, correct, method, standard, comment]

    MeaningPartResult:
      type: object
      description: 含义 / 情感其中一块的判定结果
      properties:
        correct:
          type: boolean
          nullable: true
          description: null=未判定
        method:
          $ref: '#/components/schemas/MeaningMethod'
        standard: { type: string, description: 标准含义 / 标准情感（只在判题响应里下发） }
        comment: { type: string, nullable: true }
      required: [correct, method, standard, comment]

    MeaningMethod:
      type: string
      enum: [ai, unanswered, undetermined]
      description: >-
        **没有 exact**——本专项不做字符串归一化全等短路（含义/情感是理解性作答，
        逐字答对也必须过 LLM），有测试用例钉着，勿「顺手补上」。
        ai=LLM 判定「意思到位」；unanswered=学生留空（唯一的程序判断）；
        undetermined=模型漏项或整次调用失败（correct 为 null）

    # ===== 英语背单词（2026-09-16）=====
    VocabularyPoolOption:
      type: object
      description: 配置页的一档词库范围
      properties:
        key: { type: string, enum: [junior, senior, all] }
        label: { type: string, description: 展示名（如「仅初中」） }
        count: { type: integer, description: 该档位的词数 }
      required: [key, label, count]

    VocabularyOptionsResult:
      type: object
      properties:
        pools:
          type: array
          items: { $ref: '#/components/schemas/VocabularyPoolOption' }
        todayAnswered:
          type: integer
          description: 今日已背（按服务器本地时区当日 00:00 起算，见过就算）
        counts:
          type: object
          description: 四个筛选项各自可用的词数
          properties:
            notLearned: { type: integer, description: 还没背过的（含从无进度行的词） }
            myWrong: { type: integer, description: 该学生错过的词 }
            commonWrong: { type: integer, description: 全平台答错过（error_count>0）的词 }
            extended: { type: integer, description: 有熟词僻义的词 }
          required: [notLearned, myWrong, commonWrong, extended]
      required: [pools, todayAnswered, counts]

    VocabularyStartRequest:
      type: object
      required: [levelPool, count, order, direction]
      properties:
        levelPool: { type: string, enum: [junior, senior, all] }
        count: { type: integer, minimum: 10, maximum: 20 }
        order:
          type: string
          enum: [random, alpha, alpha_desc, letter]
          description: letter=按 letter 指定字母开头的词、按字母序出
        letter:
          type: string
          nullable: true
          description: 仅 order=letter 时可用，单个 a-z 字母；非 letter 模式下传入即 400
        direction:
          type: string
          enum: [en2cn, cn2en, ph2en, random]
          description: >-
            en2cn=给单词答中文；cn2en=给中文答单词；ph2en=给音标答单词；
            random=逐题在**本词出得了的方向**里等概率掷（没音标的词不会有 ph2en 题）。
            勾 onlyExtendedSense 时服务端强制 en2cn；熟词僻义题恒为 en2cn（见 start 说明）
        onlyNotLearned: { type: boolean, description: 只出没背过的 }
        onlyMyWrong: { type: boolean, description: 只出我错过的词 }
        onlyCommonWrong: { type: boolean, description: 只出全平台高频易错词 }
        onlyExtendedSense:
          type: boolean
          description: 只出熟词僻义（会把 direction 强制成 en2cn）

    VocabularyQuestionItem:
      type: object
      description: >-
        一道题。promptKind=cn2en 时 phonetic/context 恒为 null、hasFamily 恒为 false
        ——这几项都足以顺出英文答案。
      properties:
        wordId: { type: integer, format: int64 }
        senseIndex: { type: integer, description: 目标义项在 meanings 里的下标 }
        promptKind: { type: string, enum: [en2cn, cn2en, ph2en] }
        prompt:
          type: string
          description: >-
            题面。en2cn 是英文单词；cn2en 是中文释义；
            ph2en 是音标（如 `/ˈkʌntri/`，此时 `phonetic` 为 null，避免两处内容打架）
        phonetic: { type: string, nullable: true }
        context:
          type: string
          nullable: true
          description: 锁定僻义的搭配（如 address the problem）；普通义题与 cn2en/ph2en 题为 null
        isExtendedSense: { type: boolean, description: 是否熟词僻义题（题面会给标记） }
        hasFamily:
          type: boolean
          description: >-
            是否有词根族可展开。**前端必须配合 promptKind==='en2cn' 才渲染「+」号**；
            cn2en 与 ph2en（答案都是英文单词）下后端恒为 false。
      required: [wordId, senseIndex, promptKind, prompt, phonetic, context, isExtendedSense, hasFamily]

    VocabularyStartResult:
      type: object
      properties:
        questions:
          type: array
          items: { $ref: '#/components/schemas/VocabularyQuestionItem' }
        poolSize: { type: integer, description: 抽题池命中数；为 0 时 questions 为空 }
      required: [questions, poolSize]

    VocabularyJudgeRequest:
      type: object
      required: [wordId, senseIndex, promptKind, answer]
      properties:
        wordId: { type: integer, format: int64, minimum: 1 }
        senseIndex: { type: integer, minimum: 0 }
        promptKind: { type: string, enum: [en2cn, cn2en, ph2en] }
        answer:
          type: string
          description: >-
            学生作答原文；空/纯空白走 unanswered（不计对错）。
            注意 ph2en 的作答是英文单词，判题与 cn2en 同路（纯程序比对，不调 LLM）

    VocabularyStandardMeaning:
      type: object
      properties:
        pos: { type: string }
        gloss: { type: string }
        extended: { type: boolean, description: 是否熟词僻义义项 }
        context: { type: string, description: 僻义项才有的锁定搭配 }
      required: [pos, gloss, extended]

    VocabularyCharDiffOp:
      type: object
      description: 逐字符差异（仅中→英答错时给），供前端高亮
      properties:
        type: { type: string, enum: [equal, wrong] }
        text: { type: string, description: type=equal 时的原文片段 }
        actual: { type: string, description: type=wrong 时学生写的字符（漏写为空串） }
        expected: { type: string, description: type=wrong 时正确的字符（多写为空串） }
      required: [type]

    VocabularyJudgeResult:
      type: object
      properties:
        wordId: { type: integer, format: int64 }
        senseIndex: { type: integer }
        verdict:
          type: string
          enum: [correct, off_target, wrong, unanswered, undetermined]
          description: >-
            off_target=答成常见义（学生答的没错，只是没答到本题考的僻义，**不计错**）；
            unanswered=空作答；undetermined=判题失败（**都不计错**）
        method: { type: string, enum: [exact, ai], description: exact=程序短路命中 }
        standard:
          type: object
          properties:
            word: { type: string }
            phonetic: { type: string, nullable: true }
            meanings:
              type: array
              items: { $ref: '#/components/schemas/VocabularyStandardMeaning' }
            target:
              type: object
              description: 本题考的那一个义项
              properties:
                pos: { type: string }
                gloss: { type: string }
                extended: { type: boolean }
                context: { type: string }
              required: [pos, gloss, extended]
          required: [word, phonetic, meanings, target]
        spellingDiff:
          type: array
          nullable: true
          description: 仅中→英答错时非 null
          items: { $ref: '#/components/schemas/VocabularyCharDiffOp' }
        comment:
          type: string
          nullable: true
          description: 判错/未答到考点时的一句提示（模型给；程序判错时为 null）
        familyAvailable: { type: boolean, description: 该词是否有词根族可复盘 }
        progress:
          type: object
          description: 落库后读回的进度
          properties:
            learned: { type: boolean }
            wrongCount: { type: integer }
          required: [learned, wrongCount]
      required: [wordId, senseIndex, verdict, method, standard, spellingDiff, comment, familyAvailable, progress]

    VocabularyAffix:
      type: object
      properties:
        type: { type: string, enum: [prefix, suffix] }
        code: { type: string, description: 词缀形态，如 -less / re- }
        gloss: { type: string, description: 词缀含义，如「无…的」 }
        posHint: { type: string, description: 构词提示，如「→ 形容词」 }
      required: [type, code, gloss]

    WordFamilyMember:
      type: object
      properties:
        word: { type: string }
        phonetic: { type: string, nullable: true }
        gloss: { type: string, description: 第一顺位中文释义 }
        pos: { type: string }
        affixes:
          type: array
          description: 相对族中心的词缀注记；中心词为空数组
          items: { $ref: '#/components/schemas/VocabularyAffix' }
        isHead: { type: boolean }
        level: { type: string }
      required: [word, phonetic, gloss, pos, affixes, isHead, level]

    WordFamilyResult:
      type: object
      properties:
        root:
          type: object
          properties:
            word: { type: string }
            phonetic: { type: string, nullable: true }
            gloss: { type: string }
          required: [word, phonetic, gloss]
        members:
          type: array
          description: 中心词排最前（isHead=true），其余保持课标原序
          items: { $ref: '#/components/schemas/WordFamilyMember' }
      required: [root, members]

    HiddenQuestion:
      type: object
      properties:
        questionId: { type: integer, format: int64 }
        questionText: { type: string, description: 题面预览（80 字截断） }
        type: { type: string }
        kpName: { type: string, nullable: true, description: 首个 primary kp 名 }
        markedAt: { type: string, format: date-time }

    ExamPaper:
      type: object
      description: 试卷列表条目（仅元数据，不含题目）
      properties:
        id:
          type: integer
          description: 试卷 id
        title:
          type: string
          description: 试卷标题
        year:
          type: integer
          nullable: true
          description: 年份（可空）
        district:
          type: string
          nullable: true
          description: 地区（可空）
        examType:
          type: string
          nullable: true
          description: 试卷类型（可空）
        gradeBand:
          type: string
          nullable: true
          description: 学段（可空）
        questionCount:
          type: integer
          description: 题目数量
      required: [id, title, year, district, examType, gradeBand, questionCount]

    ExamQuestionMeta:
      type: object
      description: 试卷题单元数据（白名单：无 answer/explanation，防答案泄露）
      properties:
        questionId:
          type: integer
          description: 题库题目 id
        questionNo:
          type: integer
          description: 卷内题号（paper_questions.question_no）
        text:
          type: string
          description: 题面原文
        type:
          type: string
          description: 题型（choice/fill_blank/true_false/short_answer/proof）
        options:
          type: array
          items: {}
          nullable: true
          description: 选项数组（DB JSON 字符串 parse 后；无/坏 JSON 为 null）
      required: [questionId, questionNo, text, type, options]

    ExamPaperDetail:
      type: object
      description: 试卷详情（题目元数据 + 推荐时长）
      properties:
        id:
          type: integer
          description: 试卷 id
        title:
          type: string
          description: 试卷标题
        durationMinutes:
          type: integer
          description: 推荐时长（分钟）——choice/true_false 每题 1 分钟、其余每题 3 分钟，总和向上取整到 15 的倍数，clamp [30, 180]
        questions:
          type: array
          items:
            $ref: '#/components/schemas/ExamQuestionMeta'
      required: [id, title, durationMinutes, questions]

    ExamSessionCreateRequest:
      type: object
      required: [paperId, durationMinutes]
      properties:
        paperId:
          type: integer
          description: 试卷 id（试卷不存在 404）
        durationMinutes:
          type: integer
          minimum: 10
          maximum: 300
          description: 考试时长（分钟），限 10-300 整数（越界/非整数 400）

    ExamSessionCreated:
      type: object
      description: >-
        开考/续考响应（同构；续考不重置时长，deadlineAt 沿用既有会话）。
        status 仅在「命中的续考会话已超时、服务端自动收卷后」返回
        'submitted'（前端据此直接踢结果页）；新建/正常续考缺省。
      properties:
        sessionId:
          type: integer
          description: 考试会话 id
        status:
          type: string
          enum: [in_progress, submitted]
          description: 缺省视为 in_progress；'submitted' 表示命中超时会话已自动收卷
        deadlineAt:
          type: string
          format: date-time
          description: 截止时间（ISO 8601）
        remainingSeconds:
          type: integer
          description: 剩余秒数（deadline - now）
        questions:
          type: array
          description: 题单（白名单，无 answer/explanation）
          items:
            $ref: '#/components/schemas/ExamQuestionMeta'
      required: [sessionId, deadlineAt, remainingSeconds, questions]

    ExamSubmitAnswerRequest:
      type: object
      required: [questionId, answerText]
      properties:
        questionId:
          type: integer
          description: 题库题目 id（不在该卷题单 400）
        answerText:
          type: string
          description: 学生提交的答案文本

    ExamAnswerSaved:
      type: object
      description: 单题提交白名单响应（不回传对错——考试防作弊设计，对错只在 results 出现）
      properties:
        saved:
          type: boolean
          description: 恒为 true（判题结果落库但不透出）
      required: [saved]

    ExamSessionState:
      type: object
      description: 会话状态（断线恢复；answered 只含作答文本，判题字段剥离）
      properties:
        sessionId:
          type: integer
          description: 考试会话 id
        status:
          type: string
          enum: [in_progress, submitted]
          description: in_progress=进行中；submitted=已交卷（含超时自动收卷）
        remainingSeconds:
          type: integer
          description: 剩余秒数（submitted 为 0）
        questions:
          type: array
          description: 题单（白名单，无 answer/explanation）
          items:
            $ref: '#/components/schemas/ExamQuestionMeta'
        answered:
          type: object
          description: 已答 map——questionId（字符串键）-> {answerText}
          additionalProperties:
            type: object
            properties:
              answerText:
                type: string
                nullable: true
                description: 学生作答文本（无判题字段，不泄露对错）
      required: [sessionId, status, remainingSeconds, questions, answered]

    ExamSummary:
      type: object
      description: 交卷汇总（submit 响应；results 内嵌同构字段）——主观题不计对错，correctCount/accuracy 只算客观题
      properties:
        correctCount:
          type: integer
          description: 答对题数（is_correct=1 计数；未作答/补判失败均按错计）
        totalCount:
          type: integer
          description: 总题数（题单长度）
        accuracy:
          type: number
          description: 正确率（百分比一位小数，如 33.3；分母为客观题数，客观题为 0 时取 0）
        subjectiveCount:
          type: integer
          description: 主观题数（is_correct NULL 计数，self_assess 模式不判对错；遗留 ai 模式已判主观行按客观错题计）
      required: [correctCount, totalCount, accuracy, subjectiveCount]

    ExamSubmitResult:
      description: >-
        交卷响应（仅在 ExamSummary 之上多一个 `points`）。**仅 submit 响应带 `points`**：
        finalizeSession 里发分在交卷路径上，`getResults` 只读已交卷的汇总、不补发分，
        故结果页（ExamResults）内嵌的汇总里该字段缺省（JSON 里无此键，不是 0）。
        发分故障时同样缺省。
      allOf:
        - $ref: '#/components/schemas/ExamSummary'
        - type: object
          properties:
            points:
              allOf:
                - $ref: '#/components/schemas/PointsAwardDto'
              description: 交卷发分结果（math_paper，丙类埋点，2026-09-17）

    ExamResultItem:
      type: object
      description: 结果页逐题条目（JOIN questions 带解析）
      properties:
        questionId:
          type: integer
          description: 题库题目 id
        questionNo:
          type: integer
          description: 卷内题号
        text:
          type: string
          description: 题面原文
        type:
          type: string
          description: 题型
        options:
          type: array
          items: {}
          nullable: true
          description: 选项数组（DB JSON 字符串 parse 后；无/坏 JSON 为 null）
        answerText:
          type: string
          nullable: true
          description: 学生作答文本（未作答为 null）
        isCorrect:
          type: integer
          nullable: true
          enum: [0, 1]
          description: 对错（0=错，1=对；number 而非 boolean——未作答按错计落 0；null=主观题待自评）
        answer:
          type: string
          nullable: true
          description: 参考答案（主观题自评对照展示）
        needsSelfAssessment:
          type: boolean
          description: true=主观题待自评（is_correct NULL）
        selfAssessment:
          type: string
          nullable: true
          enum: [correct, incorrect]
          description: 该生最近一次自评（question_self_assessments 留痕）；未自评为 null
        analysis:
          type: string
          nullable: true
          description: 判题题解（JudgeCore 分析）
        explanation:
          type: string
          nullable: true
          description: 题库解析
      required: [questionId, questionNo, text, type, options, answerText, isCorrect, answer, needsSelfAssessment, selfAssessment, analysis, explanation]

    ExamResults:
      type: object
      description: 结果页响应（仅 submitted 会话可查，in_progress 409/code=4103）
      allOf:
        - $ref: '#/components/schemas/ExamSummary'
        - type: object
          properties:
            items:
              type: array
              description: 逐题对错与解析
              items:
                $ref: '#/components/schemas/ExamResultItem'
          required: [items]

    PracticeResult:
      type: object
      properties:
        questionN:
          type: string
          description: 卡内复合题号（如 "0-1"）
        questionText:
          type: string
          description: 题面原文
        studentAnswer:
          type: string
          description: 学生提交答案
        isCorrect:
          type: boolean
          description: 对错
        method:
          type: string
          enum: [exact, ai]
        analysis:
          type: string
          nullable: true
          description: 题解（仅错题，复用判题 analysis；对题为 null）
        errorType:
          type: string
          nullable: true
          enum: [logic, calculation, format, missing]

    RegisterRequest:
      type: object
      properties:
        phone:
          type: string
        password:
          type: string
        guardianAgreement:
          type: boolean
      required: [phone, password, guardianAgreement]

    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    ConversationDetail:
      allOf:
        - $ref: '#/components/schemas/Conversation'
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message'

    # ==================== 闯关积分（Points / ParentPoints，2026-09-17） ====================

    PointsLevelInfo:
      type: object
      description: 段位信息。阈值常量在 modules/points/levels.ts，不落库、前端不重复定义。
      properties:
        code:
          type: string
          description: 段位 code（pichai / zhutie / … / wangzhe）
        name:
          type: string
          description: 段位中文名（劈柴 / 铸铁 / … / 王者）
        index:
          type: integer
          description: 段位序号（0 起）
        threshold:
          type: integer
          description: 该段位的累计积分门槛

    LevelsResponse:
      type: object
      description: 全量段位表（含全部 9 档），家长端配奖励门槛的数据源。
      properties:
        levels:
          type: array
          description: 按 threshold 升序，index 与数组下标一致。
          items:
            $ref: '#/components/schemas/PointsLevelInfo'

    PointsAwardReason:
      type: string
      enum: [daily_limit, no_rule, tier_inactive, genre_unset, not_cleared]
      description: >-
        未发分原因（无值=静默）。duplicate 刻意不在枚举内：幂等命中时本次并未入账，
        PointsService.award 虽会带回首次分值，但那是历史账——报出去会让前端弹假「+N 分」。

    PointsAwardDto:
      type: object
      description: 埋点响应里回带的发分结果（wire 形状；levelUp 是段位 code 而不是对象）。
      properties:
        awarded:
          type: integer
          description: 本次实际入账分（0 = 没发）
        balance:
          type: integer
          description: 发分后的可用余额
        levelUp:
          type: object
          nullable: true
          description: 本次是否跨档；未跨档为 null
          properties:
            from:
              type: string
            to:
              type: string

    PointsOverview:
      type: object
      properties:
        balance:
          type: integer
          description: 可用余额（earn 正 + redeem 负）
        totalEarned:
          type: integer
          description: 累计获得（段位依据；兑换只扣 balance，不影响它）
        todayEarned:
          type: integer
          description: 今日 kind='earn' 的 SUM
        level:
          $ref: '#/components/schemas/PointsLevelInfo'
        nextLevel:
          allOf:
            - $ref: '#/components/schemas/PointsLevelInfo'
          nullable: true
          description: 已满级（王者）时为 null
        pointsToNextLevel:
          type: integer
          nullable: true
          description: 距下一档还差多少分；已满级时为 null
        progressPercent:
          type: integer
          description: 当前档内进度 0-100 整数；满级为 100

    PointLedgerEntry:
      type: object
      description: 流水一条（只暴露展示字段，dedupe_key / task_code / student_id 不下发）。
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [earn, redeem]
        title:
          type: string
          description: 展示文案快照（家长之后改分值/档位名，历史流水不变）
        points:
          type: integer
          description: earn 正数 / redeem 负数
        createdAt:
          type: string
          format: date-time
        refType:
          type: string
          nullable: true
          description: 来源类型（lesson / exam_session / training_session / passage / question）

    PointLedgerPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PointLedgerEntry'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    PointRuleTierView:
      type: object
      properties:
        tierKey:
          type: string
        tierLabel:
          type: string
        points:
          type: integer
        dailyLimit:
          type: integer
          nullable: true
          description: null = 不限
        isActive:
          type: boolean
        completedToday:
          type: integer
          nullable: true
          description: 今日已发分条数；未计算时为 null
        remainingToday:
          type: integer
          nullable: true
          description: 今日还剩几次；dailyLimit == null 或未计算时为 null

    PointRuleGroup:
      type: object
      properties:
        taskCode:
          type: string
        taskName:
          type: string
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/PointRuleTierView'

    GroupedPointRules:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/PointRuleGroup'

    SavePointRuleItem:
      type: object
      required: [taskCode, tierKey, points, dailyLimit, isActive]
      properties:
        taskCode:
          type: string
          maxLength: 40
        tierKey:
          type: string
          maxLength: 20
        points:
          type: integer
          minimum: 0
          maximum: 9999
        dailyLimit:
          type: integer
          nullable: true
          minimum: 1
          maximum: 99
          description: null = 不限；0 会让该档位永久不发分，被拒绝
        isActive:
          type: boolean

    SavePointRulesRequest:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SavePointRuleItem'

    StudentRewardView:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        pointsCost:
          type: integer
        minLevelCode:
          type: string
          nullable: true
        minLevelName:
          type: string
          nullable: true
          description: >-
            minLevelCode 对应的段位名（无段位门槛或脏 code 时为 null）。段位表单一真源在
            服务端 levels.ts —— 学生端「段位不够（需达到 XX）」直接用这个名字，不维护前端段位表。
        affordable:
          type: boolean
          description: 余额是否够
        levelOk:
          type: boolean
          description: 段位是否够（无门槛恒 true）
        gap:
          type: integer
          description: max(0, pointsCost - balance)，还差多少分

    StudentRewards:
      type: object
      properties:
        balance:
          type: integer
        level:
          $ref: '#/components/schemas/PointsLevelInfo'
        items:
          type: array
          items:
            $ref: '#/components/schemas/StudentRewardView'

    RewardCatalogItem:
      type: object
      description: 奖励清单一行（家长端返回含已下架行，用于整表 PUT 时原样带回 isActive）。
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        pointsCost:
          type: integer
        minLevelCode:
          type: string
          nullable: true
        isActive:
          type: boolean
        sortOrder:
          type: integer

    SaveRewardCatalogItem:
      type: object
      required: [name, description, pointsCost, minLevelCode, isActive, sortOrder]
      properties:
        id:
          type: integer
          description: 有 id = 更新（整行覆盖）；无 id = 新增
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 300
        pointsCost:
          type: integer
          minimum: 1
          maximum: 999999
        minLevelCode:
          type: string
          nullable: true
        isActive:
          type: boolean
          description: 必填——缺省会被服务层当 true，静默重新上架已下架奖励
        sortOrder:
          type: integer
          minimum: 0
          maximum: 9999

    SaveRewardCatalogRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 空数组是合法语义（整表清空 / 全部软删）
          items:
            $ref: '#/components/schemas/SaveRewardCatalogItem'

    RedeemRequest:
      oneOf:
        - type: object
          required: [type, points]
          properties:
            type:
              type: string
              enum: [cash]
            points:
              type: integer
              minimum: 1
              maximum: 999999
              description: 要花掉的积分数（金额由服务端按汇率推导）
        - type: object
          required: [type, catalogId]
          properties:
            type:
              type: string
              enum: [reward]
            catalogId:
              type: integer
              minimum: 1

    RedemptionView:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [cash, reward]
        pointsSpent:
          type: integer
        cashAmount:
          type: number
          nullable: true
          description: type='cash' 时的金额快照（两位小数）
        rewardCatalogId:
          type: integer
          nullable: true
        rewardName:
          type: string
          nullable: true
          description: 快照（奖励改名/下架不影响历史）
        status:
          type: string
          enum: [pending, fulfilled]
        note:
          type: string
          nullable: true
        ledgerId:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        fulfilledAt:
          type: string
          format: date-time
          nullable: true

    RedeemResult:
      type: object
      properties:
        redemption:
          $ref: '#/components/schemas/RedemptionView'
        balance:
          type: integer
          description: 兑换后的实时余额
        totalEarned:
          type: integer
          description: 必须与兑换前一致（兑换不碰累计获得 → 段位不降）
        level:
          $ref: '#/components/schemas/PointsLevelInfo'

    RedemptionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RedemptionView'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    PatchRedemptionRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, fulfilled]
          description: 只改状态/时间，不动积分（本期兑换不可撤销）

    PointsSettings:
      type: object
      properties:
        pointsPerYuan:
          type: integer
          description: 多少积分换 1 元（默认 20）
        rewardRedemptionEnabled:
          type: boolean
          description: 兑换总开关（false 时兑换端点直接 3004）

    SavePointsSettingsRequest:
      type: object
      description: 至少给一个字段（空 patch 400）
      properties:
        pointsPerYuan:
          type: integer
          minimum: 1
          maximum: 9999
        rewardRedemptionEnabled:
          type: boolean

    CompleteSessionResult:
      type: object
      properties:
        pointsAwarded:
          type: integer
          description: 本次实际入账分（0 = 没发）
        balance:
          type: integer
          nullable: true
          description: 发分失败（award_failed）时为 null——真实余额不是 0，回 0 会污染前端快照
        totalEarned:
          type: integer
          nullable: true
          description: 同上
        levelUp:
          type: object
          nullable: true
          properties:
            from:
              type: string
            to:
              type: string
        reason:
          type: string
          enum: [daily_limit, already_completed, no_rule, tier_inactive, award_failed]

    # ---- 埋点 Phase 1A：学习会话（2026-09-21）----

    StudyTimeSummary:
      type: object
      description: >-
        学习时长（**会话口径**，spec §8.2/§10）。`source: 'sessions'` 是口径标记：
        与 `dashboard.activeDays7` 的四路时间戳代理**并存、不替换**。
      properties:
        totalSeconds:
          type: integer
        activeDays:
          type: integer
          description: 会话口径的「有学习的天数」，与旧 `activeDays7` **刻意不同**（不是同一回事）。
        byDay:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                description: "`YYYY-MM-DD`"
              seconds:
                type: integer
        byModule:
          type: array
          description: 按 `module` 聚合，按秒数降序。
          items:
            type: object
            properties:
              module:
                type: string
              seconds:
                type: integer
        bySubject:
          type: array
          description: 只含 `subject_id IS NOT NULL` 的会话；没选学科的会话不进这张表。
          items:
            type: object
            properties:
              subjectId:
                type: integer
              seconds:
                type: integer
        source:
          type: string
          enum: [sessions]

    TodayUsageSummary:
      type: object
      description: 今日已用时长（spec §8.2），用于与 `controls.daily_time_limit_minutes` 比较。
      properties:
        date:
          type: string
          description: "`YYYY-MM-DD`（应用层算好的本地日）"
        activeSeconds:
          type: integer
        limitMinutes:
          type: integer
          nullable: true
          description: >-
            取自 `controls.daily_time_limit_minutes`。**null = 家长未设限**（不是 0，
            也不是「用了 0 分钟」），此时 `exceeded = false`。
        exceeded:
          type: boolean
          description: "`activeSeconds >= limitMinutes * 60`；`limitMinutes` 为 null 时恒 false。"
        byModule:
          type: array
          items:
            type: object
            properties:
              module:
                type: string
              seconds:
                type: integer

    StartStudySessionRequest:
      type: object
      required: [sessionUid, module, scene]
      properties:
        sessionUid:
          type: string
          description: 前端生成的 UUID（幂等键）；形状不合法 → 400 / 1001。
        module:
          type: string
          description: 后端封闭字典（`STUDY_MODULES`）；前端 `sceneMap.ts` 只能取这里的值。
          enum: [mainline, aux_qna, training_targeted, training_error_practice, exam, chinese_dictation, chinese_interpretation, chinese_meaning, en_vocabulary]
        scene:
          type: string
          description: 后端封闭字典（`STUDY_SCENES`），比 module 细。
          enum: [course_detail, star_map, aux_chat, targeted_run, error_run, exam_run, dictation_run, interpretation_run, meaning_run, vocabulary_run, profile, rewards]
        subjectId:
          type: integer
          description: 可选；若给需是**在售学科**，否则 400 / 1001。
        refType:
          type: string
          description: "`lesson` | `card` | `paper` | `passage` | `word` | `dialogue`（最长 24）"
        refId:
          type: integer
        screenClass:
          type: string
          enum: [ipad_landscape, desktop, tablet_portrait, mobile]
          description: 前端上报；**非法值落 NULL 不报错**（设备信息是尽力而为）。
        inputType:
          type: string
          enum: [touch, mouse, hybrid]
          description: 前端上报；非法值落 NULL。`mac + touch` 会被服务端校正为 `ipad`。
        appShell:
          type: string
          enum: [web, electron]
          description: 前端上报；非法值落 NULL。

    HeartbeatRequest:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [visible, hidden]
          description: visible = 继续计时；hidden = 暂停计时（服务端只在上一状态为 visible 时累加）。

    EndSessionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [route_change, pagehide, idle_timeout, closed, hidden_timeout]

    # ---- 埋点 Phase 1B：家长端专项学情 / 真掌握度 / 目标达成 ----

    SpecialModuleSummary:
      type: object
      description: >-
        一个专项模块的窗口内聚合。`units` = 作答单位数（默写=篇、解释/含义=句、背单词=题），
        所以四个模块的 units 相加没有业务含义。
      required: [units, correct, rate, byDay]
      properties:
        units:
          type: integer
          description: 作答单位数（一行 = 一个作答单位）。
        correct:
          type: integer
          description: 其中判对的数量。
        rate:
          type: number
          nullable: true
          description: >-
            正确率（一位小数）。**null = 本期没有可判对错的作答**（不是 0）——
            前端显示「暂无数据」，不要显示 0%。
        byDay:
          type: array
          description: 按本地日期分组的作答单位数（喂柱状图）。
          items:
            type: object
            properties:
              date:
                type: string
                description: "`YYYY-MM-DD`"
              count:
                type: integer

    ParentSpecialsSummary:
      type: object
      description: >-
        四个专项模块的聚合（spec §8.2）。**四个键保证都在**，没数据的模块给 0 / rate:null / byDay:[]，
        前端不必做「模块缺失」兜底。只有 vocabulary 多一个 newWords。
      required: [dictation, interpretation, meaning, vocabulary]
      properties:
        dictation:
          $ref: '#/components/schemas/SpecialModuleSummary'
        interpretation:
          $ref: '#/components/schemas/SpecialModuleSummary'
        meaning:
          $ref: '#/components/schemas/SpecialModuleSummary'
        vocabulary:
          allOf:
            - $ref: '#/components/schemas/SpecialModuleSummary'
            - type: object
              required: [newWords]
              properties:
                newWords:
                  type: integer
                  description: 窗口内**答对过的去重词数**（不是「本期第一次学会的词数」——那需要跨窗口历史）。

    ParentMasterySummary:
      type: object
      description: >-
        真掌握度（spec §8.2）。**覆盖率三项必须一起展示**：题库只有约 38% 的题绑了知识点，
        不给出「未覆盖」计数会让家长以为孩子的问题只有列出的这几个。
        **与薄弱知识点（错题数代理）是两套口径、并存不替换**（spec §10）。
      required: [items, coveredQuestions, totalQuestions, uncovered]
      properties:
        items:
          type: array
          items:
            type: object
            required: [knowledgePointId, name, masteryScore, level, correctCount, errorCount]
            properties:
              knowledgePointId:
                type: integer
              name:
                type: string
              masteryScore:
                type: number
                description: "0..1 的比值（后端已算好，前端不要再除 100）"
              level:
                type: integer
                description: 段位，0–5（= FLOOR(5 * masteryScore)）。
              correctCount:
                type: integer
              errorCount:
                type: integer
              lastSeenAt:
                type: string
                nullable: true
                description: null = 从未见过（不要编成 0）。
        coveredQuestions:
          type: integer
          description: 题库中**绑了知识点**的题数（实测 203）。
        totalQuestions:
          type: integer
          description: 题库总题数（实测 530）。
        uncovered:
          type: integer
          description: "= totalQuestions - coveredQuestions（后端算好，前端不要自己减）"

    ParentGoalAttainmentItem:
      type: object
      description: >-
        目标达成的一行，**按学科**（2026-09-20 P6.5）：目标是 (学科, 指标) 二元组，
        `metric` 不再全局唯一 —— 前端渲染 key 必须用 `subjectId:metric`。
        `rate` = achieved/target（**分母是 target**），target 为 0 时 null；
        **允许 > 100 = 超额完成**，前端不要截断。
      required: [metric, subjectId, subjectName, period, title, target, achieved, rate]
      properties:
        metric:
          type: string
          enum: [daily_study_minutes, weekly_lessons, daily_words, weekly_passages, weekly_clear_errors]
        subjectId:
          type: integer
          description: 学科 id。
        subjectName:
          type: string
          description: 学科名（展示用，前端不自行映射）。
        period:
          type: string
          enum: [daily, weekly]
          description: 由 metric 派生（daily_study_minutes/daily_words → daily；另两个 → weekly）。
        title:
          type: string
          description: 由 metric 派生的固定标题（家长不能自定义）。
        target:
          type: integer
        achieved:
          type: integer
          description: >-
            窗口内达成的数量。口径按 metric 分派：分钟（向下取整）/ 背过的词数 /
            去重篇目数 / 清零错题数。
        rate:
          type: number
          nullable: true
          description: "达成率（一位小数）；target 为 0 → null。> 100 表示超额。"

    ParentGoalAttainmentSummary:
      type: object
      description: 四个目标维度的达成情况（懒初始化后必然齐 4 条，顺序固定为维度声明顺序）。
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ParentGoalAttainmentItem'
