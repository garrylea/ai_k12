                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ChatLogDetail'
  /parent/students/{studentId}/study-time:
    get:
      tags: [Parent]
      summary: 学习时长（会话口径）
      description: >-
        **口径标注**：会话口径，与 `dashboard.activeDays7` 的四路时间戳代理**并存、不替换**
        （spec §10）。UI 必须并列展示 + 区分文案，不得合并或互相替换。
        `from` / `to` 形如 `YYYY-MM-DD`，缺省近 7 天；值非法**宽容回落**默认窗口、不 400
        （与 `period` 的处理一致）；`from > to` 自动交换。窗口由应用层算好传参，不用 `CURDATE()`。
        只聚合**有效会话**（已结束 / 已惰性收尾的孤儿会话）。归属校验先于取数。
      operationId: getStudyTime
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: 起始日 `YYYY-MM-DD`（含）；缺省 = 近 7 天。
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: 结束日 `YYYY-MM-DD`（含）；缺省 = 今天。
      responses:
        '200':
          description: 学习时长汇总
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StudyTimeSummary'
  /parent/students/{studentId}/today-usage:
    get:
      tags: [Parent]
      summary: 今日已用时长（与每日上限比较）
      description: >-
        `limitMinutes` 取自 `controls.daily_time_limit_minutes`，**为 NULL = 家长未设限**
        → `exceeded = false`（不是「超了」，也不是「用了 0 分钟」）。`exceeded` 用 `>=`：
        用满上限即算超出（管控语义是「该停了」）。「今日」由应用层算好本地日传入。
        读前惰性收尾该学生的孤儿会话（失败只 warn、不 500）。归属校验先于取数。
      operationId: getTodayUsage
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 今日用量汇总
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TodayUsageSummary'
  /parent/students/{studentId}/specials:
    get:
      tags: [Parent]
      summary: 专项学情（四模块）
      description: >-
        埋点 Phase 1B。四个专项模块（语文默写 / 语文解释 / 语文含义 / 英语背单词）在窗口内的聚合，
        **四个键保证都在**（没数据给 0 / rate:null / byDay:[]），前端不必判空。
        `rate` 为 null 表示「本期没有可判对错的作答」，**不是 0**；口径与其它家长端点一致
        （answered = is_correct IS NOT NULL）。`units` = 作答单位数（默写=篇、解释/含义=句、背单词=题），
        所以四个模块的 units 相加没有业务含义，UI 必须分行显示各自的单位。
        `from`/`to` 形如 `YYYY-MM-DD`，缺省近 7 天；值非法**宽容回落**默认窗口、不 400；
        `from > to` 自动交换。窗口由应用层算好传参，不用 `CURDATE()`。归属校验先于取数。
      operationId: getParentSpecials
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: 起始日 `YYYY-MM-DD`（含）；缺省 = 近 7 天。
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: 结束日 `YYYY-MM-DD`（含）；缺省 = 今天。
      responses:
        '200':
          description: 四模块专项聚合
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ParentSpecialsSummary'
  /parent/students/{studentId}/mastery:
    get:
      tags: [Parent]
      summary: 真掌握度（最弱知识点 + 覆盖率）
      description: >-
        埋点 Phase 1B。按 `mastery_score ASC, error_count DESC` 取最弱 N 个知识点。
        **覆盖率三项（coveredQuestions / totalQuestions / uncovered）必须一起展示**：
        题库只有约 38% 的题绑了知识点，不给出「未覆盖」计数会让家长以为孩子的问题只有列出的这几个。
        `masteryScore` 是 0..1 的比值（后端已算好，前端不要再除）。
        **与薄弱知识点（错题数代理）是两套口径、并存不替换**（spec §10）。
        `limit` 缺省 10、上限 50；**越界或非法一律 400**，不静默钳制。归属校验先于取数。
      operationId: getParentMastery
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: 取最弱的 N 项；缺省 10，上限 50，越界 400。
      responses:
        '200':
          description: 掌握度与覆盖率
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ParentMasterySummary'
  /parent/students/{studentId}/goals/attainment:
    get:
      tags: [Parent]
      summary: 目标达成（四个维度）
      description: >-
        埋点 Phase 1B；**2026-09-20 P6.5 起按学科**。目标是 `(学科, 指标)` **二元组**，
        **不存在全局目标** —— 同一个 metric 会在多个学科各有一行（前端渲染 key 用 subjectId:metric）。
        在学学科 = progress 行的学科 ∪ 固定兜底 {语文,英语} ∩ MVP 白名单 {数学,语文,英语}，按
        subjects.sort_order 排序；**没有在学学科 → items: []**（去配置教材），**绝不编造默认目标**。
        无目标时懒初始化（INSERT IGNORE 只补缺失、不覆盖家长已改的值）：数学 3 + 语文 4 + 英语 4 = 11 行。
        达成值按 metric 分派：daily_study_minutes ← study_sessions **按学科**（秒→分钟向下取整）；
        weekly_lessons ← lesson_completions **按学科**（历史完课补不回来，从 2026-09-20 起算）；
        weekly_clear_errors ← main_error_books **按学科**；daily_words / weekly_passages ←
        special_practice_logs（该表 subject_id 恒 NULL，按 module 筛；这两个指标只挂英语/语文）。
        rate = achieved/target（**分母是 target**），为 0 → null；**允许 > 100 = 超额**，前端不截断。
        窗口由应用层算好传参（daily = 今天、weekly = 近 7 天，不用 CURDATE()）。
        返回顺序固定为「学科 sort_order → 指标模板顺序」。归属校验先于取数。
      operationId: getParentGoalAttainment
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 四个目标维度的达成情况
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ParentGoalAttainmentSummary'
  /parent/students/{studentId}/goals/{metric}:
    put:
      tags: [Parent]
      summary: 改目标值（按 metric upsert）
      description: >-
        家长端本模块**唯一的写端点**。**2026-09-20 P6.5 起所有目标都按学科**，故 `subjectId` **必填**
        （走 body 而不是路径：路径参数不够定位资源，再加同深度模板路径只会和 goals/:metric 产生歧义）。
        校验链路 6 步，每步 400 且文案指名原因：归属校验 → metric 白名单 → body Zod
        （target 1–9999 整数、subjectId 正整数）→ **指标×学科匹配**（如 daily_words 只适用英语）
        → **该学科是该生的在学学科** → upsert。period/title 由服务端按 metric 派生，家长无从自定义。
        按唯一键 (student_id, scope_subject_id, metric) upsert，并把 is_active 置回 1（复活曾被停用的目标）。
        reminder_enabled 恒 0（**提醒本期不做**，见 PRD/UX 批注）。
        响应是**该 (学科, 指标) 的最新达成情况** —— 调用方原地替换该行即可，不必再发 GET。
      operationId: putParentGoalTarget
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: metric
          in: path
          required: true
          schema:
            type: string
            enum: [daily_study_minutes, weekly_lessons, daily_words, weekly_passages, weekly_clear_errors]
          description: 目标维度；不在白名单内 → 400（白名单从后端 GOAL_TEMPLATES 派生）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target, subjectId]
              properties:
                target:
                  type: integer
                  minimum: 1
                  maximum: 9999
                  description: 目标值；period/title 由服务端派生。
                subjectId:
                  type: integer
                  minimum: 1
                  description: >-
                    学科 id（**必填**）。必须同时满足：该 metric 适用于该学科、且该学科是该生的
                    在学学科（progress 有行或有兜底），否则 400。
      responses:
        '200':
          description: 该 metric 的最新达成情况
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ParentGoalAttainmentItem'
