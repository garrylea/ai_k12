        渲染「+」号入口**——族树里必然包含单词本身，中→英题点开等于直接看答案。
        wordId 不存在 404；该词没有族（族内不足 2 行）亦 404。
      operationId: getWordFamily
      security: [{ bearerAuth: [] }]
      parameters:
