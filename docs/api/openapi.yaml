                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SubjectConfigsResponse'
  /parent/students/{studentId}/subject-configs/{subjectId}:
    put:
      tags: [Parent]
      summary: 写入/切换某学科教材配置
      description: >-
        `textbookVersionId` 缺省时按默认规则选（同学段 `edition` 非空优先、`id` 大者优先）。
        **已开始学习且版本或册别变化时重置该学科学习状态**并返回 `reset: true`（错题/作业记录保留在库，
        不再展示、不阻塞清零门禁）。错误码：归属 404/1002、403/1005；版本不属于该学科 409/1001；
        该版本不含此年级/册别 409/1001；该学科无任何版本 404/1002。
      operationId: updateSubjectConfig
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
