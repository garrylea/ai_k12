  # Practice
  /practice/judge:
    post:
      tags: [Practice]
      summary: 课堂练习判对错
      description: >-
        学生在 practice 卡片答题后调用。三路由判定：
        (1) 题库命中 + 客观题（choice/true_false/fill_blank）-> exact 答案比对；
        (2) 题库命中主观题（short_answer/proof）或未命中 -> AI JudgmentCapability 判定；
        (3) 答错 -> 写入 main_error_books（未入库的题先经 QuestionStructuringCapability
        结构化后插 questions 表，结构化失败则 question_id=NULL 仅存题面）。
        AI 判定失败返回 503（code=5001，不写错题本，前端可区分处理）。
      operationId: judgePractice
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JudgeRequest'
      responses:
        '200':
          description: 判定结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/JudgeResult'
        '503':
          description: AI 判定失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 5001
                  message:
                    type: string
                    example: 判定失败，请重试

  /practice/hint:
    post:
      tags: [Practice]
      summary: 课堂练习提示（AI 生成 + Card 级缓存）
      description: >-
        学生在 practice 卡片答题前点「提示」调用。先查 cards.hints 缓存（JSON：
        { "<题目文本>": "<提示文本>" }）命中直返（不调 AI）；未命中则调
        HintCapability 生成苏格拉底式提示（只启发不给答案）并写回 cards.hints，
        供后续复用（Card 级共享，不分学生）。AI 生成失败返回 503（code=5001，
        前端降级显示静态文案，不阻断答题）。
      operationId: getPracticeHint
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HintRequest'
      responses:
        '200':
          description: 提示内容
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HintResult'
        '503':
          description: AI 提示生成失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 5001
                  message:
                    type: string
                    example: 提示生成失败，请重试

  /practice/discuss:
    post:
      tags: [Practice]
      summary: 课堂练习「让 AI 讲一讲」（苏格拉底讨论）
      description: >-
        学生在 practice 卡片答题前点「让 AI 讲一讲」调用。打开讨论即：① 记入主线错题本
        （find-or-create 幂等，source='discuss'，无论后续答对答错都保留）；② 创建带 card_id
        的 mainline 对话并返回 dialogueId。前端据此走 POST /ai/tutor/stream（mode=mainline）
        做苏格拉底式多轮讨论——TutoringCapability 据 card_id 解析 cardContent 限定范围（只能
        讨论该卡片内容，不能聊其它），3 次失败/放弃后兜底给完整解析。questionId 用
        content_hash 快查（不调 AI 结构化），未命中则 question_id=null + wrong_answer_text 存题面。
      operationId: startPracticeDiscuss
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscussRequest'
      responses:
        '200':
          description: 错题本记录 + mainline 对话 dialogueId
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DiscussResult'
        '500':
          description: 创建讨论会话失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 5000
                  message:
                    type: string
                    example: 创建讨论会话失败

  /practice/discuss-card:
    post:
      tags: [Practice]
      summary: 卡片级「思辨答疑」（苏格拉底讨论）
      description: >-
        学生在非 practice 知识卡片上点「思辨答疑」调用。与 `/practice/discuss` 区别：
        scope=整张卡片（非某道题），**不入错题本**（讨论的是知识而非一道题）。
        服务端按 (student, card_id, track='mainline') find-or-create 对话并返回 dialogueId；
        前端据此走 POST /ai/tutor/stream（mode=mainline）做苏格拉底式多轮讨论——
        TutoringCapability 据 card_id 解析 cardContent 限定范围（只能讨论该卡片内容）。
        重开同一卡片的讨论会自动回到同一对话线。
      operationId: startCardDiscuss
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscussCardRequest'
      responses:
        '200':
          description: mainline 对话 dialogueId
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DiscussCardResult'
        '500':
          description: 创建讨论会话失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 5000
                  message:
                    type: string
                    example: 创建讨论会话失败

  /practice/previous-errors:
    get:
      tags: [Practice]
      summary: 查询当前课上一节课的未清零错题数
      description: >-
        用于课程详情页左侧阶段栏「错题清零」门禁。服务端按 units.sort_order /
        lessons.sort_order 推导当前课的上一节课，再统计该学生在该课的未清零主线错题数。
        若当前课是整本教材第一课，返回 count=0、lessonId=null。
      operationId: getPreviousLessonErrors
      security: [{ bearerAuth: [] }]
      parameters:
        - name: lessonId
          in: query
          required: true
          schema:
            type: integer
          description: 当前课 id
      responses:
        '200':
          description: 上一课未清零错题数
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PreviousErrorsResult'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CommonResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
      required: [code, message]

    StarMapData:
      type: object
      description: 星图渲染数据（章节=单元，小节=课）
      properties:
        subjectName:
          type: string
        gradeName:
          type: string
          description: 当前学期名称，如「九年级下册」
        publisher:
          type: string
        totalUnits:
          type: integer
        completedUnits:
          type: integer
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/StarMapChapter'
      required: [subjectName, gradeName, totalUnits, completedUnits, chapters]

    StarMapChapter:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        order:
          type: integer
        importance:
          type: string
          enum: [large, medium, small]
        status:
          type: string
          enum: [completed, current, locked]
        progress:
          type: integer
          description: 0-100
        sections:
          type: array
          items:
            $ref: '#/components/schemas/StarMapSection'
      required: [id, title, order, importance, status, progress, sections]

    StarMapSection:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        order:
          type: integer
        knowledgePointCount:
          type: integer
        status:
          type: string
          enum: [completed, current, locked]
        progress:
          type: integer
          description: 0-100
      required: [id, title, order, knowledgePointCount, status, progress]

    TokenResponse:
      allOf:
        - $ref: '#/components/schemas/CommonResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string
                user:
                  $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
          enum: [parent, student]
        name:
          type: string
        phone:
          type: string

    Parent:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            subscriptionStatus:
              type: string

    Student:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        username:
          type: string
        age:
          type: integer
        grade:
          type: string
        textbookVersion:
          type: string
        parentId:
          type: string

    CreateStudentRequest:
      type: object
      properties:
        name:
          type: string
        username:
          type: string
        age:
          type: integer
        grade:
          type: string
        textbookVersion:
          type: string
      required: [name, username, age, grade]

    StudentSettings:
      type: object
      properties:
        theme:
          type: string
          enum: [auto, day, night]
        school:
          type: string
          enum: [primary, junior, senior]
        motionEnabled:
          type: boolean

    ProgressOverview:
      type: object
      properties:
        studentId:
          type: string
        currentSubjectId:
          type: string
        currentUnitId:
          type: string
        currentLessonId:
          type: string
        nextUnlockType:
          type: string
          enum: [lesson, unit_test, midterm, final]
        isClear:
          type: boolean
        pendingClearCount:
          type: integer

    SubjectProgress:
      type: object
      properties:
        subjectId:
          type: string
        units:
          type: array
          items:
            type: object
            properties:
              unitId:
                type: string
              status:
                type: string
                enum: [locked, available, completed]
              clearStatus:
                type: boolean

    Subject:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        gradeBands:
          type: array
          items:
            type: string

    TextbookVersion:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        subjectId:
          type: string
        publisher:
          type: string

    Unit:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        order:
          type: integer

    Lesson:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        order:
          type: integer

    Card:
      type: object
      properties:
        id:
          type: string
        lessonId:
          type: string
