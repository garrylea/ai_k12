  # 英语背单词（2026-09-16）——独立子系统：不挂 questions、不进错题本、不参与主线清零门禁
  /training/vocabulary/options:
    get:
      tags: [Training]
      summary: 背单词配置页数据（词库规模 / 今日已背 / 四个筛选各自的池子大小）
      description: >-
        英语背单词配置页数据（student JWT）。pools 是三档可选词库范围及词数：
        junior=「仅初中」（含小学二级词，课标 2022 版 1600 词口径）、senior=「仅高中」
        （= 3000 词表中不在 1600 词表里的部分）、all=两者之和。存储层其实是四层
        （primary/junior/senior_required/senior_elective），页面只暴露这三档。
        counts 是四个筛选项各自可用的词数：notLearned=总数-已背过（含从无进度行的词）、
        myWrong=该学生错过的词、commonWrong=全平台答错过（error_count>0）的词、
        extended=有熟词僻义的词。todayAnswered 按**服务器本地时区**当日 00:00 起算，
        「见过就算」（答对/答错/不认识/判题失败都计入）。
      operationId: getVocabularyOptions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 配置页数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VocabularyOptionsResult'

  /training/vocabulary/start:
    post:
      tags: [Training]
      summary: 背单词开练（抽题）
      description: >-
        背单词开练（student JWT）。**返回 201**（Nest `@Post` 默认码，本仓既有 POST 端点同此，
        历史文档标 200 属笔误）。校验：count 限 **10-20** 整数（非法 400）；levelPool ∈
        junior|senior|all；order ∈ random|alpha|alpha_desc|letter；direction ∈
        en2cn|cn2en|ph2en|random；**order=letter 时必须给单个 a-z 字母的 letter，非 letter 模式给了
        letter 则 400**（静默忽略会让学生以为筛选生效了）。
        `ph2en` = 看音标写单词（题面是音标、答案是英文单词）；词没有可用音标时**退化成英→中
        而不是把这个词丢掉**（静默丢词会让学生以为筛选坏了），`/`、`//` 这类空音标算作没有。
        服务端会把 direction 落定成实际方向（random 逐题在**本词出得了的方向**里等概率掷）；
        **勾了 onlyExtendedSense 时
        方向强制 en2cn**——三档判题口径（含「答成常见义」那一档）建立在「题面给单词 + 语境、
        学生答中文」之上，中→英下这一档失去意义；**熟词僻义题恒为 en2cn**（`ph2en` 只有音标，
        学生既看不到单词也看不到搭配，而「在搭配里认出那个不常见的意思」正是考点）。
        **普通模式下也会抽到熟词僻义题**（在候选里
        等概率抽），勾选的作用是「只留」僻义。一个词只出一道题，会话长度 == count。
        **防泄漏**：凡是**答案等于英文单词**的题（`cn2en` 与 `ph2en`）响应里**不含**
        word/phonetic/context/hasFamily——词根族树里必然含单词本身；`ph2en` 的音标只出现在
        `prompt` 一处（`phonetic` 为 null）。
        题池为空返回 { questions: [], poolSize: 0 }。
      operationId: startVocabulary
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VocabularyStartRequest'
      responses:
        '201':
          description: 题单（cn2en 题不含单词/音标/语境/词根族提示）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VocabularyStartResult'
        '400':
          description: count 越界 / 三个枚举非法 / letter 缺失或在非 letter 模式下误传

  /training/vocabulary/judge:
    post:
      tags: [Training]
      summary: 背单词判题（三条路由：中→英纯程序 / 英→中常见义 / 英→中熟词僻义）
      description: >-
        背单词判题（student JWT）。**返回 201**。请求校验：wordId 须正整数（非法 400）、
        不存在 404；senseIndex 须非负整数（非法 400）；promptKind ∈ en2cn|cn2en|ph2en；
        answer 非字符串降级空串（防 number 混进去变 500）。
        三条路由：① **答案是英文单词的两条**（中→英 `cn2en`、看音标写单词 `ph2en`）
        ——纯程序比对（归一化后相等，或命中人工整理的拼写变体组，
        或正确答案含连字符/空格时忽略其差异），**不调 LLM**，答错时给 spellingDiff
        逐字符差异；② **英→中·常见义**——先把该词全部常见义的 gloss 按 `；,、/` 拆成原子
        做归一化比对（命中即 exact，不调模型），未命中才调 english_word_judge 场景
        （primary=local、fallback=deepseek-flash，本地端点下发 chat_template_kwargs 关
        thinking），二档 correct|wrong；③ **英→中·熟词僻义**——同上但只认目标僻义义项，
        且调模型时**必须带上锁定僻义的语境搭配**（「在搭配里认那个僻义」正是考点），
        模型判三档 correct|off_target|wrong；common 模式下模型若输出 off_target 会收敛成
        wrong。senseIndex 越界（内容重灌后下标漂移）时按「全义项都接受」判——宁放过不错杀。
        判题失败 → verdict=undetermined，**不抛错**。
        记账：correct 置 learned、wrong 同时给学生错次与全局 error_count 各加一；
        **off_target / unanswered（空作答） / undetermined 三者都不计错**
        （「不会」不等于「易错」，判题失败更不该让学生背锅）。
      operationId: judgeVocabularyWord
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VocabularyJudgeRequest'
      responses:
        '201':
          description: 判定结果（含标准答案与可选拼写差异）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VocabularyJudgeResult'
        '400':
          description: wordId / senseIndex / promptKind 非法
        '404':
          description: 单词不存在

