      summary: 语文含义判题（逐句：该句字词 + 深层含义 + 作者情感）
      description: >-
        语文含义判题（student JWT）——**逐句**判，**返回 201**。一次请求判一句：该句的关键字词 +
        深层含义 + 作者情感**打包成一次 LLM 调用**（scene=chinese_meaning_judge，primary=local
        本地 llama.cpp、fallback=deepseek-flash，本地端点同样靠 chat_template_kwargs 关 thinking）。
        请求校验：passageId 须正整数（非法 400）、篇目不存在 404；sentenceIndex 须非负整数
        （非法 400）、越界 400、**该句没有标准含义 400**（`answerable:false` 的句子本来就
        不该被提交）；meaning/emotion 非字符串降级空串；terms 非数组视作 []，元素 term 非字符串
        丢弃该条、answer 非字符串降级空串（防 number 混进去变 500）。
        **判题流程只有两段，没有解释专项那个「归一化全等短路」**：① 学生答案空白 →
        correct=false, method=unanswered（本专项唯一的程序判断）；
        ② 其余待判项**一次**喂给 LLM，命中回 correct + method=ai + comment。
        **method 只有 ai / unanswered / undetermined 三种，刻意没有 exact**——含义与情感是
        理解性作答，学生答得跟标准答案逐字相同也不能靠字符串相等判「对」，一律过 LLM
        （有测试用例钉着 method 不会出现 exact，勿「顺手补上」）。
        模型漏项或整次调用失败 → 那些项保持 correct=null, method=undetermined
        （**不抛错、已判项不清空**）。
