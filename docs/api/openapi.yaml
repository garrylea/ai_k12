          type: string
          nullable: true
          enum: [logic, calculation, format, missing]
          description: AI 判定的错误类型，仅 method=ai 时返回
        errorBookId:
          type: integer
          nullable: true
          description: 答错时写入 main_error_books 的 id；答对或 AI 判定失败时不返回

    HintRequest:
      type: object
      required: [cardId, lessonId, subjectId, questionText]
      properties:
        cardId:
          type: integer
          description: 当前 practice 卡片 ID
        lessonId:
          type: integer
          description: 当前课程 ID
        subjectId:
          type: integer
          description: 学科 ID
        questionText:
          type: string
          description: 题面原文，同时作为 cards.hints JSON 的 key（即「题目标题」）

    HintResult:
      type: object
      properties:
        hint:
          type: string
          description: 苏格拉底式提示文本（只启发不给答案，公式用 $...$ LaTeX）
        cached:
          type: boolean
          description: true=命中 cards.hints 缓存直返（未调 AI）；false=本次 AI 新生成并已写回缓存

    DiscussRequest:
      type: object
      required: [cardId, lessonId, subjectId, questionText]
      properties:
        cardId:
          type: integer
          description: 当前 practice 卡片 ID（限定讨论范围 + 错题本 source_ref_id）
        lessonId:
          type: integer
          description: 当前课程 ID
        subjectId:
          type: integer
          description: 学科 ID
        questionText:
          type: string
          description: 题面原文；question_id 为空时作为错题本去重键（wrong_answer_text）

    DiscussResult:
      type: object
      properties:
        dialogueId:
          type: string
          description: mainline 对话 id，前端据此走 /ai/tutor/stream 做苏格拉底讨论
        errorBookId:
          type: integer
          description: 本次命中或新建的主线错题本记录 id
        questionId:
          type: integer
          nullable: true
          description: 题库中的题目 id（content_hash 未命中则为 null）

    DiscussCardRequest:
      type: object
      required: [cardId, lessonId, subjectId]
      properties:
        cardId:
          type: integer
          description: 当前知识卡片 ID（限定讨论范围）
        lessonId:
          type: integer
          description: 当前课程 ID
        subjectId:
          type: integer
          description: 学科 ID

    DiscussCardResult:
      type: object
      properties:
        dialogueId:
          type: string
          description: mainline 对话 id（find-or-create：可能复用已有讨论），前端据此走 /ai/tutor/stream 做苏格拉底讨论

    PreviousErrorDetail:
      type: object
      description: 一条未清零课堂练习错题（错题清零用）
      properties:
        errorBookId:
          type: integer
          description: main_error_books.id，清零后仍错时用于 bump level
        cardId:
          type: integer
          description: 卡片 id（main_error_books.source_ref_id），判题复用
        questionN:
          type: string
          description: 卡内复合题号（如 "0-1"）；历史行未回填时合成 cleanup 加 id 的唯一键
        questionText:
          type: string
          description: 题面（question_id 非空取 questions.content，否则取 wrong_answer_text）
        questionId:
          type: integer
          nullable: true
          description: 题库 id，未入库为 null
      required: [errorBookId, cardId, questionN, questionText, questionId]

    UnclearedErrorsResult:
      type: object
      properties:
        errors:
          type: array
          description: 未清零错题列表（已按 cardId+questionN 去重）；计数 = errors.length
          items:
            $ref: '#/components/schemas/PreviousErrorDetail'
      required: [errors]

    BumpErrorLevelsRequest:
      type: object
      properties:
        errorBookIds:
          type: array
          items:
            type: integer
          description: 清零后仍错的 main_error_books.id 列表
      required: [errorBookIds]

    TrainingErrorBookEntry:
      type: object
      description: 错题练习列表条目（未清零记录；同一错题挂多 KP 时按 errorBookId 聚合）
      properties:
        errorBookId:
          type: integer
          description: main_error_books.id
        questionId:
          type: integer
          nullable: true
          description: 题库题目 id（历史行未入库为 null）
        questionText:
          type: string
          description: 题面（question_id 非空取 questions.content，否则取 wrong_answer_text）
        type:
          type: string
          nullable: true
          description: 题型（questions.type；题目未入库为 null）
        level:
          type: integer
          description: 错题严重程度（重做仍错递增）
        createdAt:
          type: string
          format: date-time
          description: 入错题本时间（ISO 8601）
        kpIds:
          type: array
          items:
            type: integer
          description: 该题关联的知识点 id 列表（无关联为空数组）
      required: [errorBookId, questionId, questionText, type, level, createdAt, kpIds]

    TrainingJudgeRequest:
      type: object
      required: [questionId, subjectId, studentAnswer, source]
      properties:
        questionId:
          type: integer
          description: 题库题目 id（训练题必来自题库；题目不存在 400/code=4004）
        subjectId:
          type: integer
          description: 学科 ID
        studentAnswer:
          type: string
          description: 学生提交的答案文本
        source:
          type: string
          enum: [targeted, error_practice]
          description: 训练来源——targeted=专项练习；error_practice=错题练习（非法值 400）

    TrainingSelfAssessRequest:
      type: object
      required: [questionId, subjectId, assessment, source]
      properties:
        questionId:
          type: integer
          description: 题库题目 id（题目不存在 404）
        subjectId:
          type: integer
          description: 学科 ID
        assessment:
          type: string
          enum: [correct, incorrect]
          description: correct=学生自评做对；incorrect=学生自评做错（非法值 400）
        source:
          type: string
          enum: [targeted, error_practice, exam]
          description: 自评来源——targeted=专项练习；error_practice=错题练习；exam=考试结果页自评（非法值 400）
        sourceRefId:
          type: integer
          nullable: true
          description: 考试来源传 sessionId；其余来源不传或传 null

    TrainingHintRequest:
      type: object
      required: [questionId]
      properties:
        questionId:
          type: integer
          description: 题库题目 id（题目不存在 404）

    TrainingHintResult:
      type: object
      properties:
        hint:
          type: string
          description: 苏格拉底式提示文本（只启发不给答案）
        cached:
          type: boolean
          description: true=命中 question_hints 题级缓存直返（未调 AI）；false=本次 AI 新生成并已写回缓存

    TrainingKnowledgePoint:
      type: object
      description: 专项练习知识点（平铺列表，树形组装放前端）
      properties:
        id:
          type: integer
          description: 知识点 id
        name:
          type: string
          description: 知识点名称
        parentKpId:
          type: integer
          nullable: true
          description: 父知识点 id（顶级为 null，前端据此组树）
        gradeBand:
          type: string
          description: 学段（primary/junior/senior）

    TargetedStartRequest:
      type: object
      required: [subjectId, kpId, type, count]
      properties:
        subjectId:
          type: integer
          description: 学科 ID
        kpId:
          type: integer
          description: 知识点 id
        type:
          type: string
          nullable: true
          enum: [choice, fill_blank, true_false, short_answer, proof]
          description: 题型过滤；null=不限题型（白名单外取值 400）
        count:
          type: integer
          minimum: 1
          maximum: 20
          description: 抽题数量，限 1-20 整数（越界/非整数 400）

    TargetedStartResult:
      type: object
      properties:
        questions:
          type: array
          description: 随机题单（白名单序列化，answer/explanation 剥离；抽不到题为空数组）
          items:
            $ref: '#/components/schemas/TargetedPracticeQuestion'
      required: [questions]

    TargetedPracticeQuestion:
      type: object
      properties:
        questionId:
          type: integer
          description: 题库题目 id
        text:
          type: string
          description: 题面原文
        type:
          type: string
          description: 题型（choice/fill_blank/true_false/short_answer/proof）
        options:
          type: array
          items: {}
          nullable: true
          description: 选项数组（DB JSON 字符串 parse 后；无/坏 JSON 为 null）

    DictationPassageListResult:
      type: object
      description: 语文默写篇目清单（仅已校验篇目，不含正文）
      properties:
        passages:
          type: array
          items:
            $ref: '#/components/schemas/DictationPassage'
      required: [passages]

    DictationPassage:
      type: object
      description: >-
        默写篇目元数据（配置页选篇用）。只含篇名与册次；作者/朝代/正文是学生要
        作答的三个判题字段，故意不下发。
      properties:
        questionId:
          type: integer
          description: 题库题目 id（questions 行作锚点）
        workTitle:
          type: string
          description: 篇名（如「静夜思」）
        semester:
          type: string
          description: 册次（上册/下册）
      required: [questionId, workTitle, semester]

    DictationStartRequest:
      type: object
      required: [semester, questionIds, count]
      properties:
        semester:
          type: string
          nullable: true
          enum: [上册, 下册]
          description: 册次范围；null=全部册次（白名单外取值 400）
        questionIds:
          type: array
          nullable: true
          items:
            type: integer
            minimum: 1
          description: 指定篇目 id 列表；非空时按指定篇目出题并忽略 semester；null=按册次随机抽题
        count:
          type: integer
          minimum: 1
          maximum: 20
          description: 抽题数量，限 1-20 整数（越界/非整数 400）

    DictationStartResult:
      type: object
      properties:
        questions:
          type: array
          description: 默写题单（白名单序列化，author/dynasty/正文剥离；题池为空时为空数组）
          items:
            $ref: '#/components/schemas/DictationQuestion'
      required: [questions]

    DictationQuestion:
      type: object
      properties:
        questionId:
          type: integer
          description: 题库题目 id
        prompt:
          type: string
          description: 题面（如「请默写《静夜思》（并写出作者与朝代）」）
        workTitle:
          type: string
          description: 篇名
        semester:
          type: string
          description: 册次（上册/下册）
      required: [questionId, prompt, workTitle, semester]

    DictationJudgeRequest:
      type: object
      required: [questionId, author, dynasty, body]
      properties:
        questionId:
          type: integer
          description: 题库题目 id（须正整数，非法 400；篇目不存在 404）
        author:
          type: string
          description: 学生作答的作者
        dynasty:
          type: string
          description: 学生作答的朝代
        body:
          type: string
          description: 学生作答的正文（标点/空格/全半角不参与判对错）

    DictationJudgeResult:
      type: object
      description: 默写判题结果（程序化对错 + LCS 差异 + 可选 LLM 错因）
      properties:
        questionId:
          type: integer
        isCorrect:
          type: boolean
          description: 三项全对才为 true（程序化判定，不调用 LLM）
        fields:
          type: object
          description: 三字段各自的匹配结果
          properties:
            author:
              $ref: '#/components/schemas/DictationFieldMatch'
            dynasty:
              $ref: '#/components/schemas/DictationFieldMatch'
            body:
              $ref: '#/components/schemas/DictationFieldMatch'
          required: [author, dynasty, body]
        bodyDiff:
          type: array
          description: 正文逐字差异（全对时为空数组；相邻漏写+多写合并为 wrong）
          items:
            $ref: '#/components/schemas/DictationDiffOp'
        reference:
          $ref: '#/components/schemas/DictationReference'
        feedback:
          type: string
          nullable: true
          description: LLM 生成的可选错因文案（dictation_feedback 场景）；模型不可达/失败时为 null，不影响判题
        errorBookId:
          type: integer
          description: 答错时写入/复用的 main_error_books id；答对时该键省略
      required: [questionId, isCorrect, fields, bodyDiff, reference, feedback]

    DictationFieldMatch:
      type: object
      properties:
        match:
          type: boolean
          description: 该字段归一化后是否与参考答案全等
      required: [match]

    DictationDiffOp:
      type: object
      description: >-
        正文差异片段。type=equal 带 text；type=missing 带被漏写的 text；
        type=extra 带学生多写的 text；type=wrong 带 expected/actual（写错字）。
      properties:
        type:
          type: string
          enum: [equal, wrong, missing, extra]
        text:
          type: string
          description: equal/missing/extra 片段的文本
        expected:
          type: string
          description: wrong 片段的参考答案字符
        actual:
          type: string
          description: wrong 片段的学生作答字符
      required: [type]

    DictationReference:
      type: object
      description: 参考答案三字段
      properties:
        author:
          type: string
        dynasty:
          type: string
        body:
          type: string
      required: [author, dynasty, body]

    HiddenQuestion:
      type: object
      properties:
        questionId: { type: integer, format: int64 }
        questionText: { type: string, description: 题面预览（80 字截断） }
        type: { type: string }
        kpName: { type: string, nullable: true, description: 首个 primary kp 名 }
        markedAt: { type: string, format: date-time }

    ExamPaper:
      type: object
      description: 试卷列表条目（仅元数据，不含题目）
      properties:
        id:
          type: integer
          description: 试卷 id
        title:
          type: string
          description: 试卷标题
        year:
          type: integer
          nullable: true
          description: 年份（可空）
        district:
          type: string
          nullable: true
          description: 地区（可空）
        examType:
          type: string
          nullable: true
          description: 试卷类型（可空）
        gradeBand:
          type: string
          nullable: true
          description: 学段（可空）
        questionCount:
          type: integer
          description: 题目数量
      required: [id, title, year, district, examType, gradeBand, questionCount]

    ExamQuestionMeta:
      type: object
      description: 试卷题单元数据（白名单：无 answer/explanation，防答案泄露）
      properties:
        questionId:
          type: integer
          description: 题库题目 id
        questionNo:
          type: integer
          description: 卷内题号（paper_questions.question_no）
        text:
          type: string
          description: 题面原文
        type:
          type: string
          description: 题型（choice/fill_blank/true_false/short_answer/proof）
        options:
          type: array
          items: {}
          nullable: true
          description: 选项数组（DB JSON 字符串 parse 后；无/坏 JSON 为 null）
      required: [questionId, questionNo, text, type, options]

    ExamPaperDetail:
      type: object
      description: 试卷详情（题目元数据 + 推荐时长）
      properties:
        id:
          type: integer
          description: 试卷 id
        title:
          type: string
          description: 试卷标题
        durationMinutes:
          type: integer
          description: 推荐时长（分钟）——choice/true_false 每题 1 分钟、其余每题 3 分钟，总和向上取整到 15 的倍数，clamp [30, 180]
        questions:
          type: array
          items:
            $ref: '#/components/schemas/ExamQuestionMeta'
      required: [id, title, durationMinutes, questions]

    ExamSessionCreateRequest:
      type: object
      required: [paperId, durationMinutes]
      properties:
        paperId:
          type: integer
          description: 试卷 id（试卷不存在 404）
        durationMinutes:
          type: integer
          minimum: 10
          maximum: 300
          description: 考试时长（分钟），限 10-300 整数（越界/非整数 400）

    ExamSessionCreated:
      type: object
      description: >-
        开考/续考响应（同构；续考不重置时长，deadlineAt 沿用既有会话）。
        status 仅在「命中的续考会话已超时、服务端自动收卷后」返回
        'submitted'（前端据此直接踢结果页）；新建/正常续考缺省。
      properties:
        sessionId:
          type: integer
          description: 考试会话 id
        status:
          type: string
          enum: [in_progress, submitted]
          description: 缺省视为 in_progress；'submitted' 表示命中超时会话已自动收卷
        deadlineAt:
          type: string
          format: date-time
          description: 截止时间（ISO 8601）
        remainingSeconds:
          type: integer
          description: 剩余秒数（deadline - now）
        questions:
          type: array
          description: 题单（白名单，无 answer/explanation）
          items:
            $ref: '#/components/schemas/ExamQuestionMeta'
      required: [sessionId, deadlineAt, remainingSeconds, questions]

    ExamSubmitAnswerRequest:
      type: object
      required: [questionId, answerText]
      properties:
        questionId:
          type: integer
          description: 题库题目 id（不在该卷题单 400）
        answerText:
          type: string
          description: 学生提交的答案文本

    ExamAnswerSaved:
      type: object
      description: 单题提交白名单响应（不回传对错——考试防作弊设计，对错只在 results 出现）
      properties:
        saved:
          type: boolean
          description: 恒为 true（判题结果落库但不透出）
      required: [saved]

    ExamSessionState:
      type: object
      description: 会话状态（断线恢复；answered 只含作答文本，判题字段剥离）
      properties:
        sessionId:
          type: integer
          description: 考试会话 id
        status:
          type: string
          enum: [in_progress, submitted]
          description: in_progress=进行中；submitted=已交卷（含超时自动收卷）
        remainingSeconds:
          type: integer
          description: 剩余秒数（submitted 为 0）
        questions:
          type: array
          description: 题单（白名单，无 answer/explanation）
          items:
            $ref: '#/components/schemas/ExamQuestionMeta'
        answered:
          type: object
          description: 已答 map——questionId（字符串键）-> {answerText}
          additionalProperties:
            type: object
            properties:
              answerText:
                type: string
                nullable: true
                description: 学生作答文本（无判题字段，不泄露对错）
      required: [sessionId, status, remainingSeconds, questions, answered]

    ExamSummary:
      type: object
      description: 交卷汇总（submit 响应；results 内嵌同构字段）——主观题不计对错，correctCount/accuracy 只算客观题
      properties:
        correctCount:
          type: integer
          description: 答对题数（is_correct=1 计数；未作答/补判失败均按错计）
        totalCount:
          type: integer
          description: 总题数（题单长度）
        accuracy:
          type: number
          description: 正确率（百分比一位小数，如 33.3；分母为客观题数，客观题为 0 时取 0）
        subjectiveCount:
          type: integer
          description: 主观题数（is_correct NULL 计数，self_assess 模式不判对错；遗留 ai 模式已判主观行按客观错题计）
      required: [correctCount, totalCount, accuracy, subjectiveCount]

    ExamResultItem:
      type: object
      description: 结果页逐题条目（JOIN questions 带解析）
      properties:
        questionId:
          type: integer
          description: 题库题目 id
        questionNo:
          type: integer
          description: 卷内题号
        text:
          type: string
          description: 题面原文
        type:
          type: string
          description: 题型
        options:
          type: array
          items: {}
          nullable: true
          description: 选项数组（DB JSON 字符串 parse 后；无/坏 JSON 为 null）
        answerText:
          type: string
          nullable: true
          description: 学生作答文本（未作答为 null）
        isCorrect:
          type: integer
          nullable: true
          enum: [0, 1]
          description: 对错（0=错，1=对；number 而非 boolean——未作答按错计落 0；null=主观题待自评）
        answer:
          type: string
          nullable: true
          description: 参考答案（主观题自评对照展示）
        needsSelfAssessment:
          type: boolean
          description: true=主观题待自评（is_correct NULL）
        selfAssessment:
          type: string
          nullable: true
          enum: [correct, incorrect]
          description: 该生最近一次自评（question_self_assessments 留痕）；未自评为 null
        analysis:
          type: string
          nullable: true
          description: 判题题解（JudgeCore 分析）
        explanation:
          type: string
          nullable: true
          description: 题库解析
      required: [questionId, questionNo, text, type, options, answerText, isCorrect, answer, needsSelfAssessment, selfAssessment, analysis, explanation]

    ExamResults:
      type: object
      description: 结果页响应（仅 submitted 会话可查，in_progress 409/code=4103）
      allOf:
        - $ref: '#/components/schemas/ExamSummary'
        - type: object
          properties:
            items:
              type: array
              description: 逐题对错与解析
              items:
                $ref: '#/components/schemas/ExamResultItem'
          required: [items]

    PracticeResult:
      type: object
      properties:
        questionN:
          type: string
          description: 卡内复合题号（如 "0-1"）
        questionText:
          type: string
          description: 题面原文
        studentAnswer:
          type: string
          description: 学生提交答案
        isCorrect:
          type: boolean
          description: 对错
        method:
          type: string
          enum: [exact, ai]
        analysis:
          type: string
          nullable: true
          description: 题解（仅错题，复用判题 analysis；对题为 null）
        errorType:
          type: string
          nullable: true
          enum: [logic, calculation, format, missing]

    RegisterRequest:
      type: object
      properties:
        phone:
          type: string
        password:
          type: string
        guardianAgreement:
          type: boolean
      required: [phone, password, guardianAgreement]

    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    ConversationDetail:
      allOf:
        - $ref: '#/components/schemas/Conversation'
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message'
