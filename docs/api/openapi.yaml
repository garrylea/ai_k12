  /parent/students/{studentId}/subject-configs:
    get:
      tags: [Parent]
      summary: 按学科教材配置视图（每学科当前配置 + 可选项）
      description: >-
        每学科返回当前配置（`configured=false` 时是按学生年级**推导的默认值、不落库**）+ 可选项
        （只含**有教材数据**的年级；无数据学科不出现）。`options[].grades[].versions[]` 按默认规则
        排序（同学段 `edition` 非空优先、`id` 大者优先）。归属校验：学生不存在 404/1002、不属于本家长 403/1005。
      operationId: getSubjectConfigs
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 各学科配置 + 可选项
