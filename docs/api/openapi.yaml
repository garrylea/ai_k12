openapi: 3.1.0
info:
  title: K12 智学系统 API
  description: K12 智学系统 REST API 与 WebSocket 规范
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: 开发环境
  - url: https://api.example.com/api
    description: 生产环境
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: 认证与授权
  - name: Users
    description: 用户账号管理
  - name: Progress
    description: 学习进度与解锁
  - name: Content
    description: 内容与课程体系
  - name: KnowledgeGraph
    description: 知识点图谱
  - name: Assessment
    description: 测评与考试
  - name: AI
    description: AI 辅导与智能能力
  - name: Refinery
    description: 数据识别与提取
  - name: Files
    description: 文件上传
  - name: ErrorBook
    description: 主线错题本（全系统唯一）
  - name: Conversations
    description: 对话管理
  - name: Rewards
    description: 奖励服务
  - name: Parent
    description: 家长端服务
  - name: Admin
    description: 管理员中枢（模型配置/封禁/推送/AI 聊天）
  - name: Quota
    description: AI 额度与套餐
  - name: Practice
    description: 课堂练习判对错
  - name: Training
    description: 错题练习与专项训练（辅线学习闭环）
  - name: Exams
    description: 真题试卷考试（选卷/开考/逐题作答/交卷/结果）
paths:
  # Auth
  /auth/register:
    post:
      tags: [Auth]
      summary: 家长注册
      operationId: registerParent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /auth/login:
    post:
      tags: [Auth]
      summary: 统一登录
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /auth/logout:
    post:
      tags: [Auth]
      summary: 登出
      operationId: logout
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
  /auth/password/reset-request:
    post:
      tags: [Auth]
      summary: 请求重置密码
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
      responses:
        '200':
          description: 请求已发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
  /auth/password/reset:
    post:
      tags: [Auth]
      summary: 确认重置密码
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                code:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: 密码已重置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
  /auth/me:
    get:
      tags: [Auth]
      summary: 获取当前身份
      operationId: getMe
      responses:
        '200':
          description: 当前用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

  # Users
  /users/parents/me:
    get:
      tags: [Users]
      summary: 当前家长资料
      operationId: getParentMe
      responses:
        '200':
          description: 家长资料
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Parent'
    patch:
      tags: [Users]
      summary: 更新家长资料
      operationId: updateParentMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Parent'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
  /users/students:
    get:
      tags: [Users]
      summary: 学生子账号列表
      operationId: listStudents
      responses:
        '200':
          description: 学生列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Student'
    post:
      tags: [Users]
      summary: 创建学生子账号
      operationId: createStudent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Student'
  /users/students/{studentId}:
    get:
      tags: [Users]
      summary: 学生资料
      operationId: getStudent
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 学生资料
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Student'
    patch:
      tags: [Users]
      summary: 更新学生资料
      operationId: updateStudent
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Student'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
  /users/students/{studentId}/settings:
    get:
      tags: [Users]
      summary: 学生 UI 设置
      operationId: getStudentSettings
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 设置项
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StudentSettings'
    patch:
      tags: [Users]
      summary: 更新学生 UI 设置
      operationId: updateStudentSettings
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentSettings'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'

  # Progress
  /progress/students/{studentId}/overview:
    get:
      tags: [Progress]
      summary: 学习总览
      operationId: getProgressOverview
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 进度总览
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProgressOverview'
  /progress/students/{studentId}/subjects/{subjectId}:
    get:
      tags: [Progress]
      summary: 单学科进度
      operationId: getSubjectProgress
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
        - name: subjectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 学科进度
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SubjectProgress'
  /progress/students/{studentId}/star-map:
    get:
      tags: [Progress]
      summary: 知识星图
      description: >-
        单学科知识星图：把学生进度 overlay 到教材结构，返回可直接渲染的章节/小节树。
        服务端以 JWT 中的 studentId 为信任源（URL 段仅作资源定位，须与登录身份一致，
        否则返回 code 1003）；教材版本按学科 + 学生学段（grade_band）解析；
        学期按 progress.current_semester_id 选择，无进度记录时回退到该年级 sort_order
        最小的学期（上册）。
      operationId: getStarMap
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
        - name: subjectId
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 星图数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StarMapData'
  /progress/update:
    post:
      tags: [Progress]
      summary: 更新学习进度
      description: >-
        学生翻页时上报当前卡片位置，服务端据此更新进度。遇到 practice 卡片时
        next_unlock_type 自动切换为 'practice'；到达最后一页时自动推进到下一课
        或标记学科完成。复习（往前翻页）不会回退进度。
      operationId: updateProgress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectId, lessonId, cardSortOrder]
              properties:
                subjectId:
                  type: integer
                  description: 学科 ID
                lessonId:
                  type: integer
                  description: 当前课程 ID
                cardSortOrder:
                  type: integer
                  description: 当前卡片的 sort_order
      responses:
        '200':
          description: 更新结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          advanced:
                            type: boolean
                            description: 是否已推进到下一课/完成
                          nextLessonId:
                            type: integer
                            description: 推进后的下一课 ID
                          completed:
                            type: boolean
                            description: 是否已完成全部课程
                          nextUnlockType:
                            type: string
                            description: 当前解锁阶段（lesson / practice）
                          reason:
                            type: string
                            description: 未推进原因（reviewing / not_current_lesson）
                          currentLessonId:
                            type: integer
                            description: 当前进度中的课程 ID（当 reason=not_current_lesson 时返回，供前端定位下一课）

  # Content
  /content/subjects:
    get:
      tags: [Content]
      summary: 学科列表
      operationId: listSubjects
      responses:
        '200':
          description: 学科列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Subject'
  /content/versions:
    get:
      tags: [Content]
      summary: 教材版本列表
      operationId: listVersions
      parameters:
        - name: subjectId
          in: query
          schema:
            type: string
        - name: gradeBand
          in: query
          schema:
            type: string
            enum: [primary, junior, senior]
      responses:
        '200':
          description: 版本列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TextbookVersion'
  /content/subjects/{subjectId}:
    get:
      tags: [Content]
      summary: 学科详情
      operationId: getSubject
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 学科详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Subject'
  /content/versions/{versionId}:
    get:
      tags: [Content]
      summary: 版本详情
      operationId: getVersion
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 版本详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TextbookVersion'
  /content/versions/{versionId}/units:
    get:
      tags: [Content]
      summary: 单元列表
      operationId: listUnits
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 单元列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Unit'
  /content/versions/{versionId}/units/{unitId}:
    get:
      tags: [Content]
      summary: 单元详情
      operationId: getUnit
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
        - name: unitId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 单元详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Unit'
  /content/versions/{versionId}/units/{unitId}/lessons:
    get:
      tags: [Content]
      summary: 课列表
      operationId: listLessons
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
        - name: unitId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 课列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Lesson'
  /content/versions/{versionId}/units/{unitId}/lessons/{lessonId}:
    get:
      tags: [Content]
      summary: 课详情
      operationId: getLesson
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
        - name: unitId
          in: path
          required: true
          schema:
            type: string
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 课详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Lesson'
  /content/versions/{versionId}/units/{unitId}/lessons/{lessonId}/cards:
    get:
      tags: [Content]
      summary: 教材卡片列表
      operationId: listCards
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
        - name: unitId
          in: path
          required: true
          schema:
            type: string
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 卡片列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Card'
  /content/cards/{cardId}:
    get:
      tags: [Content]
      summary: 单张卡片
      operationId: getCard
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 卡片详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Card'
  /content/knowledge-points:
    get:
      tags: [Content]
      summary: 知识点查询
      operationId: listKnowledgePoints
      parameters:
        - name: subjectId
          in: query
          schema:
            type: string
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 知识点列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/KnowledgePoint'
  /content/knowledge-points/{knowledgePointId}:
    get:
      tags: [Content]
      summary: 知识点详情
      operationId: getKnowledgePoint
      parameters:
        - name: knowledgePointId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 知识点详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/KnowledgePoint'
  /content/questions:
    get:
      tags: [Content]
      summary: 题库查询
      operationId: listQuestions
      parameters:
        - name: knowledgePointId
          in: query
          schema:
            type: string
        - name: difficulty
          in: query
          schema:
            type: string
            enum: [easy, medium, hard]
        - name: type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 题目列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Question'
  /content/questions/{questionId}:
    get:
      tags: [Content]
      summary: 题目详情
      operationId: getQuestion
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 题目详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Question'

  # Knowledge Graph
  /knowledge-graph/knowledge-points/{id}/relations:
    get:
      tags: [KnowledgeGraph]
      summary: 知识点关系
      operationId: getKnowledgeRelations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 关系列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/KnowledgeRelation'
  /knowledge-graph/students/{studentId}/mastery:
    get:
      tags: [KnowledgeGraph]
      summary: 掌握度 overlay
      operationId: getMastery
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 掌握度数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/KnowledgeMastery'
  /knowledge-graph/students/{studentId}/weak-points:
    get:
      tags: [KnowledgeGraph]
      summary: 薄弱点
      operationId: getWeakPoints
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 薄弱点列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WeakPoint'

  # Assessment
  /assessment/students/{studentId}/homework:
    get:
      tags: [Assessment]
      summary: 待做作业列表
      operationId: listHomework
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 作业列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Homework'
  /assessment/homework/{homeworkId}:
    get:
      tags: [Assessment]
      summary: 作业详情
      operationId: getHomework
      parameters:
        - name: homeworkId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 作业详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HomeworkDetail'
  /assessment/homework/{homeworkId}/submissions:
    post:
      tags: [Assessment]
      summary: 开始作业
      operationId: startHomework
      parameters:
        - name: homeworkId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 提交记录创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
