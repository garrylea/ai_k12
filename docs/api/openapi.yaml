  /points/me/rules:
    get:
      tags: [Points]
      summary: 各任务档位与分值（档位即可选项数据源）
      description: >-
        学生端开练的「档位即可选项」数据源（前端不再硬编码题量）。**只回已启用
        档位**——下架档恰好也是 start 端点不认的值，选了会被 400；家长端才看得到
        全部档。dailyLimit == null 表示不限，此时 remainingToday 也为 null；
        isActive 恒为 true（便于与家长端响应对照调试）。
      operationId: getMyPointRules
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 按任务分组的规则
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GroupedPointRules'

  /points/me/rewards:
    get:
      tags: [Points]
      summary: 奖励清单（学生端只读）
      description: >-
        只含已上架奖励，逐项标注 affordable（余额够不够）/ levelOk（段位够不够）/
        gap（还差多少分）。学生只能看，兑换在家长端。
      operationId: getMyRewards
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 奖励清单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StudentRewards'

  /parent/students/{studentId}/points:
    get:
      tags: [ParentPoints]
      summary: 孩子积分概览（家长端）
      description: 复用学生端同款 getOverview（段位/进度单一真源）。归属校验失败 1005/403。
      operationId: getStudentPoints
      security: [{ bearerAuth: [] }]
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
          description: 学生 id
      responses:
        '200':
          description: 积分概览
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PointsOverview'
        '403':
          description: 非本人名下学生（code=1005）

  /parent/students/{studentId}/points/rules:
    get:
      tags: [ParentPoints]
      summary: 孩子分值与档位规则（家长端）
      description: >-
        按任务分组的**全部**规则（含下架档位——家长要能看到并重新启用）。
        响应形状同 /points/me/rules，但不滤掉 isActive=false 的档。
      operationId: getStudentPointRules
      security: [{ bearerAuth: [] }]
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 按任务分组的全部规则
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GroupedPointRules'
    put:
      tags: [ParentPoints]
      summary: 批量保存分值/上限/启用状态
      description: >-
        一个事务，要么全成要么全不成。三个可改字段全必填；points 须 0-9999、
        dailyLimit 须 null 或 1-99（0 会让该档位永久不发分，拒绝；「不限」只能用
        null 表达）。某条 (taskCode, tierKey) 查不到 → 3005 并回滚整批。
      operationId: saveStudentPointRules
      security: [{ bearerAuth: [] }]
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePointRulesRequest'
      responses:
        '200':
          description: 保存成功（data 为 null）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommonResponse' }
        '400':
          description: 入参非法（code=1001）或档位不存在（code=3005）

  /parent/students/{studentId}/points/ledger:
    get:
      tags: [ParentPoints]
      summary: 孩子流水分页（家长端）
      description: 与学生端同口径（默认 page=1、pageSize=20，上限 100，越界 400，共用 pagination.util.ts）。
      operationId: getStudentPointsLedger
      security: [{ bearerAuth: [] }]
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: 流水分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PointLedgerPage'
        '400':
          description: page / pageSize 非法（code=1001）

  /parent/students/{studentId}/reward-catalog:
    get:
      tags: [ParentPoints]
      summary: 奖励清单（家长端，含已下架行）
      description: >-
        含已下架行——返回软删行是为了让前端整表 PUT 时原样带回 isActive，
        否则「没带这个字段」会把已下架奖励静默重新上架。
      operationId: getRewardCatalog
      security: [{ bearerAuth: [] }]
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 奖励清单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/RewardCatalogItem'
    put:
      tags: [ParentPoints]
      summary: 整表保存奖励清单
      description: >-
        无 id 新增、有 id 整行覆盖、payload 里消失的 id 软删（is_active=0），
        一个事务；空数组是合法语义（整表清空）。返回保存后的完整清单。
        isActive 必填（缺省会被服务层当 true，静默重新上架）。
      operationId: saveRewardCatalog
      security: [{ bearerAuth: [] }]
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveRewardCatalogRequest'
      responses:
        '200':
          description: 保存后的完整清单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/RewardCatalogItem'
        '400':
          description: 入参非法（code=1001），整批回滚不留半套清单

  /parent/students/{studentId}/points/redeem:
    post:
      tags: [ParentPoints]
      summary: 兑换积分（换钱 / 换奖励）
      description: >-
        **201**（Nest @Post 默认）。方向是「积分 → 钱」：家长输入要花掉的积分数，
        金额由服务端按 cashAmount = round(points / pointsPerYuan, 2) 推导
        （pointsPerYuan 默认 20，即 20 积分 = 1 元、家长可配）。同事务写兑换单 +
        负流水 + 条件扣余额；只动 balance、不动 totalEarned（段位只升不降）。
        拒绝码：3001 余额不足（含事务内条件扣减的权威判定）/ 3002 未达段位门槛 /
        3003 奖励已下架 / 3004 兑换已关闭；奖励不存在 1002。
      operationId: redeemPoints
      security: [{ bearerAuth: [] }]
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
      responses:
        '201':
          description: 兑换成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RedeemResult'
        '400':
          description: 余额不足 3001 / 未达段位 3002 / 奖励已下架 3003 / 兑换已关闭 3004
        '404':
          description: 奖励不存在（code=1002）

  /parent/students/{studentId}/redemptions:
    get:
      tags: [ParentPoints]
      summary: 兑换记录分页
      description: >-
        page 从 1 起；越界/非正整数 400（code=1001，不静默钳制）。响应里的 pageSize
        恒为服务端默认 20——该端点**不接收** pageSize，它只是响应字段。
      operationId: listRedemptions
      security: [{ bearerAuth: [] }]
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 兑换记录分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RedemptionList'
        '400':
          description: page 非法（code=1001）

  /parent/redemptions/{id}:
    patch:
      tags: [ParentPoints]
      summary: 修改兑换单状态（pending ⇄ fulfilled）
      description: >-
        只改状态/时间，**不动积分**——本期兑换不可撤销。路径里没有 studentId：
        先按 id 反查该单的 student_id 再做归属校验；不存在 → 404 1002。
      operationId: patchRedemption
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 兑换单 id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchRedemptionRequest'
      responses:
        '200':
          description: 状态已更新（data 为 null）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommonResponse' }
        '404':
          description: 兑换单不存在（code=1002）

  /parent/students/{studentId}/points/settings:
    get:
      tags: [ParentPoints]
      summary: 兑换设置（汇率 / 开关）
      description: 读 controls（缺行先懒初始化补默认行）。与 points/rules 刻意分开：汇率和分值是两个关注点。
      operationId: getPointsSettings
      security: [{ bearerAuth: [] }]
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 兑换设置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PointsSettings'
    put:
      tags: [ParentPoints]
      summary: 更新兑换设置（部分更新）
      description: 至少给一个字段（空 patch 是假成功，400）；pointsPerYuan 须 1-9999 整数。返回更新后的全量。
      operationId: savePointsSettings
      security: [{ bearerAuth: [] }]
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePointsSettingsRequest'
      responses:
        '200':
          description: 更新后的设置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PointsSettings'
        '400':
          description: 一个字段都没给（code=1001）

  /training/sessions/{id}/complete:
    post:
      tags: [Training]
      summary: 训练会话完成发分（乙类整批发分）
      description: >-
        **201**。只 math_targeted / en_vocabulary 用（档位打包价，整轮结束才发一次）。
        分值取会话里记录的档位、不取前端入参（乙类唯一的防伪造点）。幂等：重复调用回
        reason='already_completed' + pointsAwarded=0，不报错。发分失败可恢复：
        award 抛错（DB 故障）时不把会话置 completed，回 balance/totalEarned=null +
        reason='award_failed'（真实余额不是 0，回 0 会污染前端快照），会话留在
        in_progress，下次 complete 用同一幂等键 tsess/vsess:<sessionId> 补发且只补一次。
      operationId: completeTrainingSession
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 训练会话 id
      responses:
        '201':
          description: 发分结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CompleteSessionResult'
        '404':
          description: 训练会话不存在或非本人（code=1002）

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CommonResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
      required: [code, message]

    StarMapData:
      type: object
      description: 星图渲染数据（章节=单元，小节=课）
      properties:
        subjectName:
          type: string
        gradeName:
          type: string
          description: 当前学期名称，如「九年级下册」
        publisher:
          type: string
        totalUnits:
          type: integer
        completedUnits:
          type: integer
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/StarMapChapter'
      required: [subjectName, gradeName, totalUnits, completedUnits, chapters]

    StarMapChapter:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        order:
          type: integer
        importance:
          type: string
          enum: [large, medium, small]
        status:
          type: string
          enum: [completed, current, locked]
        progress:
          type: integer
          description: 0-100
        sections:
          type: array
          items:
            $ref: '#/components/schemas/StarMapSection'
      required: [id, title, order, importance, status, progress, sections]

    StarMapSection:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        order:
          type: integer
        knowledgePointCount:
          type: integer
        status:
          type: string
          enum: [completed, current, locked]
        progress:
          type: integer
          description: 0-100
      required: [id, title, order, knowledgePointCount, status, progress]

    TokenResponse:
      allOf:
        - $ref: '#/components/schemas/CommonResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string
                user:
                  $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
          enum: [admin, parent, student]
        name:
          type: string
        phone:
          type: string
        username:
          type: string
          description: 仅管理员/学生返回（家长用 phone）
        grade:
          type: string
          description: 仅学生返回
        parentId:
          type: integer
          description: 仅学生返回（归属家长 id，用于归属校验）

    CreateStudentAccountRequest:
      type: object
      properties:
        name:
          type: string
        username:
          type: string
          description: 仅限字母/数字/下划线，全局唯一
        password:
          type: string
          description: 6-32 位初始密码
        age:
          type: integer
          minimum: 3
          maximum: 18
        grade:
          type: string
          description: 全学段年级（如 小学三年级/初二/高三）
      required: [name, username, password, age, grade]

    ResetStudentPasswordRequest:
      type: object
      properties:
        newPassword:
          type: string
          minLength: 6
          maxLength: 32
      required: [newPassword]

    SetStudentStatusRequest:
      type: object
      properties:
        isActive:
          type: boolean
      required: [isActive]

    SubjectConfigVersionOption:
      type: object
      description: 某年级下可选的教材版本（`options[].grades[].versions[]`）。
      properties:
        id:
          type: integer
        name:
          type: string
        publisher:
          type: string
          nullable: true
        edition:
          type: string
        gradeBand:
          type: string
          description: 学段（`primary` / `junior` / `senior`）。
        terms:
          type: array
          description: 该版本在该年级下实际存在的册别。
          items:
            type: string
            enum: [first, second]

    SubjectConfigGradeOption:
      type: object
      properties:
        code:
          type: string
          description: 年级码（如 `grade7`）。
        label:
          type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/SubjectConfigVersionOption'

    SubjectConfigOption:
      type: object
      description: 某学科的可选项（只含**有教材数据**的年级；无数据学科整体不出现）。
      properties:
        subjectId:
          type: integer
        subjectName:
          type: string
        grades:
          type: array
          items:
            $ref: '#/components/schemas/SubjectConfigGradeOption'

    SubjectConfigState:
      type: object
      description: >-
        某学科的当前配置。`configured=false` = 库中无 `progress` 行，此时 `gradeCode`/`term`/
        `textbookVersionId`/`publisher` 是**按学生年级推导的默认值、不落库**（`options` 里没有对应
        年级时可能为 `null`）。`started=true` = 已开始学习（`progress.status <> 'not_started'`
        或已有 `currentLessonId`）—— 只有 `started` 且版本/册别变化才会 `reset`。
      properties:
        subjectId:
          type: integer
        subjectName:
          type: string
        configured:
          type: boolean
        started:
          type: boolean
        gradeCode:
          type: string
          nullable: true
        term:
          type: string
          nullable: true
          enum: [first, second]
        textbookVersionId:
          type: integer
          nullable: true
        publisher:
          type: string
          nullable: true
        edition:
          type: string

    SubjectConfigsResponse:
      type: object
      properties:
        studentId:
          type: integer
        studentName:
          type: string
          nullable: true
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/SubjectConfigState'
        options:
          type: array
          items:
            $ref: '#/components/schemas/SubjectConfigOption'

    SubjectConfigUpdateRequest:
      type: object
      required: [gradeCode, term]
      properties:
        gradeCode:
          type: string
          minLength: 1
          maxLength: 20
        term:
          type: string
          enum: [first, second]
        textbookVersionId:
          type: integer
          description: 缺省按默认规则选（同学段 `edition` 非空优先、`id` 大者优先）。

    SubjectConfigUpdateResult:
      type: object
      properties:
        subjectId:
          type: integer
        textbookVersionId:
          type: integer
        semesterId:
          type: integer
        reset:
          type: boolean
          description: >-
            该学科学习状态是否被重置。仅当**已开始学习**且版本或册别发生变化时为 `true`
            （错题/作业记录保留在库，不再展示、不阻塞清零门禁）。

    StudentAccountListResponse:
      allOf:
        - $ref: '#/components/schemas/CommonResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/StudentAccount'
    StudentAccount:
      type: object
      properties:
        id:
          type: integer
        parentId:
          type: integer
        username:
          type: string
        name:
          type: string
        age:
          type: integer
          nullable: true
        grade:
          type: string
          nullable: true
        schoolLevel:
          type: string
          nullable: true
        isActive:
          type: boolean

    AdminModelItem:
      type: object
      properties:
        modelKey: { type: string }
        name: { type: string }
        providerType: { type: string }
        modelId: { type: string }
        baseUrl: { type: string }
        apiKeyMasked: { type: string }
        contextWindow: { type: integer }
        maxOutputTokens: { type: integer }
        isEnabled: { type: boolean }
    AdminModelItemList:
      allOf:
        - $ref: '#/components/schemas/CommonResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AdminModelItem'
    AdminModelCreateRequest:
      type: object
      properties:
        modelKey: { type: string }
        name: { type: string }
        providerType: { type: string, enum: [kimi, qwen, deepseek, gemini, openai_compatible] }
        modelId: { type: string }
        baseUrl: { type: string }
        apiKey: { type: string }
        contextWindow: { type: integer }
        maxOutputTokens: { type: integer }
      required: [modelKey, name, providerType, modelId, baseUrl, apiKey]
    AdminModelUpdateRequest:
      type: object
      properties:
        name: { type: string }
        providerType: { type: string }
        modelId: { type: string }
        baseUrl: { type: string }
        apiKey: { type: string, description: 留空=不修改 }
    AdminRouteItem:
      type: object
      properties:
        scene: { type: string }
        subject: { type: string }
        primaryModelKey: { type: string }
        fallbackModelKey: { type: string, nullable: true }
    AdminRoutesList:
      allOf:
        - $ref: '#/components/schemas/CommonResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                routes:
                  type: array
                  items:
                    $ref: '#/components/schemas/AdminRouteItem'
                scenes:
                  type: array
                  items: { type: string }
                providerTypes:
                  type: array
                  items: { type: string }
    AdminMessageSendRequest:
      type: object
      properties:
        type: { type: string, enum: [promo, learning, system] }
        title: { type: string }
        content: { type: string }
        parentId: { type: integer, description: 缺省=全员广播 }
      required: [type, title, content]

    # 预警数据保留期（阈值固定 30 天常量，接口不带参数）
    AdminExpiredAlertPreview:
      allOf:
        - $ref: '#/components/schemas/CommonResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                retentionDays: { type: integer, description: 固定 30 }
                cutoff: { type: string, format: date-time, description: created_at 早于此值的预警会被清理 }
