      type: object
      description: 两字段**均可选**，但**至少给一个**（都缺 → 409/1001）。未提供的字段不动。
      properties:
        alertAwayMinutes:
          type: integer
          minimum: 1
          maximum: 180
        alertIdleMinutes:
          type: integer
          minimum: 1
          maximum: 180

    Alert:
      type: object
      description: >-
        一条家长端异常预警（`safety_alerts` 的展示投影，P6.9，2026-09-20 实现）。
        ⚠️ **「建议家长行动」不入库**，由前端按 `type` 静态映射（为一段展示文案改表不划算）。
      properties:
        id:
          type: integer
        studentId:
          type: integer
        studentName:
          type: string
          nullable: true
          description: join `students` 得到；两个 FK 都是 `ON DELETE CASCADE`，理论上取不到，前端兜底「未知学生」。
        type:
          type: string
          description: 以代码为准（`database/repositories/types.ts` 的 `SafetyAlertRow['type']`）。`abusive` 保留（`pickGentleBlockMessage` 仍映射它）。
          enum: [off_topic, emotional, sensitive, abusive, away, idle]
        level:
          type: string
          enum: [info, warning, critical]
        message:
          type: string
        context:
          type: string
          nullable: true
        dialogueId:
          type: integer
          nullable: true
          description: 闲聊类预警带对话 id（可跳回放）；其余为 null。
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ParentAlertPage:
      type: object
      description: 预警列表分页壳（同 `ParentErrorPage`，但 `pageSize` 由前端传、默认 20、上限 50）。
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        page:
          type: integer
        pageSize:
          type: integer
