        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectConfigUpdateRequest'
      responses:
        '200':
          description: 写入结果（`reset` 表示该学科学习状态是否被重置）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SubjectConfigUpdateResult'
