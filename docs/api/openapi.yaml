      tags: [Parent]
      summary: 单条对话详情
      description: >-
        逐句回放，含 `reasoning`（AI 思考链，前端默认折叠）。不回传
        `token_input` / `token_output` / `response_time_ms`（那三列全仓恒 NULL）。
        `dialogueId` 不属于该学生 → 404 / 1002（二次归属校验）。
      operationId: getChatLog
      parameters:
