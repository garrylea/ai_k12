      description: >-
        行为管控 P6.6 —— **预警灵敏度**（2026-09-20 实现，以代码为准）。
        ⚠️ 只含两个阈值：兑换汇率/开关归 `points/settings`（同一字段两个归属会打架）；
        每日最大使用时长 / 禁用时段 / 辅线访问开关 / 拍照解题开关按用户 2026-09-20 裁决
        **本批不做**，`controls` 表里那几列（`daily_time_limit_minutes` / `disabled_hours` /
        `alert_level` / `auxiliary_enabled` / `photo_search_enabled`）**保留待用**。
      properties:
        alertAwayMinutes:
          type: integer
          minimum: 1
          maximum: 180
          description: 孩子切走页面连续多少分钟算「离开」（默认 5）。
        alertIdleMinutes:
          type: integer
          minimum: 1
          maximum: 180
          description: >-
            孩子前台无操作连续多少分钟算「走神」（默认 15）。**字面语义**（2026-09-20「及时可见」批改：
            服务端把前端写死的 120 秒检测窗口补回 `hidden_since`，故家长设 5 分钟就在第 5 分钟报，
            文案也写 5 分钟；改前是「两者相加」、设 5 实际约 7 分钟）。⚠️ **已知边界**：阈值 ≤ 2 分钟时
            实际生效值约为 2 分钟（检测窗口即下限，页面允许最小 1 分钟，不加 UI 限制）。

