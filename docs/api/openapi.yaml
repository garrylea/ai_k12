                      data:
                        type: object
                        nullable: true
        '400':
          description: 参数错误（cardId/lessonId 同传或都缺）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1001
                  message:
                    type: string
                    example: 须指定 cardId 或 lessonId

  /practice/uncleared-errors:
    get:
      tags: [Practice]
      summary: 查询学生某学科所有未清零课堂练习错题
      description: >-
        用于「错题清零」门禁：进每节课前清空错题本里 source='practice' + is_cleared=0
        的未清题（兜住历史/跳过/写入失败的错题）。以 main_error_books 为唯一真相源，
        LEFT JOIN questions 补全题面，不再依赖 practice_results。同一 (cardId, questionN)
        的重复记录去重保留最早一条。计数 = errors.length，前端据此渲染阶段栏与清零界面。
        传 lessonId 时只返回「当前课之前」的错题（lesson_id < lessonId，星图同款 id
        数值序）：本课练习刚产生的错题不触发清零门禁，留待进入下一课时再清；
        不传则不限课时。lesson_id 为 null 的孤儿历史行保守保留。
      operationId: getUnclearedErrors
      security: [{ bearerAuth: [] }]
      parameters:
        - name: subjectId
          in: query
          required: true
          schema:
            type: integer
          description: 学科 id
        - name: lessonId
          in: query
          required: false
          schema:
            type: integer
          description: 当前课 id。传入时只返回该课之前（lesson_id < lessonId）的未清错题；
            本课及后续课的错题不触发清零门禁。省略时返回全部未清错题。
      responses:
        '200':
          description: 未清零错题列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UnclearedErrorsResult'

  /practice/bump-error-levels:
    post:
      tags: [Practice]
      summary: 批量递增错题严重程度
      description: >-
        错题清零后仍有错误的题，level + 1 标记未掌握。请求体为 main_error_books.id 列表。
      operationId: bumpErrorLevels
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BumpErrorLevelsRequest'
      responses:
        '200':
          description: 已递增
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        nullable: true

  # Training
  /training/error-book:
    get:
      tags: [Training]
      summary: 错题练习筛选列表
      description: >-
        训练模块错题列表（student JWT，@Roles('student')）。只返回未清零（is_cleared=0）
        的 main_error_books 记录；from/to 按 created_at 过滤（to 含当天，即 < to+1day）；
        type 过滤走 questions.type；kpId 过滤走 EXISTS question_knowledge_points。
        同一错题挂多 KP 时按 errorBookId 聚合 kpIds 数组。
      operationId: getTrainingErrorBook
      security: [{ bearerAuth: [] }]
      parameters:
        - name: subjectId
          in: query
          required: true
          schema:
            type: integer
          description: 学科 id（必填，非整数 400）
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: 起始日期（含），按 created_at 过滤
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: 截止日期（含当天，服务端按 < to+1day 处理）
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: 题型过滤（choice/fill_blank/true_false/short_answer/proof）
        - name: kpId
          in: query
          required: false
          schema:
            type: integer
          description: 知识点 id（专项筛选）；传非数字 400
      responses:
        '200':
          description: 错题列表（未清零，多 KP 已聚合）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TrainingErrorBookEntry'

  /training/questions/explanations:
    get:
      tags: [Training]
      summary: 批量拉取题目解析（结果页末题后）
      description: >-
        按题目 id 批量取 questions.explanation（student JWT）。ids 为逗号分隔的
        questionId 列表；DB 已有直返；解析仍在后台生成中（判错触发的 in-flight）
        则等待其完成（总超时 60s 兜底）；既无解析也无在途生成（从未触发或曾失败）
        返回 null——不触发新生成。解析为题级公开数据（不分学生）。
      operationId: getTrainingExplanations
      security: [{ bearerAuth: [] }]
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: string
          description: 逗号分隔的 questionId 列表（如 ids=1,2,3）
      responses:
        '200':
          description: 解析映射
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: '{ questionId: 解析文本或 null }'

  /training/questions/{questionId}/explanation-wait:
    get:
      tags: [Training]
      summary: 单题刷新等待解析（120s 倒计时）
      description: >-
        结果页「解析生成中」的刷新入口（student JWT）。DB 已有直返；在途生成
        等待；无在途且无解析（曾失败）则重新触发生成再等待，上限 120s。
        题目不存在/停用返回 null（不触发生成）。超时或失败返回 null 并写
        admin_notifications（type=explanation_failed，同题未读去重），管理员
        需人工补题解。
      operationId: waitTrainingExplanation
      security: [{ bearerAuth: [] }]
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 解析文本或 null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          explanation:
                            type: string
                            nullable: true

  /training/judge:
    post:
      tags: [Training]
      summary: 训练判题（题中心变体，JudgeCore 复用）
      description: >-
        错题练习/专项练习逐题判分（student JWT）。source 枚举 targeted|error_practice
        （错题练习/专项练习来源，非法值 400，不透传客户端任意值）。三路由镜像
        /practice/judge：(1) choice/true_false + fill_blank 归一化相等 -> exact 比对；
        (2) fill_blank 不等 / short_answer / proof -> AI JudgmentCapability 判定；
        (3) 答错 -> find-or-create 写 main_error_books（source 落库为训练来源）；
        答对 -> 清零该题所有未清记录（不限 source）。判错同时后台异步生成解析
        入 questions.explanation（ExplanationCacheService，不阻塞判题响应，详见
        /training/questions/explanations）。训练题必来自题库（无「未命中
        AI + 结构化入库」分支）：题目不存在 400（code=4004）；AI 判定失败 503
        （code=5001，不写错题本）。
      operationId: judgeTraining
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingJudgeRequest'
      responses:
        '200':
          description: 判定结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/JudgeResult'
        '400':
          description: source 非法或题目不存在（code=4004）
        '503':
          description: AI 判定失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 5001
                  message:
                    type: string
                    example: 判定失败，请重试

  /training/self-assess:
    post:
      tags: [Training]
      summary: 主观题学生自评（self_assess 模式）
      description: >-
        主观题学生对照参考答案自评对错（student JWT）。请求体：
        {questionId, subjectId, assessment, source, sourceRefId?}；
        assessment 枚举 correct|incorrect；source 枚举
        targeted|error_practice|exam（非法值 400）；sourceRefId 仅
        source='exam' 时传 sessionId，其余来源不传。每次自评写入
        question_self_assessments 留痕；incorrect 写入/复用
        main_error_books（source 落库为训练/考试来源）并触发解析缓存兜底生成；
        correct 清零该题所有未清记录。题目不存在 404。
      operationId: selfAssessTraining
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingSelfAssessRequest'
      responses:
        '200':
          description: 自评结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          errorBookId:
                            type: integer
                            nullable: true
                            description: incorrect 时返回写入/复用的错题本 id；correct 清零时省略该键（缺键按 null 理解）
        '400':
          description: source/assessment 非法或 questionId/subjectId 非正整数
        '404':
          description: 题目不存在

  /training/bump-error-levels:
    post:
      tags: [Training]
      summary: 批量递增错题严重程度（训练）
      description: >-
        错题重做仍答错时 level + 1 标记未掌握（镜像 /practice/bump-error-levels）。
        请求体为 main_error_books.id 列表。
      operationId: bumpTrainingErrorLevels
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BumpErrorLevelsRequest'
      responses:
        '200':
          description: 已递增
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        nullable: true

  /training/hint:
    post:
      tags: [Training]
      summary: 训练提示（AI 生成 + 题级缓存）
      description: >-
        训练答题前点「提示」调用（student JWT）。与 /practice/hint 的 Card 级缓存
        不同，这里走题级 question_hints 表缓存（题级共享，不分学生）：命中直返
        （不调 AI）；未命中调 HintCapability 生成苏格拉底式提示（只启发不给答案）
        并写回缓存（写回失败不阻断返回）。题目不存在 404；AI 生成失败 503
        （code=5001）。
      operationId: getTrainingHint
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingHintRequest'
      responses:
        '200':
          description: 提示内容
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TrainingHintResult'
        '404':
          description: 题目不存在
        '503':
          description: AI 提示生成失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 5001
                  message:
                    type: string
                    example: 提示生成失败，请重试

  /training/knowledge-points:
    get:
      tags: [Training]
      summary: 专项练习知识点平铺列表
      description: >-
        专项练习配置页的知识点数据（student JWT）。返回平铺列表，树形组装放前端
        （按 parentKpId 自行组树）。
      operationId: getTrainingKnowledgePoints
      security: [{ bearerAuth: [] }]
      parameters:
        - name: subjectId
          in: query
          required: true
          schema:
            type: integer
          description: 学科 id
      responses:
        '200':
          description: 知识点平铺列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TrainingKnowledgePoint'

  /training/targeted/start:
    post:
      tags: [Training]
      summary: 专项练习开练（按学科 + 知识点随机抽题）
      description: >-
        专项练习配置完成后开练（student JWT）。count 限 1-20 整数（越界/非整数 400）；
        type 白名单 choice|fill_blank|true_false|short_answer|proof 或 null（不限题型，
        非法 400）。题单白名单序列化：只出 questionId/text/type/options，
        answer/explanation 等字段一律剥离（防答案泄露）；options 为 JSON 字符串
        parse 后的数组（无/坏 JSON 为 null）。抽不到题返回空数组（空集合非错误，
        前端判空显示提示）。选题时基于 JWT user.sub（studentId）排除该生已标记的
        「不再展示」题（LEFT JOIN student_hidden_questions ... IS NULL），
        请求体不变；题池排除后为空时返回 { questions: [] }。
      operationId: startTargetedPractice
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetedStartRequest'
      responses:
        '200':
          description: 随机题单（可能为空数组）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TargetedStartResult'
        '400':
          description: count 越界或 type 非法

  # 语文古诗文默写（2026-09-13）
  /training/dictation/passages:
    get:
      tags: [Training]
      summary: 语文默写篇目清单（配置页用）
      description: >-
        语文默写配置页的篇目数据（student JWT）。仅返回 chinese_passages 中
        verified=1 且 memorize_required=1 且 is_active=1 的篇目（三道闸门：
        verified 是内容已校验，memorize_required 是教学上要求背诵，is_active
        是停用开关），按 sort_order, id 排序。只出篇名 + 册次——作者/朝代/正文
        是学生要作答的三个判题字段，一律不下发（防答案泄露）。
      operationId: listDictationPassages
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 已校验篇目清单（只含篇名与册次）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DictationPassageListResult'

  /training/dictation/start:
    post:
      tags: [Training]
      summary: 语文默写开练（按册次随机抽题或按指定篇目出题）
      description: >-
        语文默写开练（student JWT）。count 限 1-20 整数（越界/非整数 400）；
        semester 限 上册|下册|null（null=全部册次，非法 400）；passageIds 为正整数
        数组或 null——非空时按指定篇目出题（忽略 semester，仅保留抽题池内篇目），
        否则按册次随机抽题。两条路径都**只从抽题池取题**：verified=1 且
        memorize_required=1 且 is_active=1（三道闸门）；「全部册次」随机抽时按
        篇名去重（九上/九下有 9 篇重复收录，跨册取 MIN(id)）。题面由篇名服务端
        生成（请默写《X》，不落库）。题项白名单序列化：只出
        passageId/prompt/workTitle/semester，author/dynasty/正文一律剥离
        （防答案泄露，与 targeted/start 同规矩）。题池为空返回 { questions: [] }。
      operationId: startDictation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DictationStartRequest'
      responses:
        '200':
          description: 默写题单（可能为空数组）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DictationStartResult'
        '400':
          description: count 越界、semester 非法或 passageIds 非法

  /training/dictation/judge:
    post:
      tags: [Training]
      summary: 语文默写判题（纯程序化判对错，不等 LLM，不写任何学生状态）
      description: >-
        语文默写判题（student JWT）。判对错**纯程序化，不调用 LLM**：三字段各自
        normalizeChineseAnswer（NFKC 全半角归一 → 去空白 → 去中英文标点 → 小写）后
        全等，三项全对才 isCorrect=true（故正文带不带标点/空格/全半角不影响判定）。
        正文不等时由 diffChineseInOriginalText（LCS 逐字差异 + 原文标点回投）定位，
        相邻「漏写+多写」合并为一个 wrong（写错字）、连续同类项合并成段；
        判对错口径仍忽略标点，但 bodyDiff 的展示文本带原文标点（学生要能读成句）。
        passageId 须正整数（非法 400），篇目不存在 404。
        **不入错题本、不清零**（2026-09-15 独立化：古诗文专项是独立子系统，
        PRD §6.3 / §7.4 例外——判题不写任何学生状态）。
        **错因文案与判题解耦（2026-09-14）**：本端点只回判题结果（~25ms），
        答错时 feedbackPending=true，错因由 POST /training/dictation/feedback 另取。
        解耦前错因 LLM 在关键路径上（本地思考模型 13–16s），学生会以为卡死。
      operationId: judgeDictation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DictationJudgeRequest'
      responses:
        '200':
          description: 判题结果（程序化差异定位；错因待前端另取）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DictationJudgeResult'
        '400':
          description: passageId 非法
        '404':
          description: 默写篇目不存在

  /training/dictation/feedback:
    post:
      tags: [Training]
      summary: 语文默写错因文案（LLM 可选，与判题解耦）
      description: >-
        语文默写错因文案（student JWT）。判题端点判错后由前端单独调用；
        服务端按入参重算差异（纯函数，**只读篇目、只算差异，不写任何学生状态**）后
        喂给 dictation_feedback 场景（primary=local 本地 llama.cpp、fallback=deepseek-flash）。
        本地端点靠 chat_template_kwargs 关掉 thinking（`thinking: false` 对 llama.cpp
        无效），实测 13–16s → 2s 量级。模型不可达/超时/两个模型都失败一律返回
        feedback=null（HTTP 200，不报错），由前端显示兜底文案。passageId 须正整数
        （非法 400），篇目不存在 404。
      operationId: generateDictationFeedback
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DictationJudgeRequest'
      responses:
        '200':
          description: 错因文案（失败时为 null）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DictationFeedbackResult'
        '400':
          description: passageId 非法
        '404':
          description: 默写篇目不存在

  # 语文古诗文解释（翻译）（2026-09-16）
  /training/interpretation/passages:
    get:
      tags: [Training]
      summary: 语文解释（翻译）篇目清单（配置页「指定篇目」用）
      description: >-
        语文解释专项配置页的篇目数据（student JWT）。抽题池 =
        chinese_passages 中 verified=1 且 is_active=1 且 JSON_LENGTH(sentences) > 0
        ——**不设 memorize_required**（「要背诵」不是「要理解翻译」的必要条件），
        但多一道「内容就绪」闸门（没切过句的篇目点进去没题目）。按 sort_order, id
        排序。只出篇名 + 册次——标准释义/标准译文是判题答案，一律不下发。
      operationId: listInterpretationPassages
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 解释专项篇目清单（只含篇名与册次）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
