      summary: 总览统计（四计数 + 最近注册家长）
      operationId: getAdminDashboard
      responses:
        '200':
          description: OK
  /admin/password:
    patch:
      tags: [Admin]
      summary: 管理员改自己密码
      operationId: changeAdminPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                oldPassword: { type: string }
                newPassword: { type: string }
              required: [oldPassword, newPassword]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'

  # Quota
  /quota/current:
    get:
      tags: [Quota]
      summary: 当前套餐
      operationId: getCurrentQuota
      responses:
        '200':
          description: 套餐信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Quota'

  # Practice
  /practice/judge:
    post:
      tags: [Practice]
      summary: 课堂练习判对错
      description: >-
        学生在 practice 卡片答题后调用。三路由判定：
        (1) 题库命中 + 客观题（choice/true_false/fill_blank）-> exact 答案比对；
        (2) 题库命中主观题（short_answer/proof）或未命中 -> AI JudgmentCapability 判定；
        (3) 答错 -> 写入 main_error_books（未入库的题先经 QuestionStructuringCapability
        结构化后插 questions 表，结构化失败则 question_id=NULL 仅存题面）。
        AI 判定失败返回 503（code=5001，不写错题本，前端可区分处理）。
      operationId: judgePractice
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JudgeRequest'
      responses:
        '200':
          description: 判定结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/JudgeResult'
        '503':
          description: AI 判定失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 5001
                  message:
                    type: string
                    example: 判定失败，请重试

  /practice/self-assess:
    post:
      tags: [Practice]
      summary: 课堂练习主观题自评（self_assess 模式）
      description: >-
        课堂练习主观题学生对照参考答案自评对错（student JWT）。判题时主观题
        因 practice_results.is_correct NOT NULL 推迟落行，此处补写
        practice_results（method='self_assess'）+ 自评留痕
        （question_self_assessments，source='practice'）+ 错题本写入/清零。
        questionId 可为 null（孤儿题：题库未命中仅存题面——留痕跳过、错题本按
        card+题面变体匹配）。assessment=incorrect 写入/复用 main_error_books
        （source 落库为 practice 来源）并触发解析缓存兜底生成；correct 清零
        该题所有未清记录。cardId/lessonId/subjectId 非正整数或
        questionN/questionText 缺失或 assessment 非法 400。
      operationId: selfAssessPractice
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cardId, lessonId, subjectId, questionN, questionText, assessment]
              properties:
                cardId:
                  type: integer
                  description: 当前 practice 卡片 ID
                lessonId:
                  type: integer
                  description: 当前课程 ID
                subjectId:
                  type: integer
                  description: 学科 ID
                questionN:
                  type: string
                  description: 卡内复合题号（如 "0-1"），practice_results upsert 去重键
                questionText:
                  type: string
                  description: 题面原文（孤儿题错题本按 card+题面匹配）
                questionId:
                  type: integer
                  nullable: true
                  description: 题库命中时的 questions.id；未命中为 null
                studentAnswer:
                  type: string
                  description: 学生提交的答案文本（缺省空串）
                assessment:
                  type: string
                  enum: [correct, incorrect]
                  description: correct=学生自评做对；incorrect=学生自评做错
      responses:
        '200':
          description: 自评已落库
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        nullable: true
        '400':
          description: cardId/lessonId/subjectId/questionId 非正整数、questionN/questionText 缺失或 assessment 非法

  /practice/hint:
    post:
      tags: [Practice]
      summary: 课堂练习提示（AI 生成 + Card 级缓存）
      description: >-
        学生在 practice 卡片答题前点「提示」调用。先查 cards.hints 缓存（JSON：
        { "<题目文本>": "<提示文本>" }）命中直返（不调 AI）；未命中则调
        HintCapability 生成苏格拉底式提示（只启发不给答案）并写回 cards.hints，
        供后续复用（Card 级共享，不分学生）。AI 生成失败返回 503（code=5001，
        前端降级显示静态文案，不阻断答题）。
      operationId: getPracticeHint
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HintRequest'
      responses:
        '200':
          description: 提示内容
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HintResult'
        '503':
          description: AI 提示生成失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 5001
                  message:
                    type: string
                    example: 提示生成失败，请重试

  /practice/discuss:
    post:
      tags: [Practice]
      summary: 课堂练习「让 AI 讲一讲」（苏格拉底讨论）
      description: >-
        学生在 practice 卡片答题前点「让 AI 讲一讲」调用。打开讨论即：① 记入主线错题本
        （find-or-create 幂等，source='discuss'，无论后续答对答错都保留）；② 创建带 card_id
        的 mainline 对话并返回 dialogueId。前端据此走 POST /ai/tutor/stream（mode=mainline）
        做苏格拉底式多轮讨论——TutoringCapability 据 card_id 解析 cardContent 限定范围（只能
        讨论该卡片内容，不能聊其它），3 次失败/放弃后兜底给完整解析。questionId 用
        content_hash 快查（不调 AI 结构化），未命中则 question_id=null + wrong_answer_text 存题面。
      operationId: startPracticeDiscuss
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscussRequest'
      responses:
        '200':
          description: 错题本记录 + mainline 对话 dialogueId
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DiscussResult'
        '500':
          description: 创建讨论会话失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 5000
                  message:
                    type: string
                    example: 创建讨论会话失败

  /practice/discuss-card:
    post:
      tags: [Practice]
      summary: 卡片级「思辨答疑」（苏格拉底讨论）
      description: >-
        学生在非 practice 知识卡片上点「思辨答疑」调用。与 `/practice/discuss` 区别：
        scope=整张卡片（非某道题），**不入错题本**（讨论的是知识而非一道题）。
        服务端按 (student, card_id, track='mainline') find-or-create 对话并返回 dialogueId；
        前端据此走 POST /ai/tutor/stream（mode=mainline）做苏格拉底式多轮讨论——
        TutoringCapability 据 card_id 解析 cardContent 限定范围（只能讨论该卡片内容）。
        重开同一卡片的讨论会自动回到同一对话线。
      operationId: startCardDiscuss
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscussCardRequest'
      responses:
        '200':
          description: mainline 对话 dialogueId
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DiscussCardResult'
        '500':
          description: 创建讨论会话失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 5000
                  message:
                    type: string
                    example: 创建讨论会话失败

  /practice/results:
    get:
      tags: [Practice]
      summary: 取该练习卡持久化判题结果（✓/✗ 回显）
      operationId: getPracticeResults
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cardId
          in: query
          required: true
          schema:
            type: integer
          description: practice 卡片 ID
      responses:
        '200':
          description: 该卡全部持久化判题结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PracticeResult'
    delete:
      tags: [Practice]
      summary: 重置练习记录（cardId 单卡 / lessonId 本课全部，互斥）
      operationId: resetPracticeResults
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cardId
          in: query
          required: false
          schema:
            type: integer
        - name: lessonId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        nullable: true
        '400':
          description: 参数错误（cardId/lessonId 同传或都缺）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1001
                  message:
                    type: string
                    example: 须指定 cardId 或 lessonId

  /practice/uncleared-errors:
    get:
      tags: [Practice]
      summary: 查询学生某学科所有未清零课堂练习错题
      description: >-
        用于「错题清零」门禁：进每节课前清空错题本里 source='practice' + is_cleared=0
        的未清题（兜住历史/跳过/写入失败的错题）。以 main_error_books 为唯一真相源，
        LEFT JOIN questions 补全题面，不再依赖 practice_results。同一 (cardId, questionN)
        的重复记录去重保留最早一条。计数 = errors.length，前端据此渲染阶段栏与清零界面。
        传 lessonId 时只返回「当前课之前」的错题（lesson_id < lessonId，星图同款 id
        数值序）：本课练习刚产生的错题不触发清零门禁，留待进入下一课时再清；
        不传则不限课时。lesson_id 为 null 的孤儿历史行保守保留。
      operationId: getUnclearedErrors
      security: [{ bearerAuth: [] }]
      parameters:
        - name: subjectId
          in: query
          required: true
          schema:
            type: integer
          description: 学科 id
        - name: lessonId
          in: query
          required: false
          schema:
            type: integer
          description: 当前课 id。传入时只返回该课之前（lesson_id < lessonId）的未清错题；
            本课及后续课的错题不触发清零门禁。省略时返回全部未清错题。
      responses:
        '200':
          description: 未清零错题列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UnclearedErrorsResult'

  /practice/bump-error-levels:
    post:
      tags: [Practice]
      summary: 批量递增错题严重程度
      description: >-
        错题清零后仍有错误的题，level + 1 标记未掌握。请求体为 main_error_books.id 列表。
      operationId: bumpErrorLevels
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BumpErrorLevelsRequest'
      responses:
        '200':
          description: 已递增
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        nullable: true

  # Training
  /training/error-book:
    get:
      tags: [Training]
      summary: 错题练习筛选列表
      description: >-
        训练模块错题列表（student JWT，@Roles('student')）。只返回未清零（is_cleared=0）
        的 main_error_books 记录；from/to 按 created_at 过滤（to 含当天，即 < to+1day）；
        type 过滤走 questions.type；kpId 过滤走 EXISTS question_knowledge_points。
        同一错题挂多 KP 时按 errorBookId 聚合 kpIds 数组。
      operationId: getTrainingErrorBook
      security: [{ bearerAuth: [] }]
      parameters:
        - name: subjectId
          in: query
          required: true
          schema:
            type: integer
          description: 学科 id（必填，非整数 400）
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: 起始日期（含），按 created_at 过滤
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: 截止日期（含当天，服务端按 < to+1day 处理）
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: 题型过滤（choice/fill_blank/true_false/short_answer/proof）
        - name: kpId
          in: query
          required: false
          schema:
            type: integer
          description: 知识点 id（专项筛选）；传非数字 400
      responses:
        '200':
          description: 错题列表（未清零，多 KP 已聚合）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TrainingErrorBookEntry'

  /training/questions/explanations:
    get:
      tags: [Training]
      summary: 批量拉取题目解析（结果页末题后）
      description: >-
        按题目 id 批量取 questions.explanation（student JWT）。ids 为逗号分隔的
        questionId 列表；DB 已有直返；解析仍在后台生成中（判错触发的 in-flight）
        则等待其完成（总超时 60s 兜底）；既无解析也无在途生成（从未触发或曾失败）
        返回 null——不触发新生成。解析为题级公开数据（不分学生）。
      operationId: getTrainingExplanations
      security: [{ bearerAuth: [] }]
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: string
          description: 逗号分隔的 questionId 列表（如 ids=1,2,3）
      responses:
        '200':
          description: 解析映射
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: '{ questionId: 解析文本或 null }'

  /training/questions/{questionId}/explanation-wait:
    get:
      tags: [Training]
      summary: 单题刷新等待解析（120s 倒计时）
      description: >-
        结果页「解析生成中」的刷新入口（student JWT）。DB 已有直返；在途生成
        等待；无在途且无解析（曾失败）则重新触发生成再等待，上限 120s。
        题目不存在/停用返回 null（不触发生成）。超时或失败返回 null 并写
        admin_notifications（type=explanation_failed，同题未读去重），管理员
        需人工补题解。
      operationId: waitTrainingExplanation
      security: [{ bearerAuth: [] }]
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 解析文本或 null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          explanation:
                            type: string
                            nullable: true

  /training/judge:
    post:
      tags: [Training]
      summary: 训练判题（题中心变体，JudgeCore 复用）
      description: >-
        错题练习/专项练习逐题判分（student JWT）。source 枚举 targeted|error_practice
        （错题练习/专项练习来源，非法值 400，不透传客户端任意值）。三路由镜像
        /practice/judge：(1) choice/true_false + fill_blank 归一化相等 -> exact 比对；
        (2) fill_blank 不等 / short_answer / proof -> AI JudgmentCapability 判定；
        (3) 答错 -> find-or-create 写 main_error_books（source 落库为训练来源）；
        答对 -> 清零该题所有未清记录（不限 source）。判错同时后台异步生成解析
        入 questions.explanation（ExplanationCacheService，不阻塞判题响应，详见
        /training/questions/explanations）。训练题必来自题库（无「未命中
        AI + 结构化入库」分支）：题目不存在 400（code=4004）；AI 判定失败 503
        （code=5001，不写错题本）。
      operationId: judgeTraining
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingJudgeRequest'
      responses:
        '200':
          description: 判定结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/JudgeResult'
        '400':
          description: source 非法或题目不存在（code=4004）
        '503':
          description: AI 判定失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 5001
                  message:
                    type: string
                    example: 判定失败，请重试

  /training/self-assess:
    post:
      tags: [Training]
      summary: 主观题学生自评（self_assess 模式）
      description: >-
        主观题学生对照参考答案自评对错（student JWT）。请求体：
        {questionId, subjectId, assessment, source, sourceRefId?}；
        assessment 枚举 correct|incorrect；source 枚举
        targeted|error_practice|exam（非法值 400）；sourceRefId 仅
        source='exam' 时传 sessionId，其余来源不传。每次自评写入
        question_self_assessments 留痕；incorrect 写入/复用
        main_error_books（source 落库为训练/考试来源）并触发解析缓存兜底生成；
        correct 清零该题所有未清记录。题目不存在 404。
      operationId: selfAssessTraining
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingSelfAssessRequest'
      responses:
        '200':
          description: 自评结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          errorBookId:
                            type: integer
                            nullable: true
                            description: incorrect 时返回写入/复用的错题本 id；correct 清零时省略该键（缺键按 null 理解）
        '400':
          description: source/assessment 非法或 questionId/subjectId 非正整数
        '404':
          description: 题目不存在

  /training/bump-error-levels:
    post:
      tags: [Training]
      summary: 批量递增错题严重程度（训练）
      description: >-
        错题重做仍答错时 level + 1 标记未掌握（镜像 /practice/bump-error-levels）。
        请求体为 main_error_books.id 列表。
      operationId: bumpTrainingErrorLevels
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BumpErrorLevelsRequest'
      responses:
        '200':
          description: 已递增
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        nullable: true

  /training/hint:
    post:
      tags: [Training]
      summary: 训练提示（AI 生成 + 题级缓存）
      description: >-
        训练答题前点「提示」调用（student JWT）。与 /practice/hint 的 Card 级缓存
        不同，这里走题级 question_hints 表缓存（题级共享，不分学生）：命中直返
        （不调 AI）；未命中调 HintCapability 生成苏格拉底式提示（只启发不给答案）
        并写回缓存（写回失败不阻断返回）。题目不存在 404；AI 生成失败 503
        （code=5001）。
      operationId: getTrainingHint
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingHintRequest'
      responses:
        '200':
          description: 提示内容
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TrainingHintResult'
        '404':
          description: 题目不存在
        '503':
          description: AI 提示生成失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 5001
                  message:
                    type: string
                    example: 提示生成失败，请重试

  /training/knowledge-points:
    get:
      tags: [Training]
      summary: 专项练习知识点平铺列表
      description: >-
        专项练习配置页的知识点数据（student JWT）。返回平铺列表，树形组装放前端
        （按 parentKpId 自行组树）。
      operationId: getTrainingKnowledgePoints
      security: [{ bearerAuth: [] }]
      parameters:
        - name: subjectId
          in: query
          required: true
          schema:
            type: integer
          description: 学科 id
      responses:
        '200':
          description: 知识点平铺列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TrainingKnowledgePoint'

  /training/targeted/start:
    post:
      tags: [Training]
      summary: 专项练习开练（按学科 + 知识点随机抽题）
      description: >-
        专项练习配置完成后开练（student JWT）。count 限 1-20 整数（越界/非整数 400）；
        type 白名单 choice|fill_blank|true_false|short_answer|proof 或 null（不限题型，
        非法 400）。题单白名单序列化：只出 questionId/text/type/options，
        answer/explanation 等字段一律剥离（防答案泄露）；options 为 JSON 字符串
        parse 后的数组（无/坏 JSON 为 null）。抽不到题返回空数组（空集合非错误，
        前端判空显示提示）。选题时基于 JWT user.sub（studentId）排除该生已标记的
        「不再展示」题（LEFT JOIN student_hidden_questions ... IS NULL），
        请求体不变；题池排除后为空时返回 { questions: [] }。
      operationId: startTargetedPractice
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetedStartRequest'
      responses:
        '200':
          description: 随机题单（可能为空数组）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TargetedStartResult'
        '400':
          description: count 越界或 type 非法

  # 语文古诗文默写（2026-09-13）
  /training/dictation/passages:
    get:
      tags: [Training]
      summary: 语文默写篇目清单（配置页用）
      description: >-
        语文默写配置页的篇目数据（student JWT）。仅返回 questions.is_active=1 且
        dictation_passages.verified=1 的已校验篇目，按 sort_order, id 排序。
        只出篇名 + 册次——作者/朝代/正文是学生要作答的三个判题字段，一律不下发
        （防答案泄露）。本清单不排除该生已标记「不再展示」的篇目。
      operationId: listDictationPassages
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 已校验篇目清单（只含篇名与册次）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DictationPassageListResult'

  /training/dictation/start:
    post:
      tags: [Training]
      summary: 语文默写开练（按册次随机抽题或按指定篇目出题）
      description: >-
        语文默写开练（student JWT）。count 限 1-20 整数（越界/非整数 400）；
        semester 限 上册|下册|null（null=全部册次，非法 400）；questionIds 为正整数
        数组或 null——非空时按指定篇目出题（忽略 semester，仅保留已校验篇目），
        否则按册次随机抽题。        题项白名单序列化：只出 questionId/prompt/workTitle/semester，
        author/dynasty/正文一律剥离（防答案泄露，与 targeted/start 同规矩）。
        「不再展示」排除仅作用于随机抽题路径——按册次随机抽题时基于 JWT
        user.sub（studentId）LEFT JOIN student_hidden_questions ... IS NULL 排除
        该生已标记的篇目；按 questionIds 指定篇目的路径不做该排除。
        题池为空返回 { questions: [] }。
      operationId: startDictation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DictationStartRequest'
      responses:
        '200':
          description: 默写题单（可能为空数组）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DictationStartResult'
        '400':
          description: count 越界、semester 非法或 questionIds 非法

  /training/dictation/judge:
    post:
      tags: [Training]
      summary: 语文默写判题（纯程序化判对错 + 可选 LLM 错因）
      description: >-
        语文默写判题（student JWT）。判对错**纯程序化，不调用 LLM**：三字段各自
        normalizeChineseAnswer（NFKC 全半角归一 → 去空白 → 去中英文标点 → 小写）后
        全等，三项全对才 isCorrect=true（故正文带不带标点/空格/全半角不影响判定）。
        正文不等时由 diffChinese（LCS 逐字差异）定位，相邻「漏写+多写」合并为一个
        wrong（写错字）、连续同类项合并成段。questionId 须正整数（非法 400），
        篇目不存在 404。答错 find-or-create 写 main_error_books（source='dictation'）；
        答对清零该题所有未清记录。错因文案由 dictation_feedback 场景 LLM 生成
        （primary=local，fallback=deepseek-v4-flash，timeout 30s），失败只丢文案
        不丢判题结果（feedback=null）。
      operationId: judgeDictation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DictationJudgeRequest'
      responses:
        '200':
          description: 判题结果（含程序化差异定位与可选错因文案）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DictationJudgeResult'
        '400':
          description: questionId 非法
        '404':
          description: 默写篇目不存在

  /api/training/hidden/mark:
    post:
      tags: [training]
      summary: 标记某题不再展示（幂等）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionId, subjectId]
              properties:
                questionId: { type: integer, format: int64, minimum: 1 }
                subjectId: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: 标记成功（幂等：重复标记不报错）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommonResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: 题目不存在 }

  /api/training/hidden:
    get:
      tags: [training]
      summary: 不再展示清单（按标记时间倒序）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: subjectId
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 清单
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HiddenQuestion' }
    delete:
      tags: [training]
      summary: 全部重置（清空该生所有不再展示标记）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 重置成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommonResponse' }

  /api/training/hidden/{questionId}:
    delete:
      tags: [training]
      summary: 撤销单条标记
      security: [{ bearerAuth: [] }]
      parameters:
        - name: questionId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: 撤销成功（幂等）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommonResponse' }

  # Exams
  /exams/papers:
    get:
      tags: [Exams]
      summary: 试卷列表
      description: >-
        真题试卷列表（student JWT，@Roles('student')）。subjectId 必填 integer；
        year（integer）/district/examType/gradeBand（string）可选叠加筛选；
        按 year DESC, id DESC 排序。列表仅试卷元数据（不含题目）。
      operationId: listExamPapers
      security: [{ bearerAuth: [] }]
      parameters:
        - name: subjectId
          in: query
          required: true
          schema:
            type: integer
          description: 学科 id（必填，非整数 400）
        - name: year
          in: query
          required: false
          schema:
            type: integer
          description: 年份过滤（非数字忽略）
        - name: district
          in: query
          required: false
          schema:
            type: string
          description: 地区过滤
        - name: examType
          in: query
          required: false
          schema:
            type: string
          description: 试卷类型过滤
        - name: gradeBand
          in: query
          required: false
          schema:
            type: string
          description: 学段过滤（primary/junior/senior）
      responses:
        '200':
          description: 试卷列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExamPaper'

  /exams/papers/{id}:
    get:
      tags: [Exams]
      summary: 试卷详情（题目元数据 + 推荐时长）
      description: >-
        试卷详情（student JWT）。durationMinutes 为推荐时长：choice/true_false
        每题 1 分钟、其余每题 3 分钟，总和向上取整到 15 的倍数，clamp 到
        [30, 180]。白名单序列化：questions 只含
        questionId/questionNo/text/type/options（options 为 JSON 字符串
        parse 后的数组，无/坏 JSON 为 null），answer/explanation 一律剥离
        （考试防作弊）。试卷不存在 404。
      operationId: getExamPaperDetail
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 试卷 id
      responses:
        '200':
          description: 试卷详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExamPaperDetail'
        '404':
          description: 试卷不存在

  /exams/sessions:
    post:
      tags: [Exams]
      summary: 开考/续考
      description: >-
        开考或续考（student JWT）。durationMinutes 限 10-300 整数
        （越界/非整数 400）；试卷不存在 404。续考语义：同学生同卷已有
        in_progress 会话直接返回既有会话（deadlineAt 不变、不重置时长），
        否则新建（deadline = now + duration）。命中的续考会话已超时则
        先自动收卷再返回 status='submitted'（不新建）。新建/续考响应同构。
      operationId: createExamSession
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamSessionCreateRequest'
      responses:
        '200':
          description: 会话已创建或续考（含题单与剩余秒数）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExamSessionCreated'
        '400':
          description: durationMinutes 越界（仅允许 10-300 的整数）
        '404':
          description: 试卷不存在

  /exams/sessions/{id}:
    get:
      tags: [Exams]
      summary: 会话状态（断线恢复）
      description: >-
        考试会话状态（student JWT）。会话不存在 404；非本人 403。
        answered 为 questionId -> {answerText} map，只含作答文本，
        判题字段（对错/题解）一律剥离（考试防作弊）。发现已超 deadline
        的 in_progress 会话时服务端自动收卷（与手动交卷同一 finalize
        逻辑）后返回 status='submitted'、remainingSeconds=0。
      operationId: getExamSession
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 会话 id
      responses:
        '200':
          description: 会话状态（可能已被自动收卷为 submitted）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExamSessionState'
        '403':
          description: 无权访问该考试会话（非本人）
        '404':
          description: 考试会话不存在

  /exams/sessions/{id}/answers:
    post:
      tags: [Exams]
      summary: 单题提交（同步判题，白名单响应）
      description: >-
        考试逐题作答（student JWT）。同步走 JudgeCore（source='exam',
        sourceRefId=sessionId）：客观题 exact 即返，主观题 AI 判定
        （judgment per-scene 90s）；判题结果全量落 exam_answers，
        答错由 JudgeCore 写 main_error_books。判题失败先落 answerText
        （在途，is_correct NULL，交卷时统一补判）、错误透传前端重试。
        响应白名单 {saved:true}——不回传对错（考试防作弊设计，
        对错只在交卷后的 results 出现）。错误：题目不在题单 400；
        已交卷再提交 409（code=4101）；超 deadline 先自动收卷再 409
        （code=4102，未作答按错计一并落库）。
      operationId: submitExamAnswer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 会话 id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamSubmitAnswerRequest'
      responses:
        '200':
          description: 已保存（白名单，不含对错）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExamAnswerSaved'
        '400':
          description: 题目不在该试卷题单中
        '409':
          description: 已交卷（code=4101）或超时已自动收卷（code=4102）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 4102
                  message:
                    type: string
                    example: 考试时间已到，已自动收卷
        '403':
          description: 无权访问该考试会话（非本人）
        '404':
          description: 考试会话不存在

  /exams/sessions/{id}/submit:
    post:
      tags: [Exams]
      summary: 交卷（幂等）
      description: >-
        交卷（student JWT，幂等：已 submitted 直接重算汇总返回）。
        收卷三分支（手动交卷与超时自动收卷共用 finalize）：未作答 ->
        直接判错入错题本（method='unanswered'，无答案可判不走判题）；
        在途（有作答、is_correct NULL）-> JudgeCore 补判，失败按错计
        （method='failed'）仍入错题本；已判题 -> 跳过。最后
        markSubmitted 并返回汇总（accuracy 为百分比一位小数）。
      operationId: submitExam
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 会话 id
      responses:
        '200':
          description: 交卷汇总（重复调用幂等返回）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExamSummary'
        '403':
          description: 无权访问该考试会话（非本人）
        '404':
          description: 考试会话不存在

  /exams/sessions/{id}/results:
    get:
      tags: [Exams]
      summary: 结果页（逐题对错 + 解析）
      description: >-
        考试结果（student JWT）：仅 submitted 会话可查，in_progress 409
        （code=4103）。items JOIN questions 带解析：逐题
        isCorrect（0|1|null，null=主观题待自评）、answerText、
        answer（参考答案，自评对照展示）、needsSelfAssessment（主观题待自评）、
        selfAssessment（该生最近一次自评 correct|incorrect|null）、
        analysis（判题题解）与 explanation（题库解析）；内嵌与交卷汇总同构的
        correctCount/totalCount/accuracy/subjectiveCount——主观题
        （self_assess 模式 is_correct=NULL）不计对错，correctCount/accuracy
        只算客观题。跨模式口径：subjectiveCount 按 is_correct NULL 推断，
        遗留 ai 模式已判主观行（is_correct 非 NULL）计为客观错题。
      operationId: getExamResults
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 会话 id
      responses:
        '200':
          description: 逐题结果与汇总
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExamResults'
        '409':
          description: 考试尚未交卷，暂无成绩（code=4103）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 4103
                  message:
                    type: string
                    example: 考试尚未交卷，暂无成绩
        '403':
          description: 无权访问该考试会话（非本人）
        '404':
          description: 考试会话不存在

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CommonResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
      required: [code, message]

    StarMapData:
      type: object
      description: 星图渲染数据（章节=单元，小节=课）
      properties:
        subjectName:
          type: string
        gradeName:
          type: string
          description: 当前学期名称，如「九年级下册」
        publisher:
          type: string
        totalUnits:
          type: integer
        completedUnits:
          type: integer
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/StarMapChapter'
      required: [subjectName, gradeName, totalUnits, completedUnits, chapters]

    StarMapChapter:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        order:
          type: integer
        importance:
          type: string
          enum: [large, medium, small]
        status:
          type: string
          enum: [completed, current, locked]
        progress:
          type: integer
          description: 0-100
        sections:
          type: array
          items:
            $ref: '#/components/schemas/StarMapSection'
      required: [id, title, order, importance, status, progress, sections]

    StarMapSection:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        order:
          type: integer
        knowledgePointCount:
          type: integer
        status:
          type: string
          enum: [completed, current, locked]
        progress:
          type: integer
          description: 0-100
      required: [id, title, order, knowledgePointCount, status, progress]

