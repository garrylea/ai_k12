    get:
      tags: [Parent]
      summary: 学情报告（实时聚合，不落库）
      description: >-
        服务层实时聚合，不调 LLM、不写 learning_reports。`period` 非法值归一化为 `weekly`（不 400）。
        无数据时返回 200 + 空数组 / `rate: null`，不是 404。
      operationId: getReport
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [weekly, monthly]
            default: weekly
          description: 窗口口径；`weekly` = 近 7 天（含今天），`monthly` = 近 30 天。
      responses:
        '200':
          description: 学情报告
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LearningReport'
  /parent/students/{studentId}/errors:
    get:
      tags: [Parent]
      summary: 孩子错题（只读）
      description: >-
        `track` 由 `source` 现算、不落库，分档表是服务端
        `apps/server/src/database/repositories/parent-insights.repo.ts` 的 `TRACK_SOURCES`（唯一真源）：
        `main` = `practice | discuss | exam`；`training` = `targeted | error_practice | auxiliary`。
        孩子**在辅线答疑里问过**的题（`source = 'auxiliary'`）归 `training`——它进训练轨
        「错题练习」池、孩子能在那里做对清零，所以不单列「辅线」档。
        `pageSize` 服务端固定 20，前端不传；`page` 非法（`abc` / `1.5` / `-1`）→ 400 / 1001，不静默回落。
        `page` 超出末页 → 200 + 空 `items` + 正确 `total`。
      operationId: listParentErrors
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: subject
          in: query
          required: false
          schema:
            type: integer
          description: 按学科筛选（subjectId）；不传 = 全部。
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [practice, discuss, exam, targeted, error_practice, auxiliary]
          description: 按错题来源筛选；不传 = 全部。
        - name: track
          in: query
          required: false
          schema:
            type: string
            enum: [main, training]
          description: 主线 / 训练；不传 = 全部。在仓储层展开为 `source IN (...)` 白名单后下推 SQL（两档的 source 列表见 `TRACK_SOURCES`）。
        - name: cleared
          in: query
          required: false
          schema:
            type: string
            enum: [uncleared, cleared, all]
            default: all
          description: 清零状态；`all` 与不传等价。
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: 起始日期（按 `created_at`，`YYYY-MM-DD`）；非法日期忽略该筛选。
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: 结束日期（按 `created_at`，`YYYY-MM-DD`）；非法日期忽略该筛选。
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: 错题分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ParentErrorPage'
        '400':
          description: page 非法（code=1001）
  /parent/students/{studentId}/chat-logs:
    get:
      tags: [Parent]
      summary: AI 对话回放列表
      description: >-
        `q` 只匹配会话标题 `ai_dialogues.title`，不搜消息正文。
        不提供学科筛选——`ai_dialogues.subject_id` 约 76% 为 NULL。
        `pageSize` 服务端固定 20；`page` 非法 → 400 / 1001。
      operationId: listChatLogs
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: track
          in: query
          required: false
          schema:
            type: string
            enum: [mainline, auxiliary]
          description: 不传 = 全部。
        - name: scene
          in: query
          required: false
          schema:
            type: string
            enum: [aux_qna, aux_training, mainline_question, mainline_card]
          description: 不传 = 全部。
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: 起始日期（按 `updated_at`，`YYYY-MM-DD`）；非法日期忽略该筛选。
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: 结束日期（按 `updated_at`，`YYYY-MM-DD`）；非法日期忽略该筛选。
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: 标题关键词（`LIKE %q%`），只搜 `ai_dialogues.title`。
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: 对话分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ChatLogPage'
        '400':
          description: page 非法（code=1001）
