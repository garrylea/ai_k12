  # StudySessions（学习会话采集，全部 @Roles('student')）
  /study-sessions:
    post:
      tags: [StudySessions]
      summary: 开始学习会话（幂等，201）
      description: >-
        **201**（Nest `@Post` 默认，本仓无 `@HttpCode` 覆盖）。`sessionUid` 由前端生成、
        是幂等键：同 uid 重复 POST 返回**既有**会话（不新建、不报错）；但该 uid 已被别的学生
        占用 → 400 / 1001（静默返回别人 startedAt 会让前端以为会话在跑，后续心跳全会落空）。
        `module` / `scene` 必须在**封闭字典**内；设备三项 `screenClass` / `inputType` /
        `appShell` 命中白名单取原值、否则**落 NULL 不报错**（设备信息是尽力而为）；
        `platformClass` / `browser` 由服务端解析 `User-Agent`，**不接受客户端上报**。
      operationId: startStudySession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartStudySessionRequest'
      responses:
        '201':
          description: 会话已创建（或幂等复用既有会话）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sessionUid:
                            type: string
                          startedAt:
                            type: string
                            format: date-time
        '400':
          description: 参数不合法（code=1001）：sessionUid 非 UUID / 未知 module / 未知 scene / 未知学科 / 会话标识冲突
  /study-sessions/{uid}/heartbeat:
    patch:
      tags: [StudySessions]
      summary: 会话心跳（PATCH 默认 200）
      description: >-
        服务端按 `last_heartbeat_at → NOW(3)` 差值累加，只在**上一状态为 visible** 时计
        （hidden 暂停计时），**单次封顶 45s**（不封顶时「关标签 2 小时」会被算成 2 小时）。
        会话不存在 / 非本人 / 非 `active` → **静默 200 + `activeSeconds: null`**
        （不报错：心跳是尽力而为，报错只会污染前端日志）。
      operationId: heartbeatStudySession
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          description: 前端生成的 `sessionUid`（UUID）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
      responses:
        '200':
          description: 累计时长；未命中时 data.activeSeconds 为 null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          activeSeconds:
                            type: integer
                            nullable: true
                            description: 当前累计秒数；null = 会话不存在 / 非本人 / 非 active（静默）
        '400':
          description: state 不是 visible / hidden（code=1001）
  /study-sessions/{uid}/end:
    patch:
      tags: [StudySessions]
      summary: 结束学习会话（幂等）
      description: >-
        先补计最后一段（同心跳的封顶规则，但不改 `client_state`），再落 `status='ended'` /
        `end_reason` / `ended_at=NOW(3)`。已结束 / 不存在 → **幂等返回现有值**
        （不报错、不重复计）。
      operationId: endStudySession
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          description: 前端生成的 `sessionUid`（UUID）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndSessionRequest'
      responses:
        '200':
          description: 最终累计时长与结束时间
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          activeSeconds:
                            type: integer
                            nullable: true
                          endedAt:
                            type: string
                            format: date-time
                            nullable: true
        '400':
          description: reason 不在枚举内（code=1001）

