<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="680" height="500" fill="#ffffff"/>

  <!-- 层1：客户端层 -->
  <g filter="url(#shadow)">
    <rect x="40" y="40" width="600" height="78" rx="10" fill="#eff6ff"/>
    <rect x="40" y="40" width="10" height="78" rx="10" fill="#2563eb"/>
    <text x="68" y="79" font-size="20" font-weight="700" fill="#1e3a8a" dominant-baseline="middle">客户端层<tspan fill="#475569" font-weight="400">　WebApp / PC App / 家长端</tspan></text>
  </g>

  <!-- 层2：接入网关层 -->
  <g filter="url(#shadow)">
    <rect x="40" y="126" width="600" height="70" rx="10" fill="#ecfeff"/>
    <rect x="40" y="126" width="10" height="70" rx="10" fill="#0891b2"/>
    <text x="68" y="161" font-size="20" font-weight="700" fill="#155e75" dominant-baseline="middle">接入网关层<tspan fill="#475569" font-weight="400">　API Gateway（路由 / 鉴权 / 限流）</tspan></text>
  </g>

  <!-- 层3：应用服务层 -->
  <g filter="url(#shadow)">
    <rect x="40" y="204" width="600" height="100" rx="10" fill="#f5f3ff"/>
    <rect x="40" y="204" width="10" height="100" rx="10" fill="#7c3aed"/>
    <text x="68" y="240" font-size="20" font-weight="700" fill="#4c1d95" dominant-baseline="middle">应用服务层<tspan fill="#475569" font-weight="400">　Content / Assessment / ErrorBook</tspan></text>
    <text x="78" y="272" font-size="20" fill="#475569" dominant-baseline="middle">/ Conversation / KnowledgeGraph</text>
  </g>

  <!-- 层4：通用智能能力层 -->
  <g filter="url(#shadow)">
    <rect x="40" y="312" width="600" height="70" rx="10" fill="#fdf2f8"/>
    <rect x="40" y="312" width="10" height="70" rx="10" fill="#db2777"/>
    <text x="68" y="347" font-size="20" font-weight="700" fill="#9d174d" dominant-baseline="middle">通用智能能力层<tspan fill="#475569" font-weight="400">　AI-Agent 中枢</tspan></text>
  </g>

  <!-- 层5：基础设施层 -->
  <g filter="url(#shadow)">
    <rect x="40" y="390" width="600" height="78" rx="10" fill="#f8fafc"/>
    <rect x="40" y="390" width="10" height="78" rx="10" fill="#475569"/>
    <text x="68" y="429" font-size="20" font-weight="700" fill="#1e293b" dominant-baseline="middle">基础设施层<tspan fill="#475569" font-weight="400">　MySQL / Redis / OSS / RabbitMQ</tspan></text>
  </g>

</svg>
