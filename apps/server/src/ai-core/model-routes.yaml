# Model connection configs (§7.2, Appendix C.1)
models:
  kimi:
    provider: kimi
    modelId: kimi-latest
    baseUrl: ${KIMI_BASE_URL}
    apiKey: ${KIMI_API_KEY}
    contextWindow: 131072
    maxOutputTokens: 16384
    costPer1K:
      input: 0.012
      output: 0.012
    supportsStreaming: true

  qwen-3.7-max:
    provider: qwen
    modelId: qwen-3.7-max
    baseUrl: ${QWEN_BASE_URL}
    apiKey: ${QWEN_API_KEY}
    contextWindow: 131072
    maxOutputTokens: 32768
    costPer1K:
      input: 0.007
      output: 0.028
    supportsStreaming: true

  gemini-3.1-pro:
    provider: gemini
    modelId: gemini-3.1-pro
    baseUrl: ${GEMINI_BASE_URL}
    apiKey: ${GEMINI_API_KEY}
    contextWindow: 1048576
    maxOutputTokens: 65536
    costPer1K:
      input: 0.0025
      output: 0.01
    supportsStreaming: true

  deepseek-v4-flash:
    provider: deepseek
    modelId: deepseek-v4-flash
    baseUrl: ${DEEPSEEK_BASE_URL}
    apiKey: ${DEEPSEEK_API_KEY}
    contextWindow: 131072
    maxOutputTokens: 65536
    costPer1K:
      input: 0.001
      output: 0.004
    supportsStreaming: true

# Route rules (§3.1.3)
routes:
  tutoring:
    - subject: math
      difficulty: [1, 2]
      primary: qwen-3.7-max
      fallback: deepseek-v4-flash
    - subject: math
      difficulty: [3]
      primary: gemini-3.1-pro
      fallback: qwen-3.7-max
    - subject: chinese
      primary: kimi
      fallback: deepseek-v4-flash
    - subject: english
      primary: kimi
      fallback: qwen-3.7-max

  grading:
    - subject: math
      primary: qwen-3.7-max
      fallback: kimi
    - subject: chinese
      primary: kimi
      fallback: qwen-3.7-max
    - subject: english
      primary: kimi
      fallback: qwen-3.7-max

  explanation:
    - subject: math
      primary: qwen-3.7-max
      fallback: deepseek-v4-flash
    - subject: chinese
      primary: kimi
      fallback: qwen-3.7-max
    - subject: english
      primary: kimi
      fallback: qwen-3.7-max

  variation:
    - subject: math
      primary: qwen-3.7-max
      fallback: gemini-3.1-pro

  analysis:
    - subject: "*"
      primary: kimi
      fallback: qwen-3.7-max

  safety:
    - subject: "*"
      primary: deepseek-v4-flash

default:
  primary: qwen-3.7-max
  fallback: deepseek-v4-flash
