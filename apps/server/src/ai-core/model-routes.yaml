# Model connection configs (§7.2, Appendix C.1)
models:
  kimi:
    provider: kimi
    modelId: kimi-latest
    baseUrl: ${KIMI_BASE_URL}
    apiKey: ${KIMI_API_KEY}
    contextWindow: 131072
    maxOutputTokens: 16384
    costPer1K:
      input: 0.012
      output: 0.012
    supportsStreaming: true

  qwen3.7-max:
    provider: qwen
    modelId: qwen3.7-max
    baseUrl: ${QWEN_BASE_URL}
    apiKey: ${QWEN_API_KEY}
    contextWindow: 131072
    maxOutputTokens: 32768
    costPer1K:
      input: 0.007
      output: 0.028
    supportsStreaming: true

  gemini-3.1-pro:
    provider: gemini
    modelId: gemini-3.1-pro
    baseUrl: ${GEMINI_BASE_URL}
    apiKey: ${GEMINI_API_KEY}
    contextWindow: 1048576
    maxOutputTokens: 65536
    costPer1K:
      input: 0.0025
      output: 0.01
    supportsStreaming: true

  deepseek-v4-flash:
    provider: deepseek
    modelId: deepseek-v4-flash
    baseUrl: ${DEEPSEEK_BASE_URL}
    apiKey: ${DEEPSEEK_API_KEY}
    contextWindow: 131072
    maxOutputTokens: 65536
    costPer1K:
      input: 0.001
      output: 0.004
    supportsStreaming: true

  # Task 14a: multimodal model for image-based tutoring. Reuses QWEN_API_KEY/QWEN_BASE_URL.
  # modelId is the dashscope model ID; if it differs (e.g. qwen2.5-vl-72b-instruct), adjust here.
  qwen-vl-max:
    provider: qwen
    modelId: qwen-vl-max
    baseUrl: ${QWEN_BASE_URL}
    apiKey: ${QWEN_API_KEY}
    contextWindow: 32768
    maxOutputTokens: 8192
    costPer1K:
      input: 0.02
      output: 0.06
    supportsStreaming: true

  # P1: VL model for image transcription (OCR + geometry description).
  # qwen3-vl-plus supports JSON output reliably; thinking NOT enabled (decision 8).
  qwen3-vl-plus:
    provider: qwen
    modelId: qwen3-vl-plus
    baseUrl: ${QWEN_BASE_URL}
    apiKey: ${QWEN_API_KEY}
    contextWindow: 32768
    maxOutputTokens: 8192
    costPer1K:
      input: 0.004
      output: 0.012
    supportsStreaming: true

# Route rules (§3.1.3)
routes:
  # P1: image transcription -> qwen3-vl-plus (fallback qwen-vl-max). Pure OCR,
  # no tutoring. Selection classification reuses the structuring route (deepseek-v4-flash).
  transcribe:
    - subject: "*"
      primary: qwen3-vl-plus
      fallback: qwen-vl-max
  tutoring:
    - subject: math
      difficulty: [1, 2]
      primary: qwen3.7-max
      fallback: deepseek-v4-flash
    - subject: math
      difficulty: [3]
      primary: gemini-3.1-pro
      fallback: qwen3.7-max
    - subject: chinese
      primary: kimi
      fallback: deepseek-v4-flash
    - subject: english
      primary: kimi
      fallback: qwen3.7-max

  grading:
    - subject: math
      # deepseek-v4-flash 为主：qwen3.7-max 是 reasoner，难题判定常 >45s 超时
      # （实测多步综合题 >90s），改用 deepseek-v4-flash（实测 ~19s，已用于 structuring）。
      primary: deepseek-v4-flash
      fallback: qwen3.7-max
    - subject: chinese
      primary: kimi
      fallback: qwen3.7-max
    - subject: english
      primary: kimi
      fallback: qwen3.7-max

  judgment:
    - subject: math
      # 同 grading：判对错是轻量任务，无需重 reasoner。deepseek-v4-flash 快且可靠。
      primary: deepseek-v4-flash
      fallback: qwen3.7-max

  explanation:
    - subject: math
      primary: qwen3.7-max
      fallback: deepseek-v4-flash
    - subject: chinese
      primary: kimi
      fallback: qwen3.7-max
    - subject: english
      primary: kimi
      fallback: qwen3.7-max

  hint:
    # 课堂练习提示：轻量启发任务，用快模型（同 judgment/grading），无需重 reasoner。
    - subject: math
      primary: deepseek-v4-flash
      fallback: qwen3.7-max

  variation:
    - subject: math
      primary: qwen3.7-max
      fallback: gemini-3.1-pro

  analysis:
    - subject: "*"
      primary: kimi
      fallback: qwen3.7-max

  safety:
    - subject: "*"
      primary: deepseek-v4-flash

  structuring:
    - subject: "*"
      primary: deepseek-v4-flash
      fallback: qwen3.7-max

default:
  primary: qwen3.7-max
  fallback: deepseek-v4-flash
