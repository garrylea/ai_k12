# Model connection configs (§7.2, Appendix C.1)
models:
  kimi:
    provider: kimi
    modelId: kimi-latest
    baseUrl: ${KIMI_BASE_URL}
    apiKey: ${KIMI_API_KEY}
    contextWindow: 131072
    maxOutputTokens: 16384
    costPer1K:
      input: 0.012
      output: 0.012
    supportsStreaming: true

  qwen3.8-max:
    provider: qwen
    modelId: qwen3.8-max
    baseUrl: ${QWEN_BASE_URL}
    apiKey: ${QWEN_API_KEY}
    contextWindow: 131072
    maxOutputTokens: 32768
    costPer1K:
      input: 0.007
      output: 0.028
    supportsStreaming: true

  gemini-3.1-pro:
    provider: gemini
    modelId: gemini-3.1-pro
    baseUrl: ${GEMINI_BASE_URL}
    apiKey: ${GEMINI_API_KEY}
    contextWindow: 1048576
    maxOutputTokens: 65536
    costPer1K:
      input: 0.0025
      output: 0.01
    supportsStreaming: true

  deepseek-flash:
    provider: deepseek
    modelId: deepseek-flash
    baseUrl: ${DEEPSEEK_BASE_URL}
    apiKey: ${DEEPSEEK_API_KEY}
    contextWindow: 131072
    maxOutputTokens: 65536
    costPer1K:
      input: 0.001
      output: 0.004
    supportsStreaming: true

  # 训练模块判题主模型：本地 llama.cpp 服务（OpenAI 兼容）。modelId 写字面量
  # （测试与无 .env 的全新克隆结果确定）；baseUrl/apiKey 走 env。
  local:
    provider: local
    modelId: Qwen3.8-27B
    baseUrl: ${LOCAL_LLM_BASE_URL}
    apiKey: ${LOCAL_LLM_API_KEY}
    contextWindow: 32768
    maxOutputTokens: 4096
    costPer1K:
      input: 0
      output: 0
    supportsStreaming: true

# Route rules (§3.1.3)
routes:
  tutoring:
    - subject: math
      difficulty: [1, 2]
      primary: qwen3.8-max
      fallback: deepseek-flash
    - subject: math
      difficulty: [3]
      primary: gemini-3.1-pro
      fallback: qwen3.8-max
    - subject: chinese
      primary: kimi
      fallback: deepseek-flash
    - subject: english
      primary: kimi
      fallback: qwen3.8-max

  grading:
    - subject: math
      # deepseek-flash 为主：qwen3.8-max 是 reasoner，难题判定常 >45s 超时
      # （实测多步综合题 >90s），改用 deepseek-flash（实测 ~19s，已用于 structuring）。
      primary: deepseek-flash
      fallback: qwen3.8-max
    - subject: chinese
      primary: kimi
      fallback: qwen3.8-max
    - subject: english
      primary: kimi
      fallback: qwen3.8-max

  judgment:
    - subject: math
      # 训练模块（专项/考试/错题）判题默认走本地 Qwen3.8-27B；
      # 本地不可用回退 qwen3.8-max（JudgmentCapability 传 thinking:false）。
      primary: local
      fallback: qwen3.8-max

  explanation:
    - subject: math
      primary: qwen3.8-max
      fallback: deepseek-flash
    - subject: chinese
      primary: kimi
      fallback: qwen3.8-max
    - subject: english
      primary: kimi
      fallback: qwen3.8-max

  hint:
    # 课堂练习提示：轻量启发任务，用快模型（同 judgment/grading），无需重 reasoner。
    - subject: math
      primary: deepseek-flash
      fallback: qwen3.8-max

  variation:
    - subject: math
      primary: qwen3.8-max
      fallback: gemini-3.1-pro

  analysis:
    - subject: "*"
      primary: kimi
      fallback: qwen3.8-max

  safety:
    - subject: "*"
      primary: deepseek-flash

  structuring:
    - subject: "*"
      primary: deepseek-flash
      fallback: qwen3.8-max

  # 会话标题生成：本地模型优先（省调用、无外部依赖），本地不可用才用
  # deepseek-flash；两者都不可用则不生成标题（保留默认标题，学生可手动改）。
  title:
    - subject: "*"
      primary: local
      fallback: deepseek-flash

  # 语文古诗文默写错因文案：本地模型优先（与 judgment 同策略，不依赖外部余额），
  # 本地不可用回退 deepseek-flash；两者都失败则无错因文案（不阻断判题）。
  dictation_feedback:
    - subject: "*"
      primary: local
      fallback: deepseek-flash

  # 语文古诗文解释（翻译）判题：逐句判定字词释义与整句翻译是否「意思到位」。
  # 与 dictation_feedback 同策略（本地优先、云端兜底）；能确定的对错已由程序短路，
  # 走到这里的只有非语义判断不可的项。两者都失败 → 逐项 undetermined，不阻断学生看已判项。
  interpretation_judge:
    - subject: "*"
      primary: local
      fallback: deepseek-flash

  # 英语背单词判题：英→中「意思对不对」的语义判定（中→英方向是纯程序比对，不走模型）。
  # 与 dictation_feedback / interpretation_judge 同策略（本地优先、云端兜底）；
  # 两者都失败 → 该题 undetermined，不计对错、不写错题统计（判题失败不该让学生背锅）。
  english_word_judge:
    - subject: "*"
      primary: local
      fallback: deepseek-flash

  # 语文古诗文「含义」判题：判定每句的深层含义与作者情感是否到位。
  # 与 interpretation_judge 同策略（本地优先、云端兜底）；两者都失败 → 逐项 undetermined，
  # 不阻断学生看到已判的项。
  chinese_meaning_judge:
    - subject: "*"
      primary: local
      fallback: deepseek-flash

default:
  primary: qwen3.8-max
  fallback: deepseek-flash
