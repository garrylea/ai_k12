retry:
  maxRetries: 2
  initialDelayMs: 1000
  backoffMultiplier: 2
  retryableCodes:
    - RATE_LIMITED
    - SERVICE_UNAVAILABLE
    - TIMEOUT

timeout:
  default: 45000
  tutoring: 45000
  grading: 45000
  variation: 60000
  explanation: 60000
  safety: 10000

streaming:
  firstTokenTimeoutMs: 3000
  interTokenTimeoutMs: 10000
